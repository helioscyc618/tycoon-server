<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon (完整雲端旗艦版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Noto Serif TC & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: { 50: '#fdf2f2', 100: '#fde8e8', 600: '#b91c1c', 700: '#990000', 800: '#7f1d1d', 900: '#650000' },
                        gold: { 100: '#fef9c3', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', rich: '#D4AF37' },
                        cream: '#FFF8F0'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; background-color: #FFF8F0; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b91c1c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 28s linear infinite; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-800 bg-cream" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 text-gold-300 px-4 py-2 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2 border-gold-rich">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-green-900/60 text-green-200 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-cloud' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '雲端同步連線中 (Synced)' : '雲端連線中斷 (Offline)'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-gold-100">
                <i class="fas fa-clock mr-1 text-gold-400"></i> 台北時間 (UTC+8): <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-gold-300 font-semibold hidden sm:inline"><i class="fas fa-dice text-gold-400 mr-1"></i> 競賽期間: 2026/12/14 ~ 2027/06/02</span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-black/30 px-3 py-1 rounded-full border border-gold-rich/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 bg-gold-600 text-white rounded font-bold" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-red-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="bg-gold-rich hover:bg-gold-600 text-ruby-900 font-bold px-3 py-1 rounded shadow text-xs transition flex items-center space-x-1">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心後台</span>
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-ruby-800 text-gold-300 py-2 px-3 overflow-hidden whitespace-nowrap border-b border-gold-rich/30 relative flex items-center shadow-inner">
        <div class="bg-gold-rich text-ruby-900 font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow">
            <i class="fas fa-bullhorn mr-1"></i> 雲端戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide">
                <span x-text="settings.tickerText"></span>
                <span class="mx-6 text-gold-400">♦</span>
                <span>🔥 伺服器即時同步中：所有裝置資料全自動更新！</span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">

        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border-2 border-gold-rich/50 my-6">
                <div class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 p-6 text-center text-white relative">
                    <div class="w-16 h-16 bg-gold-rich text-ruby-900 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg border-2 border-white text-2xl">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider text-gold-300">競賽大亨</h1>
                    <p class="text-xs text-gold-100 mt-1 tracking-widest font-serif">Competition Tycoon (Cloud Flagship Edition)</p>
                </div>

                <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">更改密碼</button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-ruby-700 to-ruby-800 text-gold-300 font-bold py-3 rounded-lg shadow transition flex items-center justify-center space-x-2">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入雲端戰情室</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2 py-2 border rounded-lg text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" required class="w-full px-2 py-2 border rounded-lg text-sm" placeholder="預設：OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">選擇頭貼</label>
                                <div class="grid grid-cols-5 gap-2 mt-1">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" 
                                            class="p-2 text-2xl rounded-lg border text-center transition flex items-center justify-center"
                                            :class="regForm.avatar === av ? 'border-ruby-700 bg-ruby-50 ring-2 ring-ruby-600 scale-105' : 'border-gray-200 hover:bg-gray-100'"
                                            x-text="av">
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-500 text-ruby-900 font-bold py-3 rounded-lg shadow transition mt-2">
                                <i class="fas fa-user-plus"></i> 立即註冊同步至雲端伺服器
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'forgot'">
                        <form @submit.prevent="changePassword()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱</label>
                                <input type="email" x-model="pwdForm.email" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入您的註冊信箱">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">舊密碼</label>
                                <input type="password" x-model="pwdForm.oldPassword" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入舊密碼">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">新密碼</label>
                                <input type="password" x-model="pwdForm.newPassword" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入新密碼">
                            </div>
                            <button type="submit" class="w-full bg-ruby-800 text-white font-bold py-2.5 rounded-lg shadow text-sm">確認更改密碼</button>
                        </form>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Profile Banner -->
                <div class="bg-gradient-to-br from-white via-cream to-gold-100 rounded-2xl p-5 shadow-lg border border-gold-rich/40 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-ruby-800 text-gold-300 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2 border-gold-rich" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-ruby-900" x-text="currentUser.name"></h2>
                                <span class="px-2 py-0.5 bg-ruby-700 text-white text-xs rounded-full font-semibold" x-text="currentUser.rank"></span>
                                <span class="px-2 py-0.5 bg-gold-600 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-gray-600 mt-1">雲端即時連線中，多裝置資料已自動同步更新。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500">FYC 總額</span>
                            <span class="text-lg font-bold text-ruby-800" x-text="formatCurrency(currentUser.fyc)"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500">可用點數</span>
                            <span class="text-lg font-bold text-gold-600" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500">累積點數</span>
                            <span class="text-lg font-bold text-gray-800" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500">骰子次數</span>
                            <span class="text-lg font-bold text-ruby-700" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- CONTENT GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- LEFT -->
                    <div class="lg:col-span-5 space-y-6">
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar text-gold-600 mr-2"></i> 成績申報與任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (自動比例換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">輸入 FYC 金額</label>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" step="100" class="w-full px-3 py-2 border rounded-lg text-sm">
                                    </div>
                                </template>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">任務說明 / 備註 <span class="text-red-600">* (必填)</span></label>
                                    <input type="text" x-model="declForm.desc" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="詳細拜訪對象或案號...">
                                </div>
                                <button type="submit" class="w-full bg-ruby-800 text-white font-bold py-2.5 rounded-lg shadow hover:bg-ruby-900 transition text-sm">
                                    送出至雲端審核
                                </button>
                            </form>
                        </div>

                        <!-- 聊天留言板 -->
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-comments text-gold-600 mr-2"></i> 雲端士氣留言板</span>
                            </h3>
                            <form @submit.prevent="postMessage()" class="space-y-2 mb-4 pb-4 border-b">
                                <input type="text" x-model="msgForm.title" required class="w-full px-3 py-1.5 border rounded text-xs" placeholder="留言標題">
                                <textarea x-model="msgForm.content" required rows="2" class="w-full px-3 py-1.5 border rounded text-xs resize-none" placeholder="激勵內容..."></textarea>
                                <div class="flex justify-between items-center text-xs">
                                    <label class="flex items-center space-x-1 cursor-pointer">
                                        <input type="checkbox" x-model="msgForm.isAnonymous" class="rounded text-ruby-600">
                                        <span class="text-gray-600">匿名發言</span>
                                    </label>
                                    <button type="submit" class="bg-ruby-800 text-white px-4 py-1.5 rounded font-bold text-xs">發布留言</button>
                                </div>
                            </form>
                            <div class="space-y-3 max-h-56 overflow-y-auto pr-1">
                                <template x-for="(msg, mIndex) in messages" :key="mIndex">
                                    <div class="p-3 bg-cream rounded-xl border border-gold-300 text-xs space-y-1">
                                        <div class="flex justify-between font-bold text-ruby-900">
                                            <span x-text="msg.title"></span>
                                            <span class="text-[10px] text-gray-400" x-text="msg.time"></span>
                                        </div>
                                        <p class="text-gray-700" x-text="msg.content"></p>
                                        <span class="text-[10px] text-gold-700" x-text="'發言人: ' + (msg.isAnonymous ? '神秘夥伴' : msg.author)"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT: BOARD & DICE -->
                    <div class="lg:col-span-7 space-y-6">
                        <div class="bg-gradient-to-r from-ruby-900 via-ruby-800 to-ruby-900 p-5 rounded-2xl shadow-lg border-2 border-gold-rich text-white flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                <h3 class="text-lg font-bold ming-title text-gold-300"><i class="fas fa-dice text-gold-400 mr-2"></i> 大富翁擲骰推進區</h3>
                                <p class="text-xs text-gold-100 mt-0.5">每次擲骰消耗 <span class="font-bold text-white">10 點</span>。</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="text-center bg-black/40 px-3 py-1.5 rounded-xl border border-gold-rich/40">
                                    <span class="block text-[10px] text-gold-300">目前位置</span>
                                    <span class="text-base font-bold text-white font-mono" x-text="'第 ' + (currentUser.position + 1) + ' 格'"></span>
                                </div>
                                <button @click="rollDice()" :disabled="currentUser.points < 10 || isRolling" 
                                    class="bg-gradient-to-r from-gold-400 to-gold-600 text-ruby-900 font-bold px-6 py-3 rounded-xl shadow-lg transition disabled:opacity-50 text-sm">
                                    <span x-text="isRolling ? '滾動中...' : '立即擲骰 (10點)'"></span>
                                </button>
                            </div>
                        </div>

                        <!-- BOARD GRID -->
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-4"><i class="fas fa-map text-gold-600 mr-2"></i> 30格雲端大富翁棋盤</h3>
                            <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                                <template x-for="(cell, index) in settings.boardCells" :key="index">
                                    <div class="relative p-2 rounded-xl border-2 flex flex-col items-center justify-center h-20 text-center shadow-sm"
                                        :class="hasPlayerHere(index) ? 'border-ruby-700 bg-ruby-50 ring-2 ring-gold-rich' : 'border-gold-300 bg-cream'">
                                        <span class="absolute top-1 left-1 text-[9px] font-bold text-gray-400 font-mono" x-text="index + 1"></span>
                                        <span class="text-lg mb-1" x-text="cell.icon"></span>
                                        <span class="text-[10px] font-bold text-gray-800 line-clamp-1" x-text="cell.title"></span>
                                        <div class="flex flex-wrap justify-center gap-0.5 mt-1">
                                            <template x-for="p in getPlayersOnCell(index)" :key="p.email">
                                                <span class="text-xs" :title="p.name" x-text="p.avatar"></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- MODAL: ADMIN PANEL WITH ALL TABS -->
    <div x-show="openAdminModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-3 sm:p-6" x-transition>
        <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden shadow-2xl border-2 border-gold-rich flex flex-col">
            <div class="bg-ruby-900 p-4 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold text-gold-300"><i class="fas fa-shield-halved mr-2"></i> 指揮中心雲端後台</h2>
                <button @click="openAdminModal = false" class="text-gold-300 hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>

            <!-- Admin Login -->
            <template x-if="!adminAuth">
                <div class="p-8 max-w-md mx-auto text-center space-y-4 my-auto">
                    <h3 class="text-xl font-bold text-ruby-900 ming-title">請輸入管理者解鎖密碼</h3>
                    <p class="text-xs text-gray-500">預設密碼為：admin</p>
                    <input type="password" x-model="adminPassInput" @keyup.enter="verifyAdmin()" class="w-full px-3 py-2 border rounded text-center text-sm" placeholder="輸入管理者密碼">
                    <button @click="verifyAdmin()" class="w-full bg-ruby-800 text-white font-bold py-2.5 rounded shadow">解鎖指揮中心</button>
                </div>
            </template>

            <!-- Admin Full Tabs Panel -->
            <template x-if="adminAuth">
                <div class="flex flex-col flex-1 overflow-hidden">
                    <!-- Tabs Header -->
                    <div class="flex border-b bg-gray-100 text-xs sm:text-sm font-semibold overflow-x-auto">
                        <button @click="adminTab = 'approvals'" class="px-5 py-3 border-b-2 transition whitespace-nowrap" :class="adminTab === 'approvals' ? 'border-ruby-700 text-ruby-900 bg-white font-bold' : 'border-transparent text-gray-600 hover:text-gray-900'">成績與點數審核</button>
                        <button @click="adminTab = 'partners'" class="px-5 py-3 border-b-2 transition whitespace-nowrap" :class="adminTab === 'partners' ? 'border-ruby-700 text-ruby-900 bg-white font-bold' : 'border-transparent text-gray-600 hover:text-gray-900'">夥伴名單管理</button>
                        <button @click="adminTab = 'rewards'" class="px-5 py-3 border-b-2 transition whitespace-nowrap" :class="adminTab === 'rewards' ? 'border-ruby-700 text-ruby-900 bg-white font-bold' : 'border-transparent text-gray-600 hover:text-gray-900'">獎勵發放狀況</button>
                        <button @click="adminTab = 'settings'" class="px-5 py-3 border-b-2 transition whitespace-nowrap" :class="adminTab === 'settings' ? 'border-ruby-700 text-ruby-900 bg-white font-bold' : 'border-transparent text-gray-600 hover:text-gray-900'">遊戲與棋盤設定</button>
                    </div>

                    <!-- Tabs Body -->
                    <div class="p-6 overflow-y-auto flex-1 space-y-4 text-xs sm:text-sm bg-cream">
                        
                        <!-- TAB 1: APPROVALS -->
                        <template x-if="adminTab === 'approvals'">
                            <div class="space-y-3">
                                <h3 class="font-bold text-ruby-900 text-base mb-2">待審核申報項目 (<span x-text="declarations.length"></span>)</h3>
                                <template x-if="declarations.length === 0">
                                    <p class="text-gray-500 py-6 text-center">目前沒有待審核的項目。</p>
                                </template>
                                <div class="space-y-2">
                                    <template x-for="(req, rIdx) in declarations" :key="rIdx">
                                        <div class="p-3 bg-white border rounded-xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div>
                                                <div class="flex items-center space-x-2">
                                                    <span class="font-bold text-ruby-900 text-sm" x-text="req.userName"></span>
                                                    <span class="px-2 py-0.5 bg-gold-100 text-gold-700 text-[10px] rounded font-bold" x-text="req.tag"></span>
                                                    <span class="text-gray-400 text-[10px]" x-text="req.time"></span>
                                                </div>
                                                <p class="text-gray-700 mt-1" x-text="req.details"></p>
                                            </div>
                                            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                                <button @click="approveDecl(rIdx)" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded font-bold text-xs">通過 (+<span x-text="req.points"></span>點)</button>
                                                <button @click="rejectDecl(rIdx)" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded font-bold text-xs">拒絕</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- TAB 2: PARTNERS MANAGEMENT -->
                        <template x-if="adminTab === 'partners'">
                            <div class="space-y-4">
                                <h3 class="font-bold text-ruby-900 text-base mb-2">全體夥伴資料管理 (<span x-text="partners.length"></span>)</h3>
                                <div class="overflow-x-auto bg-white rounded-xl shadow border">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="bg-ruby-900 text-gold-300 text-xs">
                                                <th class="p-3">頭貼/姓名</th>
                                                <th class="p-3">職級/組別</th>
                                                <th class="p-3">FYC 總額</th>
                                                <th class="p-3">可用點數</th>
                                                <th class="p-3">骰子數</th>
                                                <th class="p-3">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y text-xs">
                                            <template x-for="(p, pIdx) in partners" :key="p.email">
                                                <tr class="hover:bg-cream">
                                                    <td class="p-3 flex items-center space-x-2">
                                                        <span class="text-xl" x-text="p.avatar"></span>
                                                        <span class="font-bold text-ruby-900" x-text="p.name"></span>
                                                    </td>
                                                    <td class="p-3">
                                                        <span x-text="p.rank"></span> / <span x-text="p.group"></span>
                                                    </td>
                                                    <td class="p-3 font-mono font-bold text-ruby-800" x-text="formatCurrency(p.fyc)"></td>
                                                    <td class="p-3 font-mono font-bold text-gold-700" x-text="p.points"></td>
                                                    <td class="p-3 font-mono" x-text="p.diceCount"></td>
                                                    <td class="p-3 space-x-1">
                                                        <button @click="addBonusPoints(pIdx)" class="bg-gold-600 text-white px-2 py-1 rounded font-bold">加點數</button>
                                                        <button @click="deletePartner(pIdx)" class="bg-red-600 text-white px-2 py-1 rounded font-bold">刪除</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>

                        <!-- TAB 3: REWARDS STATUS -->
                        <template x-if="adminTab === 'rewards'">
                            <div class="space-y-4">
                                <h3 class="font-bold text-ruby-900 text-base mb-2">大富翁獎勵與兌換發放狀況</h3>
                                <div class="bg-white p-4 rounded-xl shadow border space-y-3">
                                    <p class="text-gray-600 text-xs">在此可檢視夥伴們在大富翁棋盤中獲得的獎勵或兌換紀錄。</p>
                                    <template x-if="rewardsList.length === 0">
                                        <div class="text-center py-8 text-gray-400">目前尚無獎勵發放紀錄。</div>
                                    </template>
                                    <div class="space-y-2">
                                        <template x-for="(rew, rwIdx) in rewardsList" :key="rwIdx">
                                            <div class="p-3 bg-cream border rounded-lg flex justify-between items-center text-xs">
                                                <div>
                                                    <span class="font-bold text-ruby-900" x-text="rew.userName"></span> 獲得了 <span class="font-bold text-gold-700" x-text="rew.rewardTitle"></span>
                                                </div>
                                                <span class="text-gray-400 text-[10px]" x-text="rew.time"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- TAB 4: SETTINGS -->
                        <template x-if="adminTab === 'settings'">
                            <div class="space-y-4">
                                <h3 class="font-bold text-ruby-900 text-base mb-2">遊戲與戰報跑馬燈設定</h3>
                                <div class="bg-white p-5 rounded-xl shadow border space-y-4">
                                    <div>
                                        <label class="block font-bold text-gray-700 mb-1">跑馬燈公告文字</label>
                                        <input type="text" x-model="settings.tickerText" class="w-full px-3 py-2 border rounded text-xs">
                                    </div>
                                    <button @click="saveSettings()" class="bg-ruby-800 text-white font-bold px-5 py-2 rounded shadow text-xs">儲存設定至雲端</button>
                                </div>
                            </div>
                        </template>

                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ALERT MODAL -->
    <div x-show="showNotificationModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-transition>
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border-2 border-gold-rich text-center">
            <h3 class="text-lg font-bold text-ruby-900" x-text="notificationTitle"></h3>
            <p class="text-sm text-gray-600 mt-2" x-text="notificationText"></p>
            <button @click="showNotificationModal = false" class="mt-5 w-full bg-ruby-800 text-white font-bold py-2.5 rounded-xl text-sm">確定</button>
        </div>
    </div>

    <script>
        // 請確保這裡填入您的 Render 雲端 API 網址
        const API_BASE = 'https://competition-tycoon.onrender.com/api';

        function app() {
            return {
                isOnline: navigator.onLine,
                taipeiTime: '',
                authTab: 'login',
                adminTab: 'approvals',
                currentUser: null,
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: 'OO組', avatar: '👨‍💼' },
                pwdForm: { email: '', oldPassword: '', newPassword: '' },
                avatarList: ['👨‍💼', '👩‍💼', '🧑‍💼', '👨‍💻', '👩‍💻', '🧑‍🎨', '👨‍🎓', '👩‍🎓', '🦸‍♂️', '🦸‍♀️'],
                partners: [],
                declarations: [],
                messages: [],
                rewardsList: [],
                settings: { tickerText: '🎉 賀！競賽大亨雲端同步旗艦版正式啟動！', tags: [], boardCells: [] },
                
                declForm: { tag: 'FYC', fycAmount: 10000, desc: '' },
                isFYCTag: true,
                msgForm: { title: '', content: '', isAnonymous: false },
                
                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                adminPassword: 'admin',
                showNotificationModal: false,
                notificationTitle: '',
                notificationText: '',
                isRolling: false,

                async init() {
                    setInterval(() => {
                        const now = new Date();
                        const taipeiFormatter = new Intl.DateTimeFormat('zh-TW', {
                            timeZone: 'Asia/Taipei',
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit', second: '2-digit',
                            hour12: false
                        });
                        this.taipeiTime = taipeiFormatter.format(now).replace(/\//g, '-');
                    }, 1000);

                    await this.fetchCloudData();

                    setInterval(async () => {
                        await this.fetchCloudData();
                    }, 5000);

                    const savedUser = localStorage.getItem('tycoon_current_user');
                    if (savedUser) {
                        this.currentUser = JSON.parse(savedUser);
                    }
                },

                async fetchCloudData() {
                    try {
                        const res = await fetch(`${API_BASE}/state`);
                        if (res.ok) {
                            const data = await res.json();
                            this.partners = data.partners || [];
                            this.declarations = data.declarations || [];
                            this.messages = data.messages || [];
                            this.rewardsList = data.rewardsList || [];
                            if (data.settings) this.settings = data.settings;
                            this.isOnline = true;

                            if (this.currentUser) {
                                const latest = this.partners.find(p => p.email === this.currentUser.email);
                                if (latest) this.currentUser = latest;
                            }
                        } else {
                            this.isOnline = false;
                        }
                    } catch (e) {
                        this.isOnline = false;
                    }
                },

                async syncToServer() {
                    try {
                        await fetch(`${API_BASE}/state`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                partners: this.partners,
                                declarations: this.declarations,
                                messages: this.messages,
                                rewardsList: this.rewardsList,
                                settings: this.settings
                            })
                        });
                    } catch (e) {
                        this.isOnline = false;
                    }
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                        this.showAlert('登入成功', `歡迎回來，${this.currentUser.name}！`);
                    } else {
                        this.showAlert('登入失敗', '帳號或密碼錯誤。');
                    }
                },

                async register() {
                    if (this.partners.some(p => p.email === this.regForm.email)) {
                        this.showAlert('註冊失敗', '此信箱已註冊過！');
                        return;
                    }
                    const newP = {
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group || 'OO組',
                        avatar: this.regForm.avatar,
                        fyc: 0, points: 0, totalPoints: 0, diceCount: 0, position: 0, buffs: []
                    };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                    this.showAlert('註冊成功', '已同步至雲端伺服器！');
                },

                async changePassword() {
                    const p = this.partners.find(x => x.email === this.pwdForm.email);
                    if (!p) {
                        this.showAlert('錯誤', '找不到此電子信箱的夥伴！');
                        return;
                    }
                    if (p.password !== this.pwdForm.oldPassword) {
                        this.showAlert('錯誤', '舊密碼不正確！');
                        return;
                    }
                    p.password = this.pwdForm.newPassword;
                    await this.syncToServer();
                    this.showAlert('成功', '密碼已成功更新！');
                    this.authTab = 'login';
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('tycoon_current_user');
                },

                onTagChange() {
                    const selected = this.settings.tags.find(t => t.name === this.declForm.tag);
                    this.isFYCTag = selected ? selected.isFYC : false;
                },

                async submitDeclaration() {
                    if (!this.declForm.desc) {
                        this.showAlert('欄位未填寫', '請填寫任務說明！');
                        return;
                    }
                    const req = {
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: this.declForm.desc + (this.isFYCTag ? ` (FYC: $${this.declForm.fycAmount})` : ''),
                        points: this.isFYCTag ? Math.floor((this.declForm.fycAmount || 0) / 1000) : 10,
                        dice: 1,
                        time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
                    };
                    this.declarations.push(req);
                    await this.syncToServer();
                    this.showAlert('已送出', '案件已送至雲端指揮中心審核！');
                    this.declForm.desc = '';
                },

                async approveDecl(index) {
                    const req = this.declarations[index];
                    const p = this.partners.find(x => x.email === req.userEmail);
                    if (p) {
                        p.points += req.points;
                        p.totalPoints += req.points;
                        p.diceCount += req.dice;
                        if (req.tag === 'FYC') {
                            // 從備註提取 FYC 金額加總
                            const match = req.details.match(/\$([0-9,]+)/);
                            if (match) {
                                const amt = parseInt(match[1].replace(/,/g, ''));
                                p.fyc = (p.fyc || 0) + amt;
                            }
                        }
                    }
                    this.declarations.splice(index, 1);
                    await this.syncToServer();
                    this.showAlert('審核通過', '已發放點數與 FYC 並同步更新！');
                },

                async rejectDecl(index) {
                    this.declarations.splice(index, 1);
                    await this.syncToServer();
                },

                async addBonusPoints(pIdx) {
                    const pts = prompt("請輸入要增加的點數：", "10");
                    if (pts && !isNaN(pts)) {
                        this.partners[pIdx].points += parseInt(pts);
                        this.partners[pIdx].totalPoints += parseInt(pts);
                        await this.syncToServer();
                        this.showAlert('成功', '點數已手動調整！');
                    }
                },

                async deletePartner(pIdx) {
                    if (confirm("確定要刪除這位夥伴嗎？")) {
                        this.partners.splice(pIdx, 1);
                        await this.syncToServer();
                    }
                },

                async postMessage() {
                    this.messages.unshift({
                        title: this.msgForm.title,
                        content: this.msgForm.content,
                        isAnonymous: this.msgForm.isAnonymous,
                        author: this.msgForm.isAnonymous ? '神秘夥伴' : this.currentUser.name,
                        time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
                    });
                    await this.syncToServer();
                    this.msgForm.title = '';
                    this.msgForm.content = '';
                },

                async saveSettings() {
                    await this.syncToServer();
                    this.showAlert('成功', '設定已儲存至雲端！');
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) this.adminAuth = true;
                    else this.showAlert('錯誤', '管理者密碼不正確');
                },

                showAlert(title, text) {
                    this.notificationTitle = title;
                    this.notificationText = text;
                    this.showNotificationModal = true;
                },

                formatCurrency(num) { return '$' + (num || 0).toLocaleString(); },
                hasPlayerHere(idx) { return this.partners.some(p => p.position === idx); },
                getPlayersOnCell(idx) { return this.partners.filter(p => p.position === idx); }
            }
        }
    </script>
</body>
</html>
