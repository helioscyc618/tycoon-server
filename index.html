<html lang="zh-TW" class="h-full"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 Modular Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
        
        /* 3D 骰子動畫精準對應樣式 */
        .dice-container { perspective: 800px; display: inline-block; }
        .dice-cube { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1.2); }
        .dice-face { position: absolute; width: 100%; height: 100%; background: #ffffff; border: 3px solid #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #1e293b; box-shadow: inset 0 4px 6px rgba(0,0,0,0.05); }
        .face-1 { transform: rotateY(0deg) translateZ(40px); }
        .face-2 { transform: rotateY(-90deg) translateZ(40px); }
        .face-3 { transform: rotateY(180deg) translateZ(40px); }
        .face-4 { transform: rotateY(90deg) translateZ(40px); }
        .face-5 { transform: rotateX(-90deg) translateZ(40px); }
        .face-6 { transform: rotateX(90deg) translateZ(40px); }

        .show-1 { transform: rotateX(0deg) rotateY(0deg); }
        .show-2 { transform: rotateX(0deg) rotateY(90deg); }
        .show-3 { transform: rotateX(0deg) rotateY(180deg); }
        .show-4 { transform: rotateX(0deg) rotateY(-90deg); }
        .show-5 { transform: rotateX(90deg) rotateY(0deg); }
        .show-6 { transform: rotateX(-90deg) rotateY(0deg); }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-slate-800 text-green-400 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? 'firebase雲端全網同步中 (Online)' : '離線警告 (Offline)'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-slate-300">
                <i class="fas fa-clock mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-slate-300 font-semibold hidden sm:inline">
                <i class="fas fa-dice mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 競賽期間: <span x-text="settings.startDate"></span> ~ <span x-text="settings.endDate"></span> 
                <span class="ml-2 bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded border border-orange-500/40 text-xs font-bold" x-text="'⏳ 倒數 ' + getCountdownDays() + ' 天'"></span>
            </span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 text-white rounded font-bold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition flex items-center space-x-1.5" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心</span>
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2.5 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 relative flex items-center shadow-inner" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
            <i class="fas fa-bullhorn mr-1"></i> 最新戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide text-slate-200">
                <template x-if="dynamicTickerMessage">
                    <span class="text-orange-300 font-bold mr-6" x-text="'⚡ ' + dynamicTickerMessage"></span>
                </template>
                <span x-text="settings.ticker1"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker2"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker3"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">
        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white relative border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <div class="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl rotate-3" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1 tracking-widest font-serif" x-text="settings.newsTitle"></p>
                </div>
                <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'login' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'register' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'forgot' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">忘記密碼</button>
                </div>
                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required="" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required="" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入戰情室</span>
                            </button>
                        </form>
                    </template>
                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">組別</label>
                                    <input type="text" x-model="regForm.group" required="" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm" placeholder="OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">選擇個人頭貼 Icon</label>
                                <div class="grid grid-cols-5 gap-2 mt-1 max-h-40 overflow-y-auto p-1 border border-slate-200 rounded-xl bg-slate-50">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" class="p-2 text-2xl rounded-xl border text-center transition flex items-center justify-center bg-white" :class="regForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="regForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av"></button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2 mt-2">
                                <i class="fas fa-user-plus" :style="'color: ' + (settings.primaryColor || '#f97316')"></i>
                                <span>立即註冊 (firebase雲端同步)</span>
                            </button>
                        </form>
                    </template>
                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">註冊姓名 / 帳號</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full text-white font-bold py-2.5 rounded-xl shadow transition text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">查詢密碼</button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-orange-50 border border-orange-300 rounded-xl text-center">
                                    <p class="text-xs text-slate-500">查詢結果：</p>
                                    <p class="text-base font-bold mt-1" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Overview Banner -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                                <span class="px-2.5 py-0.5 text-white text-xs rounded-full font-semibold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                                <span class="px-2.5 py-0.5 bg-slate-800 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">歡迎來到【戰情室】！所有夥伴的即時狀態與棋盤位置隨時透過 firebase 雲端全網同步更新。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">FYC 總額 (含Buff)</span>
                            <span class="text-base font-bold text-slate-900" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">可用點數 (含Buff)</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="getTotalPoints(currentUser)"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">累積點數</span>
                            <span class="text-base font-bold text-slate-900" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">骰子總數 (含Buff)</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="getTotalDice(currentUser)"></span>
                        </div>
                    </div>
                </div>

                <!-- GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- LEFT -->
                    <div class="lg:col-span-5 space-y-6">
                        <!-- 1. 個人資訊管理卡片 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                            <h3 class="text-base font-bold text-slate-900 ming-title flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-id-card mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 個人資訊與推播設定</span>
                                <button @click="showProfileEdit = !showProfileEdit; if(showProfileEdit) initProfileForm();" class="text-xs hover:underline font-semibold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="showProfileEdit ? '取消編輯' : '編輯資料'"></button>
                            </h3>
                            <template x-if="!showProfileEdit">
                                <div class="space-y-2 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                    <div class="flex justify-between"><span class="text-slate-400">姓名:</span><span class="font-bold text-slate-900" x-text="currentUser.name"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">職級:</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Email:</span><span class="font-mono text-slate-800" x-text="currentUser.email"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">個人 FYC 業績:</span><span class="font-bold text-slate-900" x-text="formatCurrency(currentUser.fyc || 0)"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">整組總業績 (含Buff):</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="formatCurrency(getTotalFYC(currentUser))"></span></div>
                                    <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                                        <span class="font-bold text-slate-800"><i class="fas fa-bell mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 推播通知開關：</span>
                                        <label class="flex items-center space-x-1.5 cursor-pointer">
                                            <input type="checkbox" x-model="currentUser.pushEnabled" @change="saveData()" class="rounded text-orange-500 w-4 h-4">
                                            <span class="font-bold" x-text="currentUser.pushEnabled ? '已開啟' : '已關閉'"></span>
                                        </label>
                                    </div>
                                </div>
                            </template>
                            <template x-if="showProfileEdit">
                                <form @submit.prevent="saveProfileChanges()" class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">姓名</label>
                                        <input type="text" x-model="profileForm.name" class="w-full px-3 py-2 border rounded-xl bg-white" required="">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">職級</label>
                                        <select x-model="profileForm.rank" class="w-full px-2.5 py-2 border rounded-xl bg-white">
                                            <option value="業務專員">業務專員</option>
                                            <option value="業務主任">業務主任</option>
                                            <option value="業務襄理">業務襄理</option>
                                            <option value="業務經理">業務經理</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">Email (帳號)</label>
                                        <input type="email" x-model="profileForm.email" class="w-full px-3 py-2 border rounded-xl bg-white" required="">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">更換頭貼 Icon</label>
                                        <div class="grid grid-cols-5 gap-1.5 mt-1 max-h-36 overflow-y-auto p-1.5 border border-slate-200 rounded-xl bg-slate-50">
                                            <template x-for="av in avatarList" :key="av">
                                                <button type="button" @click="profileForm.avatar = av" class="p-1.5 text-xl rounded-xl border text-center transition flex items-center justify-center bg-white" :class="profileForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="profileForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av"></button>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="pt-2 border-t">

    <!-- MAIN SCRIPT -->
    <script>
        // 初始化 Firebase 連線配置
        const firebaseConfig = {
            databaseURL: "https://competition-tycoon-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const dbRef = firebase.database().ref('competition_tycoon_data');

        function app() {
            return {
                isOnline: true,
                taipeiTime: '',
                currentUser: null,
                authTab: 'login',
                openAdminModal: false,
                adminAuth: false,
                adminPassword: 'admin',
                adminPassInput: '',
                newAdminPasswordInput: '',
                adminTab: 'approvals',
                showProfileEdit: false,
                showEditPartnerModal: false,
                editingPartner: { name: '', rank: '', group: '', fyc: 0, points: 0, diceCount: 0, buffs: [] },
                
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: '', avatar: '👨‍💼' },
                forgotForm: { name: '', email: '' },
                forgotResult: '',
                
                declForm: { tag: 'FYC', fycAmount: 0, desc: '' },
                isFYCTag: true,
                
                msgForm: { title: '', content: '', isAnonymous: false },
                replyTexts: {},
                
                showAnnouncementModal: false,
                showTerminalPushModal: false,
                currentPushTitle: '',
                currentPushContent: '',
                
                showBroadcastAlertModal: false,
                broadcastAlertTitle: '',
                broadcastAlertContent: '',
                
                showDiceModal: false,
                isRolling: false,
                rolledDiceResult: 1,
                
                dynamicTickerMessage: '',
                
                terminalForm: { target: 'ALL', title: '', content: '' },
                pushLogs: [],
                lastSyncTimestamp: 0,
                isSyncingFromCloud: false,

                avatarList: ['👨‍💼', '👩‍💼', '👨‍💻', '👩‍💻', '🧑‍🚀', '🦸‍♂️', '🦸‍♀️', '🧙‍♂️', '🦁', '🐯', '🦊', '🐼', '🐨', '🦄', '🐲', '🧑‍🎨', '🧑‍🔬', '👨‍🎓', '👩‍🎓', '🤖'],
                
                settings: {
                    primaryColor: '#f97316',
                    headerColor: '#0f172a',
                    bgColor: '#FAFAFA',
                    startDate: '2026/12/14',
                    endDate: '2027/06/02',
                    newsTitle: '🏆 競賽大亨正式開跑！',
                    announcementTitle: '📢 競賽大亨重要公告',
                    announcementContent: '歡迎各位夥伴登入戰情室！請務必確實填寫每日拜訪、增員與 FYC 申報，解鎖 30 格大富翁棋盤豐富大獎！',
                    motivationalQuote: '今日不努力，明天找工作！全力衝刺達標！',
                    ticker1: '🎉 賀！競賽大亨雙軌競賽熱血啟動！',
                    ticker2: '🎉 新夥伴報聘捷報：歡迎新菁英加入挑戰！',
                    ticker3: '⭐ 恭喜各組菁英挑戰機會命運大富翁棋盤豐富大獎！',
                    youtubeEmbed: '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>',
                    tags: [
                        { name: 'FYC', isFYC: true, points: 0 },
                        { name: '活動邀約', isFYC: false, points: 10 },
                        { name: '增員面談', isFYC: false, points: 20 },
                        { name: '新夥伴公司考', isFYC: false, points: 30 },
                        { name: '新夥伴外部考', isFYC: false, points: 30 },
                        { name: '新夥伴報聘', isFYC: false, points: 50 }
                    ],
                    boardCells: Array.from({length: 30}, (_, i) => ({
                        icon: i === 0 ? '🚩' : (i === 29 ? '👑' : (i % 5 === 2 ? '🎁' : (i % 7 === 3 ? '🚀' : '⭐'))),
                        title: i === 0 ? '起點' : (i === 29 ? '終點大獎' : (i % 5 === 2 ? '幸運獎勵格' : (i % 7 === 3 ? '時空傳送格' : `第 ${i+1} 格`))),
                        type: i % 5 === 2 ? '獎勵' : (i % 7 === 3 ? '傳送' : '普通'),
                        reward: i % 5 === 2 ? '獲得加碼 50 點數與 2 顆骰子！' : (i % 7 === 3 ? '觸發隨機傳送到其他格子！' : '獲得一般祝福獎勵！')
                    }))
                },

                partners: [],
                declarations: [],
                messages: [],
                rewardsList: [],

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);

                    // Firebase Realtime Database 雲端即時同步監聽
                    dbRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            this.isOnline = true;
                            this.handleIncomingSync(data);
                        }
                    }, (error) => {
                        this.isOnline = false;
                    });
                },

                handleIncomingSync(data) {
                    if (data && data.timestamp && data.timestamp > this.lastSyncTimestamp) {
                        this.isSyncingFromCloud = true;
                        this.lastSyncTimestamp = data.timestamp;
                        
                        if (data.partners) this.partners = data.partners;
                        if (data.settings) this.settings = Object.assign(this.settings, data.settings);
                        if (data.declarations) this.declarations = data.declarations;
                        if (data.messages) this.messages = data.messages;
                        if (data.rewardsList) this.rewardsList = data.rewardsList;
                        if (data.pushLogs) this.pushLogs = data.pushLogs;
                        if (data.adminPassword) this.adminPassword = data.adminPassword;
                        
                        if (data.latestGlobalAlert) {
                            if (data.latestGlobalAlert.id !== this.lastAlertId) {
                                this.lastAlertId = data.latestGlobalAlert.id;
                                this.broadcastAlertTitle = data.latestGlobalAlert.title;
                                this.broadcastAlertContent = data.latestGlobalAlert.content;
                                this.showBroadcastAlertModal = true;
                                this.dynamicTickerMessage = data.latestGlobalAlert.title + ": " + data.latestGlobalAlert.content;
                            }
                        }

                        if (this.currentUser) {
                            const latestUser = this.partners.find(p => p.email === this.currentUser.email);
                            if (latestUser) {
                                this.currentUser = latestUser;
                                if (latestUser.pendingPush && !this.showTerminalPushModal) {
                                    this.currentPushTitle = latestUser.pendingPush.title;
                                    this.currentPushContent = latestUser.pendingPush.content;
                                    if (!this.showAnnouncementModal) {
                                        this.showTerminalPushModal = true;
                                    }
                                }
                            }
                        }
                        this.isSyncingFromCloud = false;
                    }
                },

                saveData(alertTitle = null, alertContent = null) {
                    if (this.isSyncingFromCloud) return;
                    const nowTS = Date.now();
                    this.lastSyncTimestamp = nowTS;
                    
                    let globalAlert = null;
                    if (alertTitle && alertContent) {
                        globalAlert = {
                            id: 'alert_' + nowTS,
                            title: alertTitle,
                            content: alertContent
                        };
                        this.lastAlertId = globalAlert.id;
                        this.broadcastAlertTitle = alertTitle;
                        this.broadcastAlertContent = alertContent;
                        this.showBroadcastAlertModal = true;
                        this.dynamicTickerMessage = alertTitle + ": " + alertContent;
                    }

                    const data = {
                        timestamp: nowTS,
                        partners: this.partners,
                        settings: this.settings,
                        declarations: this.declarations,
                        messages: this.messages,
                        rewardsList: this.rewardsList,
                        pushLogs: this.pushLogs,
                        adminPassword: this.adminPassword,
                        latestGlobalAlert: globalAlert,
                        currentUserEmail: this.currentUser ? this.currentUser.email : null
                    };

                    // 寫入 Firebase 雲端資料庫
                    dbRef.set(data).then(() => {
                        this.isOnline = true;
                    }).catch((error) => {
                        this.isOnline = false;
                    });
                },

                updateTime() {
                    const now = new Date();
                    this.taipeiTime = now.toISOString().replace('T', ' ').substring(0, 19);
                },

                getCountdownDays() {
                    const end = new Date(this.settings.endDate);
                    const now = new Date();
                    const diff = end - now;
                    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
                },

                formatCurrency(val) {
                    return '$' + Number(val || 0).toLocaleString();
                },

                getTotalFYC(p) {
                    let total = p.fyc || 0;
                    if (p.buffs) {
                        p.buffs.forEach(b => {
                            const sub = this.partners.find(x => x.name === b);
                            if (sub) total += (sub.fyc || 0);
                        });
                    }
                    return total;
                },

                getTotalPoints(p) {
                    let total = p.points || 0;
                    if (p.buffs) {
                        p.buffs.forEach(b => {
                            const sub = this.partners.find(x => x.name === b);
                            if (sub) total += (sub.points || 0);
                        });
                    }
                    return total;
                },

                getTotalDice(p) {
                    let total = p.diceCount || 0;
                    if (p.buffs) {
                        p.buffs.forEach(b => {
                            const sub = this.partners.find(x => x.name === b);
                            if (sub) total += (sub.diceCount || 0);
                        });
                    }
                    return total;
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        this.saveData();
                        this.showAnnouncementModal = true;
                        alert('登入成功！');
                    } else {
                        alert('帳號或密碼錯誤，或尚未註冊！');
                    }
                },

                register() {
                    if (this.partners.some(p => p.email === this.regForm.email)) {
                        alert('此 Email 已經註冊過！');
                        return;
                    }
                    const newP = {
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group,
                        avatar: this.regForm.avatar,
                        fyc: 0, points: 0, totalPoints: 0, diceCount: 0, position: 0, pushEnabled: true, buffs: [],
                        pendingPush: null
                    };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    this.saveData('新夥伴加入', `熱烈歡迎 ${newP.name} 登入競賽大亨戰情室！`);
                    this.showAnnouncementModal = true;
                },

                logout() {
                    this.currentUser = null;
                    this.saveData();
                },

                findPassword() {
                    const found = this.partners.find(p => p.name === this.forgotForm.name && p.email === this.forgotForm.email);
                    if (found) {
                        this.forgotResult = `您的密碼為：${found.password}`;
                    } else {
                        this.forgotResult = '查無此帳號與姓名資料';
                    }
                },

                initProfileForm() {
                    this.profileForm = {
                        name: this.currentUser.name,
                        rank: this.currentUser.rank,
                        email: this.currentUser.email,
                        avatar: this.currentUser.avatar,
                        newPassword: ''
                    };
                },

                saveProfileChanges() {
                    this.currentUser.name = this.profileForm.name;
                    this.currentUser.rank = this.profileForm.rank;
                    this.currentUser.email = this.profileForm.email;
                    this.currentUser.avatar = this.profileForm.avatar;
                    if (this.profileForm.newPassword) {
                        this.currentUser.password = this.profileForm.newPassword;
                    }
                    this.saveData();
                    this.showProfileEdit = false;
                    alert('個人資訊更新成功！');
                },

                onTagChange() {
                    const tagObj = this.settings.tags.find(t => t.name === this.declForm.tag);
                    this.isFYCTag = tagObj ? tagObj.isFYC : false;
                },

                getSelectedTagPoints() {
                    const tagObj = this.settings.tags.find(t => t.name === this.declForm.tag);
                    return tagObj ? tagObj.points : 0;
                },

                submitDeclaration() {
                    let pts = 0;
                    let detailsText = this.declForm.desc;
                    if (this.isFYCTag) {
                        pts = Math.ceil((this.declForm.fycAmount || 0) / 1000);
                        detailsText = `FYC 金額: ${this.formatCurrency(this.declForm.fycAmount)} | 備註: ${this.declForm.desc}`;
                    } else {
                        pts = this.getSelectedTagPoints();
                    }

                    this.declarations.push({
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: detailsText,
                        fycVal: this.isFYCTag ? (this.declForm.fycAmount || 0) : 0,
                        points: pts,
                        dice: Math.floor(pts / 10),
                        time: this.taipeiTime
                    });
                    this.saveData();
                    alert('申報已送出，等待指揮中心審核！');
                    this.declForm.desc = '';
                    this.declForm.fycAmount = 0;
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) {
                        this.adminAuth = true;
                    } else {
                        alert('管理者密碼錯誤！');
                    }
                },

                editPartner(p) {
                    this.editingPartner = JSON.parse(JSON.stringify(p));
                    if (!this.editingPartner.buffs) this.editingPartner.buffs = [];
                    this.showEditPartnerModal = true;
                },

                savePartnerEdit() {
                    const idx = this.partners.findIndex(p => p.email === this.editingPartner.email);
                    if (idx !== -1) {
                        this.partners[idx] = JSON.parse(JSON.stringify(this.editingPartner));
                        if (this.currentUser && this.currentUser.email === this.editingPartner.email) {
                            this.currentUser = this.partners[idx];
                        }
                        this.saveData();
                        this.showEditPartnerModal = false;
                        alert('夥伴資料與 Buff 更新成功！');
                    }
                },

                deletePartner(pIdx) {
                    if (confirm('確定要刪除此夥伴嗎？')) {
                        const target = this.partners[pIdx];
                        if (this.currentUser && this.currentUser.email === target.email) {
                            this.currentUser = null;
                        }
                        this.partners.splice(pIdx, 1);
                        this.saveData();
                    }
                },

                approveDecl(rIdx) {
                    const req = this.declarations[rIdx];
                    const targetUser = this.partners.find(p => p.email === req.userEmail);
                    if (targetUser) {
                        targetUser.fyc = (targetUser.fyc || 0) + (req.fycVal || 0);
                        targetUser.points += req.points;
                        targetUser.totalPoints += req.points;
                        targetUser.diceCount += Math.floor(req.points / 10);
                        
                        this.saveData('🎉 業績審核捷報！', `恭喜 ${targetUser.name} 報 ${req.tag} 成功獲得 ${req.points} 點與 ${Math.floor(req.points / 10)} 顆骰子！`);
                    } else {
                        this.declarations.splice(rIdx, 1);
                        this.saveData();
                    }
                    alert('審核通過！點數與 FYC 已經成功計入並透過 firebase 同步至全體夥伴裝置。');
                },

                rejectDecl(rIdx) {
                    this.declarations.splice(rIdx, 1);
                    this.saveData();
                    alert('已拒絕此申報。');
                },

                sendTerminalPush() {
                    if (!this.terminalForm.title || !this.terminalForm.content) {
                        alert('請填寫推播主旨與內容！');
                        return;
                    }
                    if (this.terminalForm.target === 'ALL') {
                        this.partners.forEach(p => {
                            p.pendingPush = { title: this.terminalForm.title, content: this.terminalForm.content };
                        });
                        alert('[終端機] 成功廣播推播至全部夥伴！');
                    } else {
                        const targetUser = this.partners.find(p => p.email === this.terminalForm.target);
                        if (targetUser) {
                            targetUser.pendingPush = { title: this.terminalForm.title, content: this.terminalForm.content };
                            alert(`[終端機] 成功發送推播至：${targetUser.name}`);
                        } else {
                            alert('找不到指定的目標夥伴！');
                        }
                    }
                    this.pushLogs.unshift({
                        target: this.terminalForm.target,
                        title: this.terminalForm.title,
                        content: this.terminalForm.content,
                        time: this.taipeiTime
                    });
                    this.saveData(this.terminalForm.title, this.terminalForm.content);
                    this.terminalForm.title = '';
                    this.terminalForm.content = '';
                },

                closeAnnouncementAndCheckPush() {
                    this.showAnnouncementModal = false;
                    if (this.currentUser && this.currentUser.pendingPush) {
                        this.currentPushTitle = this.currentUser.pendingPush.title;
                        this.currentPushContent = this.currentUser.pendingPush.content;
                        this.showTerminalPushModal = true;
                    }
                },

                dismissTerminalPush() {
                    this.showTerminalPushModal = false;
                    if (this.currentUser) {
                        this.currentUser.pendingPush = null;
                        this.saveData();
                    }
                },

                getGroupPartners() {
                    if (!this.currentUser) return [];
                    return this.partners.filter(p => p.group === this.currentUser.group);
                },

                rollDice() {
                    if (this.getTotalPoints(this.currentUser) < 10) return;
                    this.currentUser.points -= 10;
                    
                    const step = Math.floor(Math.random() * 6) + 1;
                    this.rolledDiceResult = step;
                    this.showDiceModal = true;
                    this.isRolling = true;
                    
                    setTimeout(() => {
                        this.isRolling = false;
                        
                        setTimeout(() => {
                            this.showDiceModal = false;
                            
                            let newPos = (this.currentUser.position + step) % 30;
                            const cell = this.settings.boardCells[newPos];
                            
                            if (cell.type === '傳送') {
                                newPos = Math.floor(Math.random() * 30);
                            }
                            
                            this.currentUser.position = newPos;
                            
                            let rewardMsg = '';
                            const landedCell = this.settings.boardCells[newPos];
                            if (landedCell.type === '獎勵') {
                                this.rewardsList.unshift({
                                    userName: this.currentUser.name,
                                    reward: `踩中【${landedCell.title}】等待指揮中心發放獎勵`,
                                    time: this.taipeiTime,
                                    status: '未發放'
                                });
                                rewardMsg = ` 且踩中獎勵格「${landedCell.title}」已回擊至指揮中心！`;
                            }

                            this.saveData('🎲 大富翁前進捷報！', `${this.currentUser.name} 擲出了 ${step} 點，前進了 ${step} 格，目前停留在第 ${newPos + 1} 格 (${landedCell.title})！${rewardMsg}`);
                            
                        }, 800);
                    }, 1200);
                },

                toggleRewardStatus(idx) {
                    this.rewardsList[idx].status = this.rewardsList[idx].status === '已發放' ? '未發放' : '已發放';
                    this.saveData();
                },

                exportRewardsCSV() {
                    let csv = '夥伴姓名,獲得獎勵內容,獲得時間,發放狀態\n';
                    this.rewardsList.forEach(r => {
                        csv += `"${r.userName}","${r.reward}","${r.time}","${r.status}"\n`;
                    });
                    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `獎勵統整清單_${new Date().toISOString().slice(0,10)}.csv`;
                    link.click();
                },

                exportBackupFile(isAuto = false) {
                    const data = {
                        partners: this.partners,
                        settings: this.settings,
                        declarations: this.declarations,
                        messages: this.messages,
                        rewardsList: this.rewardsList,
                        pushLogs: this.pushLogs,
                        adminPassword: this.adminPassword,
                        backupTime: this.taipeiTime
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `CompetitionTycoon_Backup_${new Date().toISOString().slice(0,10)}.json`;
                    link.click();
                    if (!isAuto) alert('手動備份檔導出成功！');
                },

                importBackupFile(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.partners) this.partners = data.partners;
                            if (data.settings) this.settings = Object.assign(this.settings, data.settings);
                            if (data.declarations) this.declarations = data.declarations;
                            if (data.messages) this.messages = data.messages;
                            if (data.rewardsList) this.rewardsList = data.rewardsList;
                            if (data.pushLogs) this.pushLogs = data.pushLogs;
                            if (data.adminPassword) this.adminPassword = data.adminPassword;
                            this.saveData();
                            alert('系統資料還原成功！');
                        } catch(err) {
                            alert('備份檔案格式錯誤！');
                        }
                    };
                    reader.readAsText(file);
                },

                exportSystemHTML() {
                    const fullHTML = document.documentElement.outerHTML;
                    const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `CompetitionTycoon_System_${new Date().toISOString().slice(0,10)}.html`;
                    link.click();
                    alert('完整系統 HTML 原始碼導出成功（預設為登入畫面）！');
                },

                updateSection(sectionName) {
                    this.saveData();
                    alert(`【${sectionName}】更新成功！`);
                },

                resetAllToDefault() {
                    if (confirm('確定要一鍵恢復全部預設值嗎？')) {
                        this.settings.newsTitle = '🏆 競賽大亨正式開跑！';
                        this.settings.motivationalQuote = '今日不努力，明天找工作！全力衝刺達標！';
                        this.settings.primaryColor = '#f97316';
                        this.settings.headerColor = '#0f172a';
                        this.settings.bgColor = '#FAFAFA';
                        this.adminPassword = 'admin';
                        this.saveData();
                        alert('已成功一鍵恢復預設！');
                    }
                },

                resetAllPoints() {
                    if (confirm('確定要將所有夥伴的可用點數一鍵歸零嗎？')) {
                        this.partners.forEach(p => p.points = 0);
                        this.saveData();
                        alert('所有人可用點數已歸零！');
                    }
                },

                resetAllDice() {
                    if (confirm('確定要將所有夥伴的骰子數一鍵歸零嗎？')) {
                        this.partners.forEach(p => p.diceCount = 0);
                        this.saveData();
                        alert('所有人骰子數已歸零！');
                    }
                },

                resetAllPositions() {
                    if (confirm('確定要將所有夥伴的位置一鍵回到起始格（第1格）嗎？')) {
                        this.partners.forEach(p => p.position = 0);
                        this.saveData();
                        alert('所有人已回到起始格！');
                    }
                },

                changeAdminPassword() {
                    if (!this.newAdminPasswordInput) {
                        alert('請輸入新的管理者密碼！');
                        return;
                    }
                    this.adminPassword = this.newAdminPasswordInput;
                    this.newAdminPasswordInput = '';
                    this.saveData();
                    alert('指揮中心管理密碼變更成功！');
                },

                resetThemeSettings() {
                    if (confirm('確定要將外觀風格恢復預設嗎？')) {
                        this.settings.primaryColor = '#f97316';
                        this.settings.headerColor = '#0f172a';
                        this.settings.bgColor = '#FAFAFA';
                        this.saveData();
                        alert('外觀風格已恢復預設。');
                    }
                },

                postMessage() {
                    const newMsg = {
                        title: this.msgForm.title,
                        content: this.msgForm.content,
                        isAnonymous: this.msgForm.isAnonymous,
                        author: this.currentUser.name,
                        time: this.taipeiTime,
                        likes: 0,
                        replies: []
                    };
                    this.messages.unshift(newMsg);
                    this.msgForm.title = '';
                    this.msgForm.content = '';
                    this.saveData('💬 新士氣留言', `【${newMsg.author}】發布了新留言：「${newMsg.title}」`);
                },

                postReply(mIdx) {
                    if (!this.replyTexts[mIdx]) return;
                    if (!this.messages[mIdx].replies) this.messages[mIdx].replies = [];
                    const repText = this.replyTexts[mIdx];
                    this.messages[mIdx].replies.push({
                        author: this.currentUser.name,
                        content: repText,
                        time: this.taipeiTime
                    });
                    this.replyTexts[mIdx] = '';
                    this.saveData('💬 留言有新回覆', `【${this.currentUser.name}】回覆了留言：「${repText}」`);
                },

                likeMessage(mIdx) {
                    this.messages[mIdx].likes = (this.messages[mIdx].likes || 0) + 1;
                    this.saveData();
                },

                hasPlayerHere(idx) {
                    return this.partners.some(p => p.position === idx);
                },

                getPlayersOnCell(idx) {
                    return this.partners.filter(p => p.position === idx);
                },

                openCellModal(cell, index) {
                    this.selectedCell = cell;
                    this.selectedCellIndex = index;
                    this.showCellDetailModal = true;
                },

                saveSettings() {
                    this.saveData('⚙️ 系統設定更新', '指揮中心已更新戰情室最新規則與設定！');
                    alert('全部設定儲存成功並同步至全體夥伴！');
                }
            }
        }
    </script>
</body>
</html>
