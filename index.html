<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between" x-data="competitionApp()">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-lg shadow-inner text-lg tracking-wider">競賽大亨</div>
            <span class="text-sm text-slate-400 hidden sm:inline">Competition Tycoon v3.3</span>
        </div>
        <div>
            <template x-if="currentUser">
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-slate-300">歡迎，<strong class="text-indigo-400" x-text="currentUser.name"></strong></span>
                    <button @click="logout()" class="bg-rose-600/80 hover:bg-rose-600 text-white text-xs px-3 py-1.5 rounded-md transition shadow">登出</button>
                </div>
            </template>
            <template x-if="!currentUser">
                <div class="text-xs text-slate-400">請先登入或註冊以開始體驗</div>
            </template>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- 1. 初始/未登入畫面：預設顯示登入系統 -->
        <template x-if="!currentUser">
            <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 space-y-6">
                
                <!-- 區塊標題已依需求更名 -->
                <div class="text-center pb-2">
                    <h2 class="text-xl font-bold text-slate-200">當前編碼檢視</h2>
                    <p class="text-xs text-slate-400 mt-1">系統原始碼 (HTML)</p>
                </div>

                <!-- 切換標籤 (登入 / 註冊) -->
                <div class="flex border-b border-slate-700 pb-4">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'text-indigo-400 border-b-2 border-indigo-500 font-bold' : 'text-slate-400'" class="flex-1 pb-2 text-center transition">登入系統</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'text-indigo-400 border-b-2 border-indigo-500 font-bold' : 'text-slate-400'" class="flex-1 pb-2 text-center transition">新夥伴註冊</button>
                </div>

                <!-- 登入表單 -->
                <div x-show="authMode === 'login'" class="space-y-4">
                    <h3 class="text-lg font-semibold text-center text-slate-300">登入您的帳號</h3>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">電子郵件或帳號</label>
                        <input type="text" x-model="loginForm.email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="請輸入帳號">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">密碼</label>
                        <input type="password" x-model="loginForm.password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="請輸入密碼">
                    </div>
                    <button @click="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">登入系統</button>
                </div>

                <!-- 註冊表單：所有欄位初始預設，按鈕顯示「立即註冊」 -->
                <div x-show="authMode === 'register'" class="space-y-4">
                    <h3 class="text-lg font-semibold text-center text-slate-300">新夥伴註冊</h3>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">夥伴姓名</label>
                        <input type="text" x-model="registerForm.name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="請輸入真實姓名">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">電子郵件</label>
                        <input type="email" x-model="registerForm.email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">設定密碼</label>
                        <input type="password" x-model="registerForm.password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="設定您的密碼">
                    </div>
                    <!-- 點數與骰子歸零提示 -->
                    <p class="text-xs text-slate-500 text-center">新註冊帳號初始點數與骰子皆從 0 開始</p>
                    <button @click="register()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg">立即註冊</button>
                </div>

            </div>
        </template>

        <!-- 2. 登入後的戰情室與大富翁主畫面 -->
        <template x-if="currentUser">
            <div class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 space-y-6">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl font-black text-indigo-400">夥伴戰情室與指揮中心</h2>
                    <p class="text-slate-400 text-sm">目前身分：<span class="text-white font-bold" x-text="currentUser.name"></span> | 點數：<span class="text-emerald-400 font-bold" x-text="currentUser.points"></span> 點 | 剩餘骰子：<span class="text-amber-400 font-bold" x-text="currentUser.dices"></span> 顆</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-700 text-center space-y-3">
                        <h3 class="font-bold text-slate-200">3D 骰子大富翁</h3>
                        <p class="text-xs text-slate-400">點擊下方按鈕進行遊戲擲骰與推進棋盤進度。</p>
                        <button @click="rollDice()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg transition">擲骰子</button>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-xl border border-slate-700 text-center space-y-3">
                        <h3 class="font-bold text-slate-200">業績與點數申報</h3>
                        <p class="text-xs text-slate-400">提交您的最新業績與任務進度以獲取獎勵點數。</p>
                        <button @click="submitScore()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg transition">申報業績</button>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <!-- 底部版權宣告 -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Competition Tycoon &copy; 2026 All Rights Reserved.
    </footer>

    <!-- Alpine.js 邏輯控制器 -->
    <script>
        function competitionApp() {
            return {
                authMode: 'login', // 預設開啟畫面統一為登入系統
                currentUser: null,
                loginForm: { email: '', password: '' },
                registerForm: { name: '', email: '', password: '' },

                login() {
                    if(!this.loginForm.email || !this.loginForm.password) {
                        alert('請輸入帳號與密碼');
                        return;
                    }
                    // 模擬登入成功
                    this.currentUser = {
                        name: this.loginForm.email.split('@')[0],
                        points: 0,
                        dices: 0
                    };
                },

                register() {
                    if(!this.registerForm.name || !this.registerForm.email || !this.registerForm.password) {
                        alert('請完整填寫註冊欄位');
                        return;
                    }
                    // 新註冊帳號點數與骰子強制從 0 開始
                    this.currentUser = {
                        name: this.registerForm.name,
                        points: 0,
                        dices: 0
                    };
                    alert('註冊成功！已為您自動登入。');
                },

                logout() {
                    this.currentUser = null;
                    this.authMode = 'login';
                    this.loginForm = { email: '', password: '' };
                    this.registerForm = { name: '', email: '', password: '' };
                },

                rollDice() {
                    this.currentUser.dices += 1;
                    alert('擲骰成功！');
                },

                submitScore() {
                    this.currentUser.points += 10;
                    alert('業績申報成功，獲得 10 點！');
                }
            }
        }
    </script>
</body>
</html>
