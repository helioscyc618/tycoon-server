<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 - 業務激勵競賽系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti 慶祝特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white"
      x-data="gameApp()" 
      x-init="initApp()"
      :style="`--primary-color: ${settings.primaryColor}; --header-color: ${settings.headerColor}; --bg-color: ${settings.bgColor};`"
      :class="{'bg-[var(--bg-color)]': true}">

    <!-- 頂部導覽列 -->
    <header class="shadow-lg border-b border-slate-700/50 sticky top-0 z-50 backdrop-blur-md bg-slate-900/80"
            :style="`background-color: var(--header-color);`">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'board'">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-md text-slate-950 font-black text-xl">
                    👑
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white drop-shadow" x-text="settings.gameTitle">競賽大亨</h1>
                    <p class="text-xs text-slate-300" x-text="settings.gameSubtitle">業務激勵競賽系統</p>
                </div>
            </div>

            <!-- 右側導覽/使用者區塊 -->
            <div class="flex items-center space-x-3">
                <template x-if="currentUser">
                    <div class="flex items-center space-x-3">
                        <!-- 指揮中心按鈕 (僅管理員) -->
                        <template x-if="currentUser.isAdmin">
                            <button @click="currentView = currentView === 'admin' ? 'board' : 'admin'" 
                                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1"
                                    :class="currentView === 'admin' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-amber-400 hover:bg-slate-700 border border-amber-500/30'">
                                <span>⚙️</span>
                                <span x-text="currentView === 'admin' ? '返回棋盤' : '指揮中心'"></span>
                            </button>
                        </template>

                        <!-- 個人狀態簡介 -->
                        <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span class="text-sm font-bold text-white" x-text="currentUser.name"></span>
                            <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono" x-text="currentUser.points + ' 點'"></span>
                        </div>

                        <!-- 登出按鈕 -->
                        <button @click="logout()" class="text-slate-400 hover:text-red-400 text-xs px-2 py-1 rounded transition">
                            登出
                        </button>
                    </div>
                </template>
                <template x-if="!currentUser">
                    <button @click="openLoginModal = true" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-sm shadow-lg transition transform active:scale-95">
                        登入 / 註冊
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- 即時跑馬燈公告 -->
    <div class="bg-slate-950/60 border-y border-slate-800/80 py-1.5 overflow-hidden whitespace-nowrap relative">
        <div class="inline-block animate-[marquee_25s_linear_infinite] text-xs text-amber-300/90 font-medium px-4">
            📢 <span x-text="settings.marqueeText"></span> &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 🚀 歡迎來到全新競賽大亨，挑戰任務賺取豐富獎勵！
        </div>
    </div>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- 未登入提示畫面 -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto my-12 bg-slate-800/90 border border-slate-700 p-8 rounded-2xl shadow-2xl text-center backdrop-blur">
                <div class="text-5xl mb-4">🏆</div>
                <h2 class="text-2xl font-black text-white mb-2">準備好展開競賽冒險了嗎？</h2>
                <p class="text-slate-400 text-sm mb-6">請登入您的帳號以參與大富翁棋盤、申報業績並爭奪排行榜寶座。</p>
                <button @click="openLoginModal = true" class="w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-bold rounded-xl shadow-lg hover:brightness-110 transition">
                    立即登入
                </button>
            </div>
        </template>

        <!-- 已登入畫面 -->
        <template x-if="currentUser">
            <div>
                <!-- 視圖 A：大富翁主棋盤與遊戲區 -->
                <div x-show="currentView === 'board'" class="space-y-6">
                    
                    <!-- 玩家控制與狀態面板 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- 個人資訊與骰子區 -->
                        <div class="bg-slate-800/80 border border-slate-700/80 p-5 rounded-2xl shadow-lg flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <h3 class="text-lg font-bold text-white" x-text="currentUser.name"></h3>
                                        <p class="text-xs text-slate-400" x-text="currentUser.title || '見習業務員'"></p>
                                    </div>
                                    <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-mono font-bold" 
                                          x-text="'第 ' + currentUser.position + ' 格'"></span>
                                </div>
                                <div class="flex space-x-4 mb-4">
                                    <div class="bg-slate-900/60 p-3 rounded-xl flex-1 border border-slate-700/50">
                                        <span class="text-xs text-slate-400 block">累積點數</span>
                                        <span class="text-xl font-black text-amber-400 font-mono" x-text="currentUser.points"></span>
                                    </div>
                                    <div class="bg-slate-900/60 p-3 rounded-xl flex-1 border border-slate-700/50">
                                        <span class="text-xs text-slate-400 block">累積 FYC</span>
                                        <span class="text-xl font-black text-emerald-400 font-mono" x-text="currentUser.fyc.toLocaleString()"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex space-x-2">
                                <button @click="rollDice()" :disabled="isRolling" 
                                        class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-black rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                                    <span>🎲</span>
                                    <span x-text="isRolling ? '擲骰中...' : '擲骰子前進'"></span>
                                </button>
                                <button @click="openClaimModal = true" 
                                        class="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-1">
                                    <span>📈</span>
                                    <span>申報業績</span>
                                </button>
                            </div>
                        </div>

                        <!-- 排行榜預覽 -->
                        <div class="bg-slate-800/80 border border-slate-700/80 p-5 rounded-2xl shadow-lg md:col-span-2 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="text-sm font-bold text-slate-300 flex items-center space-x-1">
                                    <span>🏆</span>
                                    <span>榮譽排行榜 Top 5</span>
                                </h3>
                                <button @click="currentView = 'leaderboard'" class="text-xs text-amber-400 hover:underline">查看完整榜單 &gt;</button>
                            </div>
                            <div class="space-y-2">
                                <template x-for="(user, index) in sortedUsers.slice(0, 3)" :key="user.id">
                                    <div class="bg-slate-900/50 px-4 py-2 rounded-xl flex items-center justify-between border border-slate-700/40">
                                        <div class="flex items-center space-x-3">
                                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold font-mono"
                                                  :class="index === 0 ? 'bg-amber-400 text-slate-950' : (index === 1 ? 'bg-slate-300 text-slate-950' : 'bg-amber-700 text-white')"
                                                  x-text="index + 1"></span>
                                            <span class="text-sm font-bold text-white" x-text="user.name"></span>
                                        </div>
                                        <div class="flex space-x-4 text-xs font-mono">
                                            <span class="text-emerald-400">FYC: <strong x-text="user.fyc.toLocaleString()"></strong></span>
                                            <span class="text-amber-400">點數: <strong x-text="user.points"></strong></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 大富翁棋盤預覽 (簡易呈現 30 格示意) -->
                    <div class="bg-slate-800/80 border border-slate-700/80 p-5 rounded-2xl shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-base font-bold text-white flex items-center space-x-2">
                                <span>🗺️</span>
                                <span>大富翁競賽地圖 (共 30 格)</span>
                            </h3>
                            <span class="text-xs text-slate-400">點擊格子可查看格規與獎勵內容</span>
                        </div>
                        <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                            <template x-for="i in 30" :key="i">
                                <div @click="selectedTile = i" 
                                     class="h-16 rounded-xl border flex flex-col items-center justify-center p-1 cursor-pointer transition relative overflow-hidden"
                                     :class="currentUser.position === i ? 'bg-amber-500/20 border-amber-500 shadow-md ring-2 ring-amber-500/50' : 'bg-slate-900/60 border-slate-700 hover:border-slate-500'">
                                    <span class="text-[10px] text-slate-500 font-mono absolute top-1 left-1.5" x-text="i"></span>
                                    <span class="text-lg my-auto" x-text="getTileIcon(i)"></span>
                                    <!-- 玩家在此格子的標記 -->
                                    <template x-if="currentUser.position === i">
                                        <span class="absolute bottom-1 w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- 視圖 B：指揮中心 (管理員後台) -->
                <div x-show="currentView === 'admin' && currentUser.isAdmin" class="space-y-6" x-cloak>
                    <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 mb-6 border-b border-slate-700 gap-4">
                            <div>
                                <h2 class="text-xl font-black text-white flex items-center space-x-2">
                                    <span>⚙️</span>
                                    <span>指揮中心 (後台管理)</span>
                                </h2>
                                <p class="text-xs text-slate-400">管理夥伴申報、系統設定與棋盤配置</p>
                            </div>
                            <!-- 後台分頁切換 -->
                            <div class="flex flex-wrap gap-2">
                                <button @click="adminTab = 'audit'" :class="adminTab === 'audit' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold transition">點數審核</button>
                                <button @click="adminTab = 'users'" :class="adminTab === 'users' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold transition">夥伴管理</button>
                                <button @click="adminTab = 'settings'" :class="adminTab === 'settings' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold transition">系統設定</button>
                            </div>
                        </div>

                        <!-- 後台子分頁 1：點數審核 -->
                        <div x-show="adminTab === 'audit'" class="space-y-4">
                            <h3 class="text-sm font-bold text-slate-300">待審核的申報紀錄</h3>
                            <div class="space-y-2">
                                <template x-for="claim in pendingClaims" :key="claim.id">
                                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-white" x-text="claim.userName"></span>
                                                <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-300" x-text="claim.type"></span>
                                            </div>
                                            <p class="text-xs text-slate-400 mt-1" x-text="'申報 FYC: ' + claim.fyc.toLocaleString() + ' (換算點數: ' + claim.points + ')'"></p>
                                        </div>
                                        <div class="flex space-x-2">
                                            <button @click="approveClaim(claim.id)" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition">通過</button>
                                            <button @click="rejectClaim(claim.id)" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-lg transition">拒絕</button>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="pendingClaims.length === 0">
                                    <p class="text-sm text-slate-500 text-center py-6">目前沒有待審核的申報項目。</p>
                                </template>
                            </div>
                        </div>

                        <!-- 後台子分頁 2：夥伴管理 -->
                        <div x-show="adminTab === 'users'" class="space-y-4" x-cloak>
                            <h3 class="text-sm font-bold text-slate-300">所有夥伴列表</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs text-slate-300">
                                    <thead class="bg-slate-900 text-slate-400 uppercase font-mono">
                                        <tr>
                                            <th class="p-3">姓名</th>
                                            <th class="p-3">職稱</th>
                                            <th class="p-3">點數</th>
                                            <th class="p-3">FYC</th>
                                            <th class="p-3">位置</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-700">
                                        <template x-for="u in allUsers" :key="u.id">
                                            <tr class="hover:bg-slate-900/40">
                                                <td class="p-3 font-bold text-white" x-text="u.name"></td>
                                                <td class="p-3" x-text="u.title"></td>
                                                <td class="p-3 font-mono text-amber-400" x-text="u.points"></td>
                                                <td class="p-3 font-mono text-emerald-400" x-text="u.fyc.toLocaleString()"></td>
                                                <td class="p-3 font-mono" x-text="u.position"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 後台子分頁 3：系統設定 -->
                        <div x-show="adminTab === 'settings'" class="space-y-4" x-cloak>
                            <h3 class="text-sm font-bold text-slate-300">網站與跑馬燈設定</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">競賽標題</label>
                                    <input type="text" x-model="settings.gameTitle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">跑馬燈公告</label>
                                    <input type="text" x-model="settings.marqueeText" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                                </div>
                            </div>
                            <button @click="alert('設定已儲存！')" class="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs shadow hover:bg-amber-400 transition">儲存變更</button>
                        </div>
                    </div>
                </div>

                <!-- 視圖 C：排行榜完整版 -->
                <div x-show="currentView === 'leaderboard'" class="space-y-4" x-cloak>
                    <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-xl">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-black text-white">🏆 完整榮譽排行榜</h2>
                            <button @click="currentView = 'board'" class="text-xs text-amber-400 hover:underline">&lt; 返回主棋盤</button>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(user, index) in sortedUsers" :key="user.id">
                                <div class="bg-slate-900/60 p-4 rounded-xl flex items-center justify-between border border-slate-700">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-8 h-8 rounded-full flex items-center justify-center font-bold font-mono text-sm"
                                              :class="index === 0 ? 'bg-amber-400 text-slate-950' : (index === 1 ? 'bg-slate-300 text-slate-950' : (index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'))"
                                              x-text="index + 1"></span>
                                        <div>
                                            <h4 class="font-bold text-white" x-text="user.name"></h4>
                                            <p class="text-xs text-slate-400" x-text="user.title"></p>
                                        </div>
                                    </div>
                                    <div class="flex space-x-6 font-mono text-sm">
                                        <span class="text-emerald-400">FYC: <strong x-text="user.fyc.toLocaleString()"></strong></span>
                                        <span class="text-amber-400">點數: <strong x-text="user.points"></strong></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- 登入 / 註冊彈跳視窗 -->
    <div x-show="openLoginModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm p-6 rounded-2xl shadow-2xl relative">
            <h3 class="text-lg font-black text-white mb-4">登入競賽大亨</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">選擇測試帳號</label>
                    <select x-model="loginEmail" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="admin@example.com">指揮官 (管理員)</option>
                        <option value="user1@example.com">王小明 (業務)</option>
                        <option value="user2@example.com">陳美麗 (業務)</option>
                    </select>
                </div>
                <button @click="login()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow transition">
                    確認登入
                </button>
                <button @click="openLoginModal = false" class="w-full py-2 text-xs text-slate-400 hover:text-white">取消</button>
            </div>
        </div>
    </div>

    <!-- 申報業績彈跳視窗 -->
    <div x-show="openClaimModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <h3 class="text-lg font-black text-white mb-2">📈 申報業績 / 點數</h3>
            <p class="text-xs text-slate-400 mb-4">輸入您的 FYC 金額，系統將自動換算點數送交指揮中心審核。</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">申報金額 (FYC)</label>
                    <input type="number" x-model.number="claimFyc" placeholder="例如: 50000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono">
                    <p class="text-[10px] text-amber-400 mt-1" x-text="'預估可換算點數: ' + Math.floor(claimFyc / 1000) + ' 點 (每千元換1點)'"></p>
                </div>
                <div class="flex space-x-2 pt-2">
                    <button @click="submitClaim()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition">送出申報</button>
                    <button @click="openClaimModal = false" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 競賽大亨系統. All Rights Reserved.
    </footer>

    <!-- Alpine.js 核心邏輯 -->
    <script>
        function gameApp() {
            return {
                currentView: 'board', // board, admin, leaderboard
                adminTab: 'audit',
                openLoginModal: false,
                openClaimModal: false,
                loginEmail: 'admin@example.com',
                currentUser: null,
                isRolling: false,
                claimFyc: 0,
                selectedTile: null,

                // 網站設定
                settings: {
                    gameTitle: '競賽大亨',
                    gameSubtitle: '業務激勵競賽系統',
                    marqueeText: '熱烈慶賀本月競賽開跑！挑戰大富翁棋盤賺取豐富獎勵，衝刺業績奪得第一！',
                    primaryColor: '#f59e0b',
                    headerColor: '#0f172a',
                    bgColor: '#090d16'
                },

                // 模擬資料庫：所有用戶
                allUsers: [
                    { id: 1, name: '指揮官 (Admin)', email: 'admin@example.com', isAdmin: true, points: 150, fyc: 150000, position: 12, title: '資深總監' },
                    { id: 2, name: '王小明', email: 'user1@example.com', isAdmin: false, points: 120, fyc: 120000, position: 8, title: '高級專員' },
                    { id: 3, name: '陳美麗', email: 'user2@example.com', isAdmin: false, points: 95, fyc: 95000, position: 5, title: '優秀業務' }
                ],

                // 待審核清單
                pendingClaims: [
                    { id: 101, userId: 2, userName: '王小明', type: 'FYC 申報', fyc: 30000, points: 30 }
                ],

                initApp() {
                    // 預設以管理員身分登入以方便測試
                    this.currentUser = this.allUsers[0];
                },

                login() {
                    const found = this.allUsers.find(u => u.email === this.loginEmail);
                    if (found) {
                        this.currentUser = found;
                        this.openLoginModal = false;
                    }
                },

                logout() {
                    this.currentUser = null;
                    this.currentView = 'board';
                },

                get sortedUsers() {
                    return [...this.allUsers].sort((a, b) => b.fyc - a.fyc);
                },

                rollDice() {
                    if (this.isRolling) return;
                    this.isRolling = true;
                    
                    setTimeout(() => {
                        const steps = Math.floor(Math.random() * 6) + 1;
                        this.currentUser.position = ((this.currentUser.position + steps - 1) % 30) + 1;
                        this.isRolling = false;
                        
                        // 觸發慶祝特效
                        confetti({
                            particleCount: 40,
                            spread: 60,
                            origin: { y: 0.8 }
                        });
                    }, 800);
                },

                submitClaim() {
                    if (this.claimFyc <= 0) return;
                    const newClaim = {
                        id: Date.now(),
                        userId: this.currentUser.id,
                        userName: this.currentUser.name,
                        type: 'FYC 申報',
                        fyc: this.claimFyc,
                        points: Math.floor(this.claimFyc / 1000)
                    };
                    this.pendingClaims.push(newClaim);
                    this.claimFyc = 0;
                    this.openClaimModal = false;
                    alert('申報已送出，等待指揮中心審核！');
                },

                approveClaim(claimId) {
                    const index = this.pendingClaims.findIndex(c => c.id === claimId);
                    if (index !== -1) {
                        const claim = this.pendingClaims[index];
                        const targetUser = this.allUsers.find(u => u.id === claim.userId);
                        if (targetUser) {
                            targetUser.points += claim.points;
                            targetUser.fyc += claim.fyc;
                        }
                        this.pendingClaims.splice(index, 1);
                        alert('審核通過，點數已核發！');
                    }
                },

                rejectClaim(claimId) {
                    this.pendingClaims = this.pendingClaims.filter(c => c.id !== claimId);
                    alert('已拒絕該筆申報。');
                },

                getTileIcon(i) {
                    if (i === 1) return '🏁';
                    if (i % 5 === 0) return '🎁';
                    if (i % 3 === 0) return '⚡';
                    return '⭐';
                }
            }
        }
    </script>
</body>
</html>
