<html lang="zh-TW" class="h-full"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
        .dice-container { perspective: 600px; }
        .dice-cube { width: 60px; height: 60px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-slate-800 text-green-400 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '雲端同步連線中 (Online)' : '離線警告 (Offline)'">雲端同步連線中 (Online)</span>
            </span>

            <span class="hidden md:inline-flex items-center text-slate-300">
                <i class="fas fa-clock mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-slate-300 font-semibold hidden sm:inline">
                <i class="fas fa-dice mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 競賽期間: <span x-text="settings.startDate || '2026/12/14'"></span> ~ <span x-text="settings.endDate || '2027/06/02'"></span> 
                <span class="ml-2 bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded border border-orange-500/40 text-xs font-bold" x-text="'⏳ 倒數 ' + getCountdownDays() + ' 天'"></span>
            </span>

            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 text-white rounded font-bold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition flex items-center space-x-1.5" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心</span>
            </button>
        </div>
    </header>

    <!-- OFFLINE WARNING BANNER -->
    <div x-show="!isOnline" x-transition class="bg-red-600 text-white px-4 py-2 text-center text-xs font-bold flex items-center justify-center space-x-2 shadow-inner">
        <i class="fas fa-exclamation-triangle text-white text-base animate-bounce"></i>
        <span>【警告】目前偵測無網路連線或雲端同步異常！請檢查您的網路狀態。</span>
    </div>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2.5 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 relative flex items-center shadow-inner" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
            <i class="fas fa-bullhorn mr-1"></i> 最新戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide text-slate-200">
                <span x-text="settings.ticker1"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker2"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker3"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">

        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white relative border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <div class="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl rotate-3" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1 tracking-widest font-serif">Competition Tycoon</p>
                </div>

                <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'login' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'register' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'forgot' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">忘記密碼</button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入戰情室</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" required class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm" placeholder="OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">選擇個人頭貼 Icon (10選1)</label>
                                <div class="grid grid-cols-5 gap-2 mt-1">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" class="p-2 text-2xl rounded-xl border text-center transition flex items-center justify-center bg-slate-50" :class="regForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="regForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av">
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2 mt-2">
                                <i class="fas fa-user-plus" :style="'color: ' + (settings.primaryColor || '#f97316')"></i>
                                <span>立即註冊 (起始點數 0)</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">註冊姓名 / 帳號</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full text-white font-bold py-2.5 rounded-xl shadow transition text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                查詢密碼
                            </button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-orange-50 border border-orange-300 rounded-xl text-center">
                                    <p class="text-xs text-slate-500">查詢結果：</p>
                                    <p class="text-base font-bold mt-1" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW (戰情室) -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Overview Banner -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                                <span class="px-2.5 py-0.5 text-white text-xs rounded-full font-semibold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                                <span class="px-2.5 py-0.5 bg-slate-800 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">歡迎來到【戰情室】！多裝置資料已自動雲端同步。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">FYC 總額</span>
                            <span class="text-base font-bold text-slate-900" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">可用點數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">累積點數</span>
                            <span class="text-base font-bold text-slate-900" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">骰子次數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                    <!-- LEFT -->
                    <div class="lg:col-span-5 space-y-6">
                        
                        <!-- 1. 個人資訊管理卡片 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                            <h3 class="text-base font-bold text-slate-900 ming-title flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-id-card mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 個人資訊與推播設定</span>
                                <button @click="showProfileEdit = !showProfileEdit; if(showProfileEdit) initProfileForm();" class="text-xs hover:underline font-semibold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="showProfileEdit ? '取消編輯' : '編輯資料'"></button>
                            </h3>

                            <template x-if="!showProfileEdit">
                                <div class="space-y-2 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                    <div class="flex justify-between"><span class="text-slate-400">姓名:</span><span class="font-bold text-slate-900" x-text="currentUser.name"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">職級:</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Email:</span><span class="font-mono text-slate-800" x-text="currentUser.email"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">個人 FYC 業績:</span><span class="font-bold text-slate-900" x-text="formatCurrency(currentUser.fyc || 0)"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">整組總業績 (含Buff):</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="formatCurrency(getTotalFYC(currentUser))"></span></div>
                                    <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                                        <span class="font-bold text-slate-800"><i class="fas fa-bell mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 推播通知開關：</span>
                                        <label class="flex items-center space-x-1.5 cursor-pointer">
                                            <input type="checkbox" x-model="currentUser.pushEnabled" @change="savePushSettings()" class="rounded text-orange-500 w-4 h-4">
                                            <span class="font-bold" x-text="currentUser.pushEnabled ? '已開啟 (' + getDeviceOS() + ')' : '已關閉'"></span>
                                        </label>
                                    </div>
                                </div>
                            </template>

                            <template x-if="showProfileEdit">
                                <form @submit.prevent="saveProfileChanges()" class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">姓名</label>
                                        <input type="text" x-model="profileForm.name" class="w-full px-3 py-2 border rounded-xl bg-white" required>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">職級</label>
                                        <select x-model="profileForm.rank" class="w-full px-2.5 py-2 border rounded-xl bg-white">
                                            <option value="業務專員">業務專員</option>
                                            <option value="業務主任">業務主任</option>
                                            <option value="業務襄理">業務襄理</option>
                                            <option value="業務經理">業務經理</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">Email (帳號)</label>
                                        <input type="email" x-model="profileForm.email" class="w-full px-3 py-2 border rounded-xl bg-white" required>
                                    </div>
                                    <div class="pt-2 border-t">
                                        <label class="block font-bold text-slate-700 mb-1">變更密碼 (留空則不修改)</label>
                                        <input type="password" x-model="profileForm.newPassword" class="w-full px-3 py-2 border rounded-xl bg-white" placeholder="輸入新密碼">
                                    </div>
                                    <button type="submit" class="w-full text-white font-bold py-2 rounded-xl shadow transition" :style="'background-color: ' + (settings.primaryColor || '#f97316')">儲存個人資訊</button>
                                </form>
                            </template>
                        </div>

                        <!-- 2. 成績申報 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <h3 class="text-base font-bold text-slate-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 成績申報與 Tag 任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (FYC原始輸入與千位進位換算)' : ' (固定點数: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">輸入原始 FYC 金額 (後台紀錄精確數字，點數自動無條件進位千位換算)</label>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" step="1" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="例如：10250">

    <script>
        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'success') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'dice') {
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                }
            } catch(e) {}
        }

        const API_BASE = 'https://competition-tycoon.onrender.com/api';

        function app() {

                loginForm: { account: '', password: '' },

                showProfileEdit: false,
                profileForm: { name: '', rank: '', email: '', newPassword: '' },

                selectedCell: {},
                selectedCellIndex: 0,
                showCellDetailModal: false,
                showLandingModal: false,
                currentLandedCell: {},

                showDiceModal: false,
                isRolling: false,
                rollingDiceNumber: 1,

                declForm: { tag: 'FYC', fycAmount: 10250, desc: '' },
                isFYCTag: true,
                declarations: [],

                msgForm: { title: '', content: '', isAnonymous: false },
                messages: [],
                replyTexts: {},

                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                adminPassword: 'admin',
                adminTab: 'approvals',
                newAdminPassword: '',
                newTagForm: { name: '', isFYC: false, points: 50 },
                systemRawCode: '',

                showEditPartnerModal: false,
                editingPartner: { name: '', rank: '', group: '', fyc: 0, points: 0, diceCount: 0, buffs: [] },
                editingPartnerIndex: -1,

                showDeleteConfirmModal: false,
                deletingPartnerIndex: -1,
                deletingPartnerTarget: null,

                isEditingSettings: false,

                settings: {
                    newsTitle: '🏆 競賽大亨正式開跑！',
                    newsContent: '歡迎各位頂尖業務菁英加入競賽大亨！請透過每日拜訪、增員與 FYC 申報賺取點數，解鎖 30 格大富翁棋盤豐富獎勵！',
                    startDate: '2026/12/14',
                    endDate: '2027/06/02',
                    ticker1: '🎉 賀！競賽大亨雙軌競賽熱血啟動！所有申報請確實填寫任務說明！',
                    ticker2: '🔥 團隊夥伴衝刺中，每日拜訪與增員點數即時同步雲端！',
                    ticker3: '⭐ 恭喜各組菁英挑戰機會命運大富翁棋盤豐富大獎！',
                    primaryColor: '#f97316',
                    headerColor: '#0f172a',
                    bgColor: '#FAFAFA',
                    tags: [
                        { name: 'FYC', isFYC: true, points: 0 },
                        { name: '活動邀約', isFYC: false, points: 10 },
                        { name: '增員面談', isFYC: false, points: 20 },
                        { name: '新夥伴公司考', isFYC: false, points: 30 },
                        { name: '新夥伴外部考', isFYC: false, points: 30 },
                        { name: '新夥伴報聘', isFYC: false, points: 50 }
                    ],
                    boardCells: []
                },

                rewardsList: [],
                showNewsModal: false,
                showNotificationModal: false,
                notificationTitle: '',
                notificationText: '',
                partners: [],
                lastMsgCount: 0,
                lastKnownPoints: 0,
                lastDeclCount: 0,

                async init() {
                    window.addEventListener('beforeunload', () => {
                        sessionStorage.removeItem('tycoon_active_session');
                    });

                    if (!sessionStorage.getItem('tycoon_active_session')) {
                        localStorage.removeItem('tycoon_current_user');
                    }

                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { 
                        this.isOnline = false; 
                    });

                    setInterval(() => {
                        const now = new Date();
                        const taipeiFormatter = new Intl.DateTimeFormat('zh-TW', {
                            timeZone: 'Asia/Taipei',
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit', second: '2-digit',
                            hour12: false
                        });
                        this.taipeiTime = taipeiFormatter.format(now).replace(/\//g, '-');

                        const timeStr = taipeiFormatter.format(now);
                        if (timeStr.includes('22:00:00')) {
                            this.autoBackupData();
                        }
                    }, 1000);

                    await this.fetchCloudData();

                    setInterval(async () => {
                        await this.fetchCloudData();
                    }, 15000);

                    const savedUser = localStorage.getItem('tycoon_current_user');
                    const activeSession = sessionStorage.getItem('tycoon_active_session');
                    if (savedUser && activeSession) {
                        this.currentUser = JSON.parse(savedUser);
                        this.lastKnownPoints = this.currentUser.points || 0;
                        if (this.currentUser.pushEnabled === undefined) this.currentUser.pushEnabled = true;
                        this.initProfileForm();
                    } else {
                        this.currentUser = null;
                        localStorage.removeItem('tycoon_current_user');
                    }

                    setTimeout(() => { this.showNewsModal = true; }, 500);
                },

                getDeviceOS() {
                    const ua = navigator.userAgent || navigator.vendor || window.opera;
                    if (/android/i.test(ua)) return 'Android';
                    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'iOS';
                    return '網頁版';
                },

                initProfileForm() {
                    if (this.currentUser) {
                        this.profileForm.name = this.currentUser.name;
                        this.profileForm.rank = this.currentUser.rank;
                        this.profileForm.email = this.currentUser.email;
                        this.profileForm.newPassword = '';
                    }
                },

                getCountdownDays() {
                    if (!this.settings.endDate) return 0;
                    try {
                        const endParts = this.settings.endDate.split('/');
                        const targetDate = new Date(endParts[0], endParts[1] - 1, endParts[2]);
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);
                        const diffTime = targetDate - today;
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        return diffDays >= 0 ? diffDays : 0;
                    } catch (e) {
                        return 0;
                    }
                },

                async fetchCloudData() {
                    try {
                        const res = await fetch(`${API_BASE}/state`, { cache: 'no-store' });
                        if (res.ok) {
                            const data = await res.json();
                            const newPartners = data.partners || [];
                            const newMessages = data.messages || [];
                            const newDeclarations = data.declarations || [];

                            if (this.lastMsgCount > 0 && newMessages.length > this.lastMsgCount) {
                                const latestMsg = newMessages[0];
                                this.showAlert('💬 新士氣留言', `【${latestMsg.title}】\n${latestMsg.content}\n- ${latestMsg.author}`);
                            }
                            this.lastMsgCount = newMessages.length;

                            if (this.currentUser) {
                                const matched = newPartners.find(p => p.email === this.currentUser.email);
                                if (matched) {
                                    if (matched.points > this.lastKnownPoints) {
                                        const diff = matched.points - this.lastKnownPoints;
                                        const winMsg = `🎉 恭喜獲點！指揮中心已通過您的申報，成功獲得 +${diff} 點與對應骰子！`;
                                        this.showAlert('🏆 戰情室捷報', winMsg);
                                        this.settings.ticker1 = `🔥 最新戰報：${matched.name} 申報審核通過，成功獲得 +${diff} 點！`;
                                    }
                                    this.lastKnownPoints = matched.points;
                                    this.currentUser = matched;
                                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                                }
                            }

                            this.partners = newPartners;
                            this.declarations = newDeclarations;
                            this.messages = newMessages;
                            this.rewardsList = data.rewardsList || [];
                            
                            if (data.settings) {
                                if (data.settings.adminPassword) {
                                    this.adminPassword = data.settings.adminPassword;
                                }
                                if (!this.isEditingSettings) {
                                    this.settings = data.settings;
                                }
                            }

                            this.isOnline = true;

                            if (!this.settings.boardCells || this.settings.boardCells.length !== 30) {
                                this.initDefaultBoardCells();
                            }
                        }
                    } catch(e) {
                        if (!navigator.onLine) {
                            this.isOnline = false;
                        }
                    }
                },

                async syncToServer() {
                    try {
                        this.settings.adminPassword = this.adminPassword;
                        await fetch(`${API_BASE}/state`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                partners: this.partners,
                                declarations: this.declarations,
                                messages: this.messages,
                                rewardsList: this.rewardsList,
                                settings: this.settings
                            })
                        });
                        this.isOnline = true;
                    } catch(e) {
                        this.isOnline = false;
                    }
                },

                initDefaultBoardCells() {
                    const templates = [
                        { title: '起點 / 活力充沛', icon: '🚩', type: '獎勵', reward: '獲得 20 點積分與 2 次擲骰機會！' },
                        { title: '拜訪幸運星', icon: '⭐', type: '獎勵', reward: '獲得 10 點點數及精美筆記本乙本。' },
                        { title: '增員金頭腦', icon: '🧠', type: '獎勵', reward: '獲得 30 點點數與專業培訓課程。' },
                        { title: '業績小爆發', icon: '📈', type: '獎勵', reward: '獲得額外 1 顆骰子與 15 點！' },
                        { title: '咖啡時光', icon: '☕', type: '普通', reward: '放鬆心情，獲得 5 點與星巴克禮券。' },
                        { title: '團隊榮譽格', icon: '🏆', type: '獎勵', reward: '獲得特製榮譽徽章與 50 點獎勵！' },
                        { title: '客戶成交喜訊', icon: '💰', type: '獎勵', reward: '業績大躍進，獲得 40 點與專屬小禮物。' },
                        { title: '領導力大考驗', icon: '🎯', type: '普通', reward: '晉升助力，獲得 30 點點數。' },
                        { title: '幸運轉盤', icon: '🎡', type: '傳送', reward: '啟動任意傳送門，隨機移動至棋盤其他位置！' },
                        { title: '大亨寶箱', icon: '🎁', type: '獎勵', reward: '獲得神祕實體大獎與 60 點！' }
                    ];
                    this.settings.boardCells = [];
                    for (let i = 0; i < 30; i++) {
                        const t = templates[i % templates.length];
                        this.settings.boardCells.push({ title: t.title, icon: t.icon, type: t.type, reward: t.reward });
                    }
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        this.lastKnownPoints = this.currentUser.points || 0;
                        if (this.currentUser.pushEnabled === undefined) this.currentUser.pushEnabled = true;
                        localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                        sessionStorage.setItem('tycoon_active_session', 'active');
                        this.initProfileForm();
                        playBeep('success');
                        this.showAlert('登入成功', `歡迎回來，${this.currentUser.name} 業務大亨！`);
                    } else {
                        this.showAlert('登入失敗', '帳號或密碼錯誤，請重新確認。');
                    }
                },

                async register() {
                    if (this.partners.some(p => p.email === this.regForm.email)) {
                        this.showAlert('註冊失敗', '此電子信箱已經註冊過帳號！');
                        return;
                    }
                    const newP = {
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group || 'OO組',
                        avatar: this.regForm.avatar,
                        pushEnabled: true,
                        fyc: 0, points: 0, totalPoints: 0, diceCount: 0, position: 0, buffs: []
                    };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    this.lastKnownPoints = 0;
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    sessionStorage.setItem('tycoon_active_session', 'active');
                    this.initProfileForm();
                    
                    this.settings.ticker2 = `🎉 新夥伴報聘捷報：熱烈歡迎 ${newP.name} (${newP.rank}) 加入 ${newP.group}！`;
                    await this.syncToServer();
                    playBeep('success');
                    this.showAlert('註冊成功', '已同步至雲端伺服器！起始點數皆為 0。');
                },

                findPassword() {
                    const found = this.partners.find(p => p.name === this.forgotForm.name && p.email === this.forgotForm.email);
                    if (found) {
                        this.forgotResult = `您的密碼為：${found.password}`;
                    } else {
                        this.forgotResult = '找不到符合該姓名與電子信箱的帳號紀錄。';
                    }
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('tycoon_current_user');
                    sessionStorage.removeItem('tycoon_active_session');
                },

                async saveProfileChanges() {
                    if (!this.currentUser) return;
                    this.currentUser.name = this.profileForm.name;
                    this.currentUser.rank = this.profileForm.rank;
                    this.currentUser.email = this.profileForm.email;
                    if (this.profileForm.newPassword && this.profileForm.newPassword.trim() !== '') {
                        this.currentUser.password = this.profileForm.newPassword;
                    }

                    const idx = this.partners.findIndex(p => p.email === this.currentUser.email || p.name === this.currentUser.name);
                    if (idx !== -1) {
                        this.partners[idx] = JSON.parse(JSON.stringify(this.currentUser));
                    }

                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                    this.showProfileEdit = false;
                    this.showAlert('修改成功', '個人資訊與密碼已成功更新並同步至雲端！');
                },

                async savePushSettings() {
                    if (!this.currentUser) return;
                    const idx = this.partners.findIndex(p => p.email === this.currentUser.email);
                    if (idx !== -1) {
                        this.partners[idx].pushEnabled = this.currentUser.pushEnabled;
                    }
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                },

                onTagChange() {
                    const selected = this.settings.tags.find(t => t.name === this.declForm.tag);
                    this.isFYCTag = selected ? selected.isFYC : false;
                },

                getSelectedTagPoints() {
                    const selected = this.settings.tags.find(t => t.name === this.declForm.tag);
                    return selected ? selected.points : 10;
                },

                async submitDeclaration() {
                    if (!this.declForm.desc || this.declForm.desc.trim() === '') {
                        this.showAlert('欄位未填寫', '請務必填寫「任務說明/備註」後才能送出審核申請！');
                        return;
                    }
                    let pts = 0;
                    let dCount = 0;
                    let rawFYC = 0;
                    if (this.isFYCTag) {
                        rawFYC = this.declForm.fycAmount || 0;
                        const roundedFYC = Math.ceil(rawFYC / 1000) * 1000;
                        pts = Math.floor(roundedFYC / 1000);
                        dCount = Math.floor(pts / 10) || 1;
                    } else {
                        pts = this.getSelectedTagPoints();
                        dCount = 1;
                    }
                    const req = {
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: this.declForm.desc + (this.isFYCTag ? ` (原始 FYC 金額: $${rawFYC})` : ''),
                        rawFYC: rawFYC,
                        points: pts,
                        dice: dCount,
                        time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
                    };
                    this.declarations.push(req);
                    this.settings.ticker3 = `🔥 最新任務提交：${this.currentUser.name} 提交了【${req.tag}】申報，正等待指揮中心審核！`;

                    await this.syncToServer();
                    playBeep('success');
                    this.showAlert('申報已送出', '您的案件已提交至雲端指揮中心審核！');
                    this.declForm.desc = '';
                },

                async approveDecl(index) {
                    const req = this.declarations[index];
                    const pIdx = this.partners.findIndex(p => p.email === req.userEmail);
                    if (pIdx !== -1) {
                        this.partners[pIdx].points = (this.partners[pIdx].points || 0) + req.points;
                        this.partners[pIdx].totalPoints = (this.partners[pIdx].totalPoints || 0) + req.points;
                        this.partners[pIdx].diceCount = (this.partners[pIdx].diceCount || 0) + req.dice;
                        
                        if (req.tag === 'FYC') {
                            const addFYC = req.rawFYC || 0;
                            this.partners[pIdx].fyc = (this.partners[pIdx].fyc || 0) + addFYC;

                            this.partners.forEach(u => {
                                if (u.buffs && u.buffs.includes(this.partners[pIdx].name)) {
                                    u.points = (u.points || 0) + req.points;
                                    u.totalPoints = (u.totalPoints || 0) + req.points;
                                    u.diceCount = (u.diceCount || 0) + req.dice;
                                }
                            });
                        }
                    }
                    this.declarations.splice(index, 1);
                    await this.syncToServer();
                    try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); } catch(e) {}
                    playBeep('success');
                    this.showAlert('審核通過', `已成功撥發 ${req.points} 點與 ${req.dice} 顆骰子給 ${req.userName}！`);
                },

                async rejectDecl(index) {
                    this.declarations.splice(index, 1);
                    await this.syncToServer();
                    this.showAlert('已拒絕', '該筆申報案件已退回。');
                },

                async rollDice() {
                    if (this.currentUser.points < 10) {
                        this.showAlert('點數不足', '每次擲骰需要 10 點點數！');
                        return;
                    }
                    this.currentUser.points -= 10;
                    this.lastKnownPoints = this.currentUser.points;
                    const pIdx = this.partners.findIndex(p => p.email === this.currentUser.email);
                    if (pIdx !== -1) {
                        this.partners[pIdx].points = this.currentUser.points;
                    }
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    
                    this.isRolling = true;
                    this.showDiceModal = true;
                    playBeep('dice');

                    let rolls = 0;
                    const rollInterval = setInterval(async () => {
                        this.rollingDiceNumber = Math.floor(Math.random() * 6) + 1;
                        rolls++;
                        if (rolls > 10) {
                            clearInterval(rollInterval);
                            const finalStep = this.rollingDiceNumber;
                            this.isRolling = false;
                            this.showDiceModal = false;

                            let nextPos = (this.currentUser.position + finalStep) % 30;
                            let landed = this.settings.boardCells[nextPos];

                            if (landed.type === '傳送') {
                                nextPos = Math.floor(Math.random() * 30);
                                landed = this.settings.boardCells[nextPos];
                            }

                            this.currentUser.position = nextPos;
                            const uIdx = this.partners.findIndex(p => p.email === this.currentUser.email);
                            if (uIdx !== -1) {
                                this.partners[uIdx].position = nextPos;
                            }

                            if (landed.type === '獎勵') {
                                this.rewardsList.push({
                                    userName: this.currentUser.name,
                                    reward: `踩中 #${nextPos + 1} ${landed.title}：${landed.reward}`,
                                    time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
                                    status: '待發放'
                                });
                            }

                            localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                            await this.syncToServer();

                            this.currentLandedCell = landed;
                            this.showLandingModal = true;
                            playBeep('success');
                        }
                    }, 100);
                },

                closeLandingModal() {
                    this.showLandingModal = false;
                },

                hasPlayerHere(index) {
                    return this.partners.some(p => (p.position || 0) === index);
                },

                getPlayersOnCell(index) {
                    return this.partners.filter(p => (p.position || 0) === index);
                },

                openCellModal(cell, index) {
                    this.selectedCell = cell;
                    this.selectedCellIndex = index;
                    this.showCellDetailModal = true;
                },

                getTotalFYC(p) {
                    let base = p.fyc || 0;
                    if (p.buffs && p.buffs.length > 0) {
                        p.buffs.forEach(bName => {
                            const subP = this.partners.find(x => x.name === bName);
                            if (subP) {
                                base += (subP.fyc || 0);
                            }
                        });
                    }
                    return base;
                },

                formatCurrency(val) {
                    return '$' + Number(val || 0).toLocaleString();
                },

                getGroupPartners() {
                    if (!this.currentUser) return [];
                    return this.partners.filter(p => p.group === this.currentUser.group);
                },

                async postMessage() {
                    if (!this.msgForm.title || !this.msgForm.content) return;
                    const newMsg = {
                        title: this.msgForm.title,
                        content: this.msgForm.content,
                        author: this.currentUser.name,
                        isAnonymous: this.msgForm.isAnonymous,
                        time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
                        likes: 0,
                        replies: []
                    };
                    this.messages.unshift(newMsg);
                    this.msgForm.title = '';
                    this.msgForm.content = '';
                    this.msgForm.isAnonymous = false;
                    await this.syncToServer();
                    playBeep('success');
                    this.showAlert('發布成功', '士氣留言已同步至全體夥伴看板！');
                },

                async likeMessage(index) {
                    if (!this.messages[index].likes) this.messages[index].likes = 0;
                    this.messages[index].likes++;
                    await this.syncToServer();
                },

                async postReply(index) {
                    const text = this.replyTexts[index];
                    if (!text || text.trim() === '') return;
                    if (!this.messages[index].replies) this.messages[index].replies = [];
                    this.messages[index].replies.push({
                        author: this.currentUser.name,
                        content: text,
                        time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
                    });
                    this.replyTexts[index] = '';
                    await this.syncToServer();
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) {
                        this.adminAuth = true;
                        this.adminPassInput = '';
                    } else {
                        this.showAlert('驗證失敗', '管理者密碼錯誤！');
                    }
                },

                async saveSettings() {
                    await this.syncToServer();
                    this.showAlert('儲存成功', '系統設定與外觀已全面更新並同步！');
                },

                editPartner(p) {
                    this.editingPartner = JSON.parse(JSON.stringify(p));
                    if (!this.editingPartner.buffs) this.editingPartner.buffs = [];
                    this.showEditPartnerModal = true;
                },

                async savePartnerEdit() {
                    const idx = this.partners.findIndex(p => p.email === this.editingPartner.email);
                    if (idx !== -1) {
                        this.partners[idx] = JSON.parse(JSON.stringify(this.editingPartner));
                        if (this.currentUser && this.currentUser.email === this.editingPartner.email) {
                            this.currentUser = JSON.parse(JSON.stringify(this.editingPartner));
                            localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                        }
                    }
                    this.showEditPartnerModal = false;
                    await this.syncToServer();
                    this.showAlert('更新成功', '夥伴資料與 Buff 已順利更新！');
                },

                promptDeletePartner(idx) {
                    this.deletingPartnerIndex = idx;
                    this.deletingPartnerTarget = this.partners[idx];
                    this.showDeleteConfirmModal = true;
                },

                async executeDeletePartner() {
                    if (this.deletingPartnerIndex !== -1) {
                        this.partners.splice(this.deletingPartnerIndex, 1);
                        this.showDeleteConfirmModal = false;
                        await this.syncToServer();
                        this.showAlert('刪除成功', '該夥伴帳號已被安全移除。');
                    }
                },

                addTag() {
                    if (!this.newTagForm.name) return;
                    this.settings.tags.push({
                        name: this.newTagForm.name,
                        isFYC: this.newTagForm.isFYC,
                        points: this.newTagForm.points || 10
                    });
                    this.newTagForm.name = '';
                    this.newTagForm.isFYC = false;
                    this.newTagForm.points = 50;
                },

                removeTag(idx) {
                    this.settings.tags.splice(idx, 1);
                },

                async updateAdminPassword() {
                    if (!this.newAdminPassword || this.newAdminPassword.trim() === '') return;
                    this.adminPassword = this.newAdminPassword;
                    this.settings.adminPassword = this.newAdminPassword;
                    this.newAdminPassword = '';
                    await this.syncToServer();
                    this.showAlert('密碼變更成功', '指揮中心管理者密碼已更新！');
                },

                async toggleRewardStatus(idx) {
                    this.rewardsList[idx].status = this.rewardsList[idx].status === '已發放' ? '待發放' : '已發放';
                    await this.syncToServer();
                },

                async resetAllPositions() {
                    this.partners.forEach(p => p.position = 0);
                    if (this.currentUser) this.currentUser.position = 0;
                    await this.syncToServer();
                    this.showAlert('重設成功', '所有夥伴已全數歸回起始點 (第1格)。');
                },

                async resetAllPoints() {
                    this.partners.forEach(p => { p.points = 0; p.totalPoints = 0; });
                    if (this.currentUser) { this.currentUser.points = 0; this.currentUser.totalPoints = 0; }
                    await this.syncToServer();
                    this.showAlert('重設成功', '所有夥伴點數已歸零。');
                },

                async resetAllDice() {
                    this.partners.forEach(p => p.diceCount = 0);
                    if (this.currentUser) this.currentUser.diceCount = 0;
                    await this.syncToServer();
                    this.showAlert('重設成功', '所有夥伴骰子數已歸零。');
                },

                async factoryResetSystem() {
                    if (confirm('確定要將系統還原至預設狀態嗎？')) {
                        localStorage.clear();
                        sessionStorage.clear();
                        location.reload();
                    }
                },

                loadCurrentCode() {
                    this.systemRawCode = document.documentElement.outerHTML;
                    this.showAlert('載入成功', '目前頁面編碼已載入至檢視框。');
                },

                saveRawCode() {
                    const blob = new Blob([this.systemRawCode || document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'competition_tycoon_fixed.html';
                    a.click();
                    URL.revokeObjectURL(url);
                    this.showAlert('下載成功', '已成功打包下載最新修復後的 HTML 檔案！');
                },

                downloadBackup() {
                    const dataObj = {
                        partners: this.partners,
                        declarations: this.declarations,
                        messages: this.messages,
                        rewardsList: this.rewardsList,
                        settings: this.settings,
                        backupTime: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
                    };
                    const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `tycoon_backup_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },

                autoBackupData() {
                    this.downloadBackup();
                },

                exportRewards() {
                    let csv = '夥伴姓名,獲得獎勵內容,獲得時間,發放狀態\n';
                    this.rewardsList.forEach(r => {
                        csv += `"${r.userName}","${r.reward}","${r.time}","${r.status}"\n`;
                    });
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'rewards_summary.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                },

                showAlert(title, text) {
                    this.notificationTitle = title;
                    this.notificationText = text;
                    this.showNotificationModal = true;
                }
            }
        }
    </script>
</body>
</html>
