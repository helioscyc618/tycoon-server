<html lang="zh-TW" class="h-full"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
        .dice-container { perspective: 600px; }
        .dice-cube { width: 60px; height: 60px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-green-400 border border-green-500">
                <i class="fas fa-wifi"></i>
                <span>系統正常運作</span>
            </span>
            <span class="hidden md:inline-flex items-center text-slate-300">
                <i class="fas fa-clock mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-slate-300 font-semibold hidden sm:inline">
                <i class="fas fa-dice mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 競賽期間: <span x-text="settings.startDate"></span> ~ <span x-text="settings.endDate"></span> 
                <span class="ml-2 bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded border border-orange-500/40 text-xs font-bold" x-text="'⏳ 倒數 ' + getCountdownDays() + ' 天'"></span>
            </span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 text-white rounded font-bold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition flex items-center space-x-1.5" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心</span>
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2.5 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 relative flex items-center shadow-inner" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
            <i class="fas fa-bullhorn mr-1"></i> 最新戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide text-slate-200">
                <span x-text="settings.ticker1"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker2"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker3"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full space-y-6">

        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white relative border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <div class="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl rotate-3" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1 tracking-widest font-serif">Competition Tycoon</p>
                </div>

                <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'login' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'register' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'forgot' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">忘記密碼</button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入戰情室</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm placeholder-slate-300" placeholder="OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">選擇個人頭貼 Icon</label>
                                <div class="grid grid-cols-5 gap-2 mt-1 max-h-40 overflow-y-auto p-1 border border-slate-200 rounded-xl bg-slate-50">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" class="p-2 text-2xl rounded-xl border text-center transition flex items-center justify-center bg-white" :class="regForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="regForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av"></button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2 mt-2">
                                <i class="fas fa-user-plus" :style="'color: ' + (settings.primaryColor || '#f97316')"></i>
                                <span>立即註冊</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">註冊姓名 / 帳號</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full text-white font-bold py-2.5 rounded-xl shadow transition text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                查詢密碼
                            </button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-orange-50 border border-orange-300 rounded-xl text-center">
                                    <p class="text-xs text-slate-500">查詢結果：</p>
                                    <p class="text-base font-bold mt-1" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW (戰情室) -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Overview Banner -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                                <span class="px-2.5 py-0.5 text-white text-xs rounded-full font-semibold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                                <span class="px-2.5 py-0.5 bg-slate-800 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">歡迎來到【戰情室】！</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">FYC 總額</span>
                            <span class="text-base font-bold text-slate-900" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">可用點數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">累積點數</span>
                            <span class="text-base font-bold text-slate-900" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">骰子次數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- LEFT -->
                    <div class="lg:col-span-5 space-y-6">
                        <!-- 個人資訊管理卡片 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                            <h3 class="text-base font-bold text-slate-900 ming-title flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-id-card mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 個人資訊與設定</span>
                                <button @click="showProfileEdit = !showProfileEdit; if(showProfileEdit) initProfileForm();" class="text-xs hover:underline font-semibold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="showProfileEdit ? '取消編輯' : '編輯資料'"></button>
                            </h3>
                            <template x-if="!showProfileEdit">
                                <div class="space-y-2 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                    <div class="flex justify-between"><span class="text-slate-400">姓名:</span><span class="font-bold text-slate-900" x-text="currentUser.name"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">職級:</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Email:</span><span class="font-mono text-slate-800" x-text="currentUser.email"></span></div>
                                </div>
                            </template>
                            <template x-if="showProfileEdit">
                                <form @submit.prevent="saveProfileChanges()" class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">姓名</label>
                                        <input type="text" x-model="profileForm.name" class="w-full px-3 py-2 border rounded-xl bg-white" required>
                                    </div>
                                    <button type="submit" class="w-full text-white font-bold py-2 rounded-xl shadow transition" :style="'background-color: ' + (settings.primaryColor || '#f97316')">儲存個人資訊</button>
                                </form>
                            </template>
                        </div>

                        <!-- 成績申報 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <h3 class="text-base font-bold text-slate-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 成績申報與 Tag 任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (FYC換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">輸入原始 FYC 金額</label>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" step="1" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="例如：10250">
                                    </div>
                                </template>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">任務說明 / 備註 <span class="text-red-600">*</span></label>
                                    <input type="text" x-model="declForm.desc" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請詳細填寫...">
                                </div>
                                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">
                                    送出審核申報
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- RIGHT -->
                    <div class="lg:col-span-7 space-y-6">
                        <!-- Dice Roll Panel -->
                        <div class="bg-slate-900 p-5 rounded-2xl shadow-md border text-white flex flex-col sm:flex-row items-center justify-between gap-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                            <div class="text-center sm:text-left">
                                <h3 class="text-lg font-bold ming-title" :style="'color: ' + (settings.primaryColor || '#f97316')"><i class="fas fa-dice mr-2"></i> 大富翁擲骰推進區</h3>
                                <p class="text-xs text-slate-300 mt-0.5">每次擲骰消耗 <span class="font-bold text-white">10 點</span>。</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="text-center bg-slate-800 px-3 py-1.5 rounded-xl border border-orange-500/40">
                                    <span class="block text-[10px]" :style="'color: ' + (settings.primaryColor || '#f97316')">目前位置</span>
                                    <span class="text-base font-bold text-white font-mono" x-text="'第 ' + (currentUser.position + 1) + ' 格'"></span>
                                </div>
                                <button @click="rollDice()" :disabled="currentUser.points < 10 || isRolling" class="text-white font-bold px-6 py-3 rounded-xl shadow-lg transition disabled:opacity-50 flex items-center space-x-2 text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                    <i class="fas fa-dice-five text-base"></i>
                                    <span x-text="isRolling ? '滾動中...' : '立即擲骰 (10點)'"></span>
                                </button>
                            </div>
                        </div>

                        <!-- 棋盤 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-base font-bold text-slate-900 ming-title"><i class="fas fa-map mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 機會命運大富翁棋盤</h3>
                            </div>
                            <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                                <template x-for="(cell, index) in settings.boardCells" :key="index">
                                    <div @click="openCellModal(cell, index)" class="relative p-2 rounded-xl border flex flex-col items-center justify-center cursor-pointer transition h-20 text-center shadow-xs" :class="hasPlayerHere(index) ? 'bg-orange-50 ring-2' : 'border-slate-200 bg-slate-50'" :style="hasPlayerHere(index) ? 'border-color: ' + (settings.primaryColor || '#f97316') : ''">
                                        <span class="absolute top-1 left-1 text-[9px] font-bold text-slate-400 font-mono" x-text="index + 1"></span>
                                        <span class="text-lg mb-1" x-text="cell.icon"></span>
                                        <span class="text-[10px] font-bold text-slate-800 line-clamp-1" x-text="cell.title"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- COMMAND CENTER MODAL -->
    <div x-show="openAdminModal" class="fixed inset-0 z-30 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-2 sm:p-4" style="display: none;">
        <div class="bg-white rounded-2xl max-w-4xl w-full h-[80vh] overflow-hidden shadow-2xl border flex flex-col">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')">指揮中心</h2>
                <button @click="openAdminModal = false" class="text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <template x-if="!adminAuth">
                    <div class="max-w-xs mx-auto text-center space-y-3 pt-12">
                        <h3 class="font-bold text-slate-800">請輸入管理者密碼 (預設 admin)</h3>
                        <input type="password" x-model="adminPassInput" class="w-full px-3 py-2 border rounded-xl text-center" placeholder="輸入密碼">
                        <button @click="verifyAdmin()" class="w-full text-white font-bold py-2 rounded-xl" :style="'background-color: ' + (settings.primaryColor || '#f97316')">解鎖</button>
                    </div>
                </template>
                <template x-if="adminAuth">
                    <div class="space-y-4">
                        <h3 class="font-bold text-lg text-slate-800">點數審核與夥伴管理</h3>
                        <div class="space-y-2">
                            <template x-for="(req, rIdx) in declarations" :key="rIdx">
                                <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold" x-text="req.userName + ' - ' + req.tag"></span>
                                        <p class="text-slate-600" x-text="req.details"></p>
                                    </div>
                                    <div class="space-x-2">
                                        <button @click="approveDecl(rIdx)" class="bg-green-600 text-white px-3 py-1.5 rounded-lg font-bold">通過</button>
                                        <button @click="rejectDecl(rIdx)" class="bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold">拒絕</button>
                                    </div>
                                </div>
                            </template>
                            <template x-if="declarations.length === 0">
                                <p class="text-slate-400 text-center py-6 text-xs">目前沒有待審核項目</p>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function app() {
            return {
                taipeiTime: '',
                authTab: 'login',
                currentUser: null,
                showProfileEdit: false,
                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                isRolling: false,
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: 'A組', avatar: '🐼' },
                forgotForm: { name: '', email: '' },
                forgotResult: '',
                profileForm: { name: '' },
                declForm: { tag: 'FYC', fycAmount: 0, desc: '' },
                avatarList: ['🐼', '🦁', '🐯', '🦊', '🐨', '🐵', '🐶', '🐱', '🐰', '🦄'],
                settings: {
                    startDate: '2026/12/14',
                    endDate: '2027/06/02',
                    primaryColor: '#f97316',
                    headerColor: '#0f172a',
                    bgColor: '#FAFAFA',
                    ticker1: '🎉 賀！競賽大亨熱血啟動！',
                    ticker2: '🔥 挑戰極限，共創佳績！',
                    ticker3: '⭐ 爭奪最高榮譽！',
                    tags: [
                        { name: 'FYC', isFYC: true, points: 0 },
                        { name: '拜訪', isFYC: false, points: 5 },
                        { name: '成交', isFYC: false, points: 50 }
                    ],
                    boardCells: Array.from({length: 30}, (_, i) => ({
                        icon: i === 0 ? '🚩' : '⭐',
                        title: i === 0 ? '起點' : `第 ${i+1} 關`,
                        type: '普通',
                        reward: '獲得點數獎勵！'
                    }))
                },
                partners: [],
                declarations: [],
                rewardsList: [],

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    this.loadData();
                },

                saveData() {
                    const data = {
                        partners: this.partners,
                        declarations: this.declarations,
                        settings: this.settings
                    };
                    localStorage.setItem('competition_tycoon_stable_data', JSON.stringify(data));
                },

                loadData() {
                    const saved = localStorage.getItem('competition_tycoon_stable_data');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            if (data.partners) this.partners = data.partners;
                            if (data.declarations) this.declarations = data.declarations;
                            if (data.settings) this.settings = { ...this.settings, ...data.settings };
                        } catch(e) { console.error(e); }
                    }
                },

                updateTime() {
                    this.taipeiTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
                },

                getCountdownDays() {
                    try {
                        const diff = new Date(this.settings.endDate) - new Date();
                        return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
                    } catch(e) { return 30; }
                },

                formatCurrency(val) { return '$' + Number(val || 0).toLocaleString(); },
                getTotalFYC(p) { return p.fyc || 0; },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                    } else {
                        alert('帳號或密碼錯誤！');
                    }
                },

                register() {
                    if (this.partners.some(p => p.email === this.regForm.email)) {
                        alert('此 Email 已註冊過！');
                        return;
                    }
                    const newP = {
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group,
                        avatar: this.regForm.avatar,
                        fyc: 0, points: 100, totalPoints: 100, diceCount: 5, position: 0
                    };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    this.saveData();
                    alert('註冊成功！');
                },

                logout() { this.currentUser = null; },

                get isFYCTag() {
                    const t = this.settings.tags.find(x => x.name === this.declForm.tag);
                    return t ? t.isFYC : false;
                },

                submitDeclaration() {
                    let pts = this.isFYCTag ? Math.ceil((this.declForm.fycAmount || 0) / 1000) : 10;
                    this.declarations.unshift({
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: this.declForm.desc,
                        fyc: this.isFYCTag ? this.declForm.fycAmount : 0,
                        points: pts,
                        dice: 1,
                        time: this.taipeiTime
                    });
                    this.saveData();
                    alert('申報已送出！');
                },

                approveDecl(idx) {
                    const req = this.declarations[idx];
                    const target = this.partners.find(p => p.email === req.userEmail);
                    if (target) {
                        target.points += req.points;
                        target.totalPoints += req.points;
                        if (req.tag === 'FYC') target.fyc = (target.fyc || 0) + (req.fyc || 0);
                    }
                    this.declarations.splice(idx, 1);
                    this.saveData();
                    alert('已通過審核！');
                },

                rejectDecl(idx) {
                    this.declarations.splice(idx, 1);
                    this.saveData();
                },

                rollDice() {
                    if (this.currentUser.points < 10) return;
                    this.currentUser.points -= 10;
                    const step = Math.floor(Math.random() * 6) + 1;
                    this.currentUser.position = (this.currentUser.position + step) % 30;
                    this.saveData();
                    alert(`擲出 ${step} 點！目前在第 ${this.currentUser.position + 1} 格`);
                },

                verifyAdmin() {
                    if (this.adminPassInput === 'admin') this.adminAuth = true;
                    else alert('密碼錯誤');
                },

                hasPlayerHere(idx) { return this.partners.some(p => p.position === idx); },
                initProfileForm() { this.profileForm.name = this.currentUser.name; },
                saveProfileChanges() {
                    this.currentUser.name = this.profileForm.name;
                    this.showProfileEdit = false;
                    this.saveData();
                },
                openCellModal() {}
            }
        }
    </script>
</body></html>
