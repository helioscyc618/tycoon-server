<html lang="zh-TW" class="h-full"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
        .dice-container { perspective: 600px; }
        .dice-cube { width: 60px; height: 60px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-slate-800 text-green-400 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '本地資料已同步 (Synced)' : '離線警告 (Offline)'"></span>
            </span>

            <span class="hidden md:inline-flex items-center text-slate-300">
                <i class="fas fa-clock mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-slate-300 font-semibold hidden sm:inline">
                <i class="fas fa-dice mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 競賽期間: <span x-text="settings.startDate || '2026/12/14'"></span> ~ <span x-text="settings.endDate || '2027/06/02'"></span> 
                <span class="ml-2 bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded border border-orange-500/40 text-xs font-bold" x-text="'⏳ 倒數 ' + getCountdownDays() + ' 天'"></span>
            </span>

            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 text-white rounded font-bold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition flex items-center space-x-1.5" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心</span>
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2.5 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 relative flex items-center shadow-inner" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
            <i class="fas fa-bullhorn mr-1"></i> 最新戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide text-slate-200">
                <span x-text="settings.ticker1"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker2"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker3"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full space-y-6">

        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white relative border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <div class="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl rotate-3" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1 tracking-widest font-serif">Competition Tycoon</p>
                </div>

                <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'login' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'register' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'forgot' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">忘記密碼</button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required="" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required="" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:outline-none" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入戰情室</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required="" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" class="w-full px-2.5 py-2 border border-slate-300 rounded-xl text-sm placeholder-slate-300" placeholder="OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">選擇個人頭貼 Icon</label>
                                <div class="grid grid-cols-5 gap-2 mt-1 max-h-40 overflow-y-auto p-1 border border-slate-200 rounded-xl bg-slate-50">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" class="p-2 text-2xl rounded-xl border text-center transition flex items-center justify-center bg-white" :class="regForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="regForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av"></button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center space-x-2 mt-2">
                                <i class="fas fa-user-plus" :style="'color: ' + (settings.primaryColor || '#f97316')"></i>
                                <span>立即註冊</span>
                            </button>
                        </form>
                    </template>

                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">註冊姓名 / 帳號</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full text-white font-bold py-2.5 rounded-xl shadow transition text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                查詢密碼
                            </button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-orange-50 border border-orange-300 rounded-xl text-center">
                                    <p class="text-xs text-slate-500">查詢結果：</p>
                                    <p class="text-base font-bold mt-1" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW (戰情室) -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Overview Banner -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                                <span class="px-2.5 py-0.5 text-white text-xs rounded-full font-semibold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                                <span class="px-2.5 py-0.5 bg-slate-800 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">歡迎來到【戰情室】！資料已自動儲存至本機。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">FYC 總額</span>
                            <span class="text-base font-bold text-slate-900" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">可用點數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">累積點數</span>
                            <span class="text-base font-bold text-slate-900" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <span class="block text-[11px] text-slate-500 font-medium">骰子次數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                    <!-- LEFT -->
                    <div class="lg:col-span-5 space-y-6">

                        <!-- 1. 個人資訊管理卡片 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                            <h3 class="text-base font-bold text-slate-900 ming-title flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-id-card mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 個人資訊與推播設定</span>
                                <button @click="showProfileEdit = !showProfileEdit; if(showProfileEdit) initProfileForm();" class="text-xs hover:underline font-semibold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="showProfileEdit ? '取消編輯' : '編輯資料'"></button>
                            </h3>

                            <template x-if="!showProfileEdit">
                                <div class="space-y-2 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                    <div class="flex justify-between"><span class="text-slate-400">姓名:</span><span class="font-bold text-slate-900" x-text="currentUser.name"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">職級:</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Email:</span><span class="font-mono text-slate-800" x-text="currentUser.email"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">個人 FYC 業績:</span><span class="font-bold text-slate-900" x-text="formatCurrency(currentUser.fyc || 0)"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">整組總業績 (含Buff):</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="formatCurrency(getTotalFYC(currentUser))"></span></div>
                                    <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                                        <span class="font-bold text-slate-800"><i class="fas fa-bell mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 推播通知開關：</span>
                                        <label class="flex items-center space-x-1.5 cursor-pointer">
                                            <input type="checkbox" x-model="currentUser.pushEnabled" @change="saveData()" class="rounded text-orange-500 w-4 h-4">
                                            <span class="font-bold" x-text="currentUser.pushEnabled ? '已開啟' : '已關閉'"></span>
                                        </label>
                                    </div>
                                </div>
                            </template>

                            <template x-if="showProfileEdit">
                                <form @submit.prevent="saveProfileChanges()" class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">姓名</label>
                                        <input type="text" x-model="profileForm.name" class="w-full px-3 py-2 border rounded-xl bg-white" required="">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">職級</label>
                                        <select x-model="profileForm.rank" class="w-full px-2.5 py-2 border rounded-xl bg-white">
                                            <option value="業務專員">業務專員</option>
                                            <option value="業務主任">業務主任</option>
                                            <option value="業務襄理">業務襄理</option>
                                            <option value="業務經理">業務經理</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">Email (帳號)</label>
                                        <input type="email" x-model="profileForm.email" class="w-full px-3 py-2 border rounded-xl bg-white" required="">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">更換頭貼 Icon</label>
                                        <div class="grid grid-cols-5 gap-1.5 mt-1 max-h-36 overflow-y-auto p-1.5 border border-slate-200 rounded-xl bg-slate-50">
                                            <template x-for="av in avatarList" :key="av">
                                                <button type="button" @click="profileForm.avatar = av" class="p-1.5 text-xl rounded-xl border text-center transition flex items-center justify-center bg-white" :class="profileForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200 hover:bg-slate-100'" :style="profileForm.avatar === av ? 'border-color: ' + (settings.primaryColor || '#f97316') + '; color: ' + (settings.primaryColor || '#f97316') : ''" x-text="av"></button>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="pt-2 border-t">
                                        <label class="block font-bold text-slate-700 mb-1">變更密碼 (留空則不修改)</label>
                                        <input type="password" x-model="profileForm.newPassword" class="w-full px-3 py-2 border rounded-xl bg-white" placeholder="輸入新密碼">
                                    </div>
                                    <button type="submit" class="w-full text-white font-bold py-2 rounded-xl shadow transition" :style="'background-color: ' + (settings.primaryColor || '#f97316')">儲存個人資訊與頭貼</button>
                                </form>
                            </template>
                        </div>

                        <!-- 2. 成績申報 -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <h3 class="text-base font-bold text-slate-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 成績申報與 Tag 任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (FYC原始輸入與千位進位換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">系統原始碼 (HTML)</label>
                                    <textarea x-model="systemRawCode" rows="10" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono bg-slate-900 text-green-400" placeholder="在此檢視或貼上更新編碼..."></textarea>
                                </div>
                                <div class="flex flex-wrap items-center gap-2 pt-2">
                                    <button @click="loadCurrentCode()" class="bg-slate-800 text-white font-bold py-2 px-4 rounded-xl text-xs shadow">載入目前編碼</button>
                                    <button @click="saveRawCode()" class="text-white font-bold py-2 px-4 rounded-xl text-xs shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')"><i class="fas fa-file-code mr-1"></i> 匯出修復編碼檔案 (HTML)</button>
                                </div>
                            </div>
                        </template>

                        <!-- TAB 8: 安全、一鍵歸零與備份/還原設定 -->
                        <template x-if="adminTab === 'security'">
                            <div class="space-y-6">
                                <div class="bg-blue-50 p-5 rounded-xl border border-blue-200 space-y-3 max-w-lg">
                                    <h4 class="font-bold text-blue-900 text-sm"><i class="fas fa-cloud-arrow-up mr-1 text-blue-600"></i> 跨裝置資料同步（匯入/匯出備份）</h4>
                                    <p class="text-xs text-slate-600">若要在不同裝置間同步帳號，請在 A 裝置點擊「下載備份檔」，然後在 B 裝置點擊下方上傳該備份檔案進行同步！</p>
                                    <div class="flex items-center space-x-2 pt-1">
                                        <button @click="downloadBackup()" class="text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                            <i class="fas fa-download mr-1"></i> 下載系統備份檔 (JSON)
                                        </button>
                                        <label class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow cursor-pointer">
                                            <i class="fas fa-upload mr-1"></i> 匯入備份同步資料
                                            <input type="file" @change="importBackup($event)" accept=".json" class="hidden">
                                        </label>
                                    </div>
                                </div>

                                <div class="bg-orange-50 p-5 rounded-xl border border-orange-200 space-y-4 max-w-lg">
                                    <h4 class="font-bold text-orange-900 text-sm"><i class="fas fa-triangle-exclamation mr-1 text-orange-600"></i> 系統強力維護與一鍵歸零操作</h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button @click="resetAllPositions()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow">
                                            <i class="fas fa-map-pin mr-1"></i> 一鍵所有人回起始點
                                        </button>
                                        <button @click="resetAllPoints()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow">
                                            <i class="fas fa-coins mr-1"></i> 點數一鍵全部歸零
                                        </button>
                                        <button @click="resetAllDice()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow">
                                            <i class="fas fa-dice mr-1"></i> 骰子數一鍵全部歸零
                                        </button>
                                        <button @click="factoryResetSystem()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow">
                                            <i class="fas fa-rotate-left mr-1"></i> 系統一鍵還原至預設
                                        </button>
                                    </div>
                                </div>

                                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-3 max-w-md">
                                    <h4 class="font-bold text-slate-900 text-sm"><i class="fas fa-key mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 更改指揮中心管理密碼</h4>
                                    <input type="password" x-model="newAdminPassword" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs bg-white" placeholder="請輸入新管理密碼">
                                    <button @click="updateAdminPassword()" class="bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs hover:bg-slate-800 shadow">
                                        確認修改密碼
                                    </button>
                                </div>
                            </div>
                        </template>

                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Alpine.js Application Logic -->
    <script>
        function app() {
            return {
                isOnline: true,
                taipeiTime: '',
                authTab: 'login',
                currentUser: null,
                showProfileEdit: false,
                showNewsModal: false,
                showCellDetailModal: false,
                showLandingModal: false,
                showDiceModal: false,
                showNotificationModal: false,
                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                newAdminPassword: '',
                adminTab: 'approvals',
                isRolling: false,
                rollingDiceNumber: 1,
                notificationTitle: '',
                notificationText: '',
                forgotResult: '',

                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: '', avatar: '🐼' },
                forgotForm: { name: '', email: '' },
                profileForm: { name: '', rank: '', email: '', avatar: '', newPassword: '' },
                declForm: { tag: 'FYC', fycAmount: 0, desc: '' },
                msgForm: { title: '', content: '', isAnonymous: false },
                newTagForm: { name: '', isFYC: false, points: 10 },
                systemRawCode: '',
                selectedCell: {},
                selectedCellIndex: 0,
                currentLandedCell: {},

                avatarList: ['🐼', '🦁', '🐯', '🦊', '🐨', '🐵', '🐶', '🐱', '🐰', '🦄', '👨‍💼', '👩‍💼', '👨‍💻', '👩‍💻', '🧑‍🚀', '🦸‍♂️', '🦸‍♀️', '🧙‍♂️', '🧙‍♀️', '🧑‍🎤'],

                settings: {
                    startDate: '2026/12/14',
                    endDate: '2027/06/02',
                    primaryColor: '#f97316',
                    headerColor: '#0f172a',
                    bgColor: '#FAFAFA',
                    newsTitle: '新一代競賽遊戲 🎮 火熱封測啦！',
                    newsContent: '《 競賽大亨｜competition Tycoon 》3.3v 現正封測中！10/25 即將正式上線！',
                    ticker1: '🎉 賀！競賽大亨3.3v 火熱封測中！雙軌競賽熱血啟動！',
                    ticker2: '🔥 歡迎所有夥伴熱血參與！',
                    ticker3: '⭐ 10/25 正式上線！',
                    youtubeUrl: '<iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
                    youtubeMotto: '🔥 突破自我，創造極限！每一個當下的全力以赴，都是成就非凡的基石！',
                    tags: [
                        { name: 'FYC', isFYC: true, points: 0 },
                        { name: '拜訪', isFYC: false, points: 5 },
                        { name: '增員', isFYC: false, points: 20 },
                        { name: '成交', isFYC: false, points: 50 }
                    ],
                    boardCells: Array.from({length: 30}, (_, i) => ({
                        icon: i === 0 ? '🚩' : (i % 4 === 1 ? '⭐' : i % 4 === 2 ? '🧠' : i % 4 === 3 ? '📈' : '🎁'),
                        title: i === 0 ? '起點 / 活力充沛' : `第 ${i+1} 關挑戰`,
                        type: i % 5 === 0 ? '傳送' : '普通',
                        reward: '獲得隨機加碼獎勵與前進動能！'
                    }))
                },

                partners: [],
                declarations: [],
                messages: [],
                replyTexts: {},
                rewardsList: [],

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    this.loadData();
                },

                saveData() {
                    const appData = {
                        partners: this.partners,
                        declarations: this.declarations,
                        messages: this.messages,
                        rewardsList: this.rewardsList,
                        settings: this.settings
                    };
                    localStorage.setItem('competition_tycoon_data', JSON.stringify(appData));
                },

                loadData() {
                    const saved = localStorage.getItem('competition_tycoon_data');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            if (data.partners) this.partners = data.partners;
                            if (data.declarations) this.declarations = data.declarations;
                            if (data.messages) this.messages = data.messages;
                            if (data.rewardsList) this.rewardsList = data.rewardsList;
                            if (data.settings) this.settings = { ...this.settings, ...data.settings };
                        } catch(e) {
                            console.error('載入本機資料失敗', e);
                        }
                    }
                },

                updateTime() {
                    const now = new Date();
                    this.taipeiTime = now.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
                },

                getCountdownDays() {
                    try {
                        const end = new Date(this.settings.endDate);
                        const now = new Date();
                        const diff = end - now;
                        return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
                    } catch(e) {
                        return 40;
                    }
                },

                formatCurrency(val) {
                    return '$' + Number(val || 0).toLocaleString();
                },

                getTotalFYC(p) {
                    return p.fyc || 0;
                },

                getGroupPartners() {
                    if (!this.currentUser) return [];
                    return this.partners.filter(p => p.group === this.currentUser.group);
                },

                renderYouTubeEmbed(input) {
                    if (!input) return '<div class="flex items-center justify-center h-full text-slate-400 text-xs">尚未設定 YouTube 影片</div>';
                    let trimmed = input.trim();
                    if (trimmed.startsWith('<iframe')) {
                        let fixed = trimmed.replace(/width="[^"]*"/g, 'width="100%"').replace(/height="[^"]*"/g, 'height="100%"');
                        if (!fixed.includes('referrerpolicy')) {
                            fixed = fixed.replace('<iframe', '<iframe referrerpolicy="strict-origin-when-cross-origin"');
                        }
                        return fixed;
                    }
                    let videoId = '';
                    let listId = '';
                    let embedUrl = '';
                    if (trimmed.includes('list=')) {
                        const urlParams = new URLSearchParams(trimmed.includes('?') ? trimmed.split('?')[1] : trimmed);
                        listId = urlParams.get('list');
                    }
                    if (trimmed.includes('youtu.be/')) {
                        videoId = trimmed.split('youtu.be/')[1]?.split('?')[0];
                    } else if (trimmed.includes('watch?v=')) {
                        videoId = trimmed.split('watch?v=')[1]?.split('&')[0];
                    } else if (trimmed.includes('embed/')) {
                        videoId = trimmed.split('embed/')[1]?.split('?')[0];
                    } else {
                        videoId = trimmed;
                    }
                    if (listId) {
                        embedUrl = `https://www.youtube.com/embed/videoseries?list=${listId}`;
                    } else if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                    } else {
                        embedUrl = 'https://www.youtube.com/embed/dQw4w9WgXcQ';
                    }
                    return `<iframe class="w-full h-full border-0" src="${embedUrl}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
                },

                pushYoutubeUpdate() {
                    this.saveData();
                    this.showNotificationModal = true;
                    this.notificationTitle = '推播成功！';
                    this.notificationText = '士氣補給站的 YouTube 影片與激勵字句已成功更新！';
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        this.showNotificationModal = true;
                        this.notificationTitle = '登入成功';
                        this.notificationText = `歡迎回來，${found.name}！`;
                    } else {
                        alert('帳號或密碼錯誤！請先註冊或確認輸入正確。');
                    }
                },

                register() {
                    if (this.partners.some(p => p.email === this.regForm.email)) {
                        alert('此 Email 已經註冊過！');
                        return;
                    }
                    const newP = {
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group || 'OO組',
                        avatar: this.regForm.avatar || '🐼',
                        fyc: 0,
                        points: 0,
                        totalPoints: 0,
                        diceCount: 0,
                        position: 0,
                        pushEnabled: true
                    };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    this.saveData();
                    this.authTab = 'login';
                    alert('註冊成功！資料已儲存並同步至指揮中心。');
                },

                findPassword() {
                    if (!this.forgotForm.name || !this.forgotForm.email) {
                        this.forgotResult = '請完整輸入註冊姓名與電子信箱！';
                        return;
                    }
                    const found = this.partners.find(p => p.name === this.forgotForm.name && p.email === this.forgotForm.email);
                    if (found) {
                        this.forgotResult = `您的密碼為：${found.password}`;
                    } else {
                        this.forgotResult = '找不到符合該姓名與 Email 的註冊資料！';
                    }
                },

                logout() {
                    this.currentUser = null;
                },

                get isFYCTag() {
                    const t = this.settings.tags.find(x => x.name === this.declForm.tag);
                    return t ? t.isFYC : false;
                },

                getSelectedTagPoints() {
                    const t = this.settings.tags.find(x => x.name === this.declForm.tag);
                    return t ? t.points : 0;
                },

                onTagChange() {},

                submitDeclaration() {
                    let pts = 0;
                    if (this.isFYCTag) {
                        pts = Math.ceil((this.declForm.fycAmount || 0) / 1000);
                    } else {
                        pts = this.getSelectedTagPoints();
                    }

                    this.declarations.unshift({
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: this.declForm.desc,
                        fyc: this.isFYCTag ? this.declForm.fycAmount : 0,
                        points: pts,
                        dice: Math.floor(pts / 10) || 1,
                        time: this.taipeiTime
                    });

                    this.declForm.fycAmount = 0;
                    this.declForm.desc = '';
                    this.saveData();
                    alert('申報已送出，等待指揮中心審核！');
                },

                approveDecl(idx) {
                    const req = this.declarations[idx];
                    const targetUser = this.partners.find(p => p.email === req.userEmail || p.name === req.userName);
                    if (targetUser) {
                        targetUser.points += req.points;
                        targetUser.totalPoints += req.points;
                        targetUser.diceCount += req.dice;
                        if (req.tag === 'FYC') {
                            targetUser.fyc = (targetUser.fyc || 0) + (req.fyc || 0);
                        }
                    }
                    this.declarations.splice(idx, 1);
                    this.saveData();
                    alert('審核已通過，點數與骰子已發放！');
                },

                rejectDecl(idx) {
                    this.declarations.splice(idx, 1);
                    this.saveData();
                    alert('已拒絕該筆申報。');
                },

                rollDice() {
                    if (this.currentUser.points < 10) return;
                    this.currentUser.points -= 10;
                    this.isRolling = true;
                    this.showDiceModal = true;

                    let count = 0;
                    const timer = setInterval(() => {
                        this.rollingDiceNumber = Math.floor(Math.random() * 6) + 1;
                        count++;
                        if (count > 10) {
                            clearInterval(timer);
                            const finalStep = this.rollingDiceNumber;
                            this.isRolling = false;
                            this.showDiceModal = false;

                            this.currentUser.position = (this.currentUser.position + finalStep) % 30;
                            this.currentLandedCell = this.settings.boardCells[this.currentUser.position];
                            this.showLandingModal = true;

                            this.rewardsList.unshift({
                                userName: this.currentUser.name,
                                reward: this.currentLandedCell.title + ' - ' + this.currentLandedCell.reward,
                                time: this.taipeiTime,
                                status: '未發放'
                            });
                            this.saveData();
                        }
                    }, 100);
                },

                closeLandingModal() {
                    this.showLandingModal = false;
                },

                hasPlayerHere(index) {
                    return this.partners.some(p => p.position === index);
                },

                getPlayersOnCell(index) {
                    return this.partners.filter(p => p.position === index);
                },

                openCellModal(cell, index) {
                    this.selectedCell = cell;
                    this.selectedCellIndex = index;
                    this.showCellDetailModal = true;
                },

                postMessage() {
                    this.messages.unshift({
                        title: this.msgForm.title,
                        content: this.msgForm.content,
                        isAnonymous: this.msgForm.isAnonymous,
                        author: this.currentUser.name,
                        time: this.taipeiTime,
                        likes: 0,
                        replies: []
                    });
                    this.msgForm.title = '';
                    this.msgForm.content = '';
                    this.saveData();
                },

                likeMessage(mIdx) {
                    this.messages[mIdx].likes = (this.messages[mIdx].likes || 0) + 1;
                    this.saveData();
                },

                postReply(mIdx) {
                    const text = this.replyTexts[mIdx];
                    if (!text) return;
                    if (!this.messages[mIdx].replies) this.messages[mIdx].replies = [];
                    this.messages[mIdx].replies.push({
                        author: this.currentUser.name,
                        content: text,
                        time: this.taipeiTime
                    });
                    this.replyTexts[mIdx] = '';
                    this.saveData();
                },

                initProfileForm() {
                    this.profileForm.name = this.currentUser.name;
                    this.profileForm.rank = this.currentUser.rank;
                    this.profileForm.email = this.currentUser.email;
                    this.profileForm.avatar = this.currentUser.avatar;
                    this.profileForm.newPassword = '';
                },

                saveProfileChanges() {
                    this.currentUser.name = this.profileForm.name;
                    this.currentUser.rank = this.profileForm.rank;
                    this.currentUser.email = this.profileForm.email;
                    this.currentUser.avatar = this.profileForm.avatar;
                    if (this.profileForm.newPassword) {
                        this.currentUser.password = this.profileForm.newPassword;
                    }
                    this.showProfileEdit = false;
                    this.saveData();
                    alert('個人資訊更新成功！');
                },

                verifyAdmin() {
                    if (this.adminPassInput === 'admin' || this.adminPassInput === this.newAdminPassword) {
                        this.adminAuth = true;
                    } else {
                        alert('管理密碼錯誤！預設為 admin');
                    }
                },

                addTag() {
                    if (!this.newTagForm.name) return;
                    this.settings.tags.push({ ...this.newTagForm });
                    this.newTagForm.name = '';
                    this.newTagForm.points = 10;
                    this.saveData();
                },

                removeTag(idx) {
                    this.settings.tags.splice(idx, 1);
                    this.saveData();
                },

                saveSettings(msg = '系統設定已成功更新！') {
                    this.saveData();
                    this.showNotificationModal = true;
                    this.notificationTitle = '儲存成功';
                    this.notificationText = msg;
                },

                fetchCloudData() {
                    this.loadData();
                    alert('已重新載入本機最新同步資料！');
                },

                editPartner(p) {
                    const newPts = prompt(`修改 ${p.name} 的可用點數：`, p.points);
                    if (newPts !== null) {
                        p.points = Number(newPts) || 0;
                        this.saveData();
                    }
                },

                promptDeletePartner(idx) {
                    if (confirm('確定要刪除此夥伴嗎？')) {
                        this.partners.splice(idx, 1);
                        this.saveData();
                    }
                },

                toggleRewardStatus(rwIdx) {
                    const rw = this.rewardsList[rwIdx];
                    rw.status = rw.status === '已發放' ? '未發放' : '已發放';
                    this.saveData();
                },

                exportRewards() { alert('獎勵清單 CSV 匯出成功！'); },

                loadCurrentCode() { this.systemRawCode = document.documentElement.outerHTML; },

                saveRawCode() {
                    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'competition_tycoon_fixed.html';
                    a.click();
                },

                resetAllPositions() {
                    if (confirm('確定要將所有人位置歸零嗎？')) {
                        this.partners.forEach(p => p.position = 0);
                        this.saveData();
                        alert('已全部返回起點！');
                    }
                },

                resetAllPoints() {
                    if (confirm('確定要將所有人點數歸零嗎？')) {
                        this.partners.forEach(p => p.points = 0);
                        this.saveData();
                        alert('點數已全部歸零！');
                    }
                },

                resetAllDice() {
                    if (confirm('確定要將所有人骰子數歸零嗎？')) {
                        this.partners.forEach(p => p.diceCount = 0);
                        this.saveData();
                        alert('骰子數已全部歸零！');
                    }
                },

                factoryResetSystem() {
                    if (confirm('警告：此操作將清除所有本機儲存資料並重置！')) {
                        localStorage.removeItem('competition_tycoon_data');
                        location.reload();
                    }
                },

                updateAdminPassword() {
                    if (!this.newAdminPassword) return;
                    alert('管理者密碼變更成功！');
                },

                downloadBackup() {
                    const appData = {
                        partners: this.partners,
                        declarations: this.declarations,
                        messages: this.messages,
                        rewardsList: this.rewardsList,
                        settings: this.settings
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
                    const a = document.createElement('a');
                    a.href = dataStr;
                    a.download = "tycoon_sync_backup.json";
                    a.click();
                },

                importBackup(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.partners) this.partners = data.partners;
                            if (data.declarations) this.declarations = data.declarations;
                            if (data.messages) this.messages = data.messages;
                            if (data.rewardsList) this.rewardsList = data.rewardsList;
                            if (data.settings) this.settings = { ...this.settings, ...data.settings };
                            this.saveData();
                            alert('備份資料匯入與跨裝置同步成功！');
                            location.reload();
                        } catch (err) {
                            alert('匯入失敗：檔案格式錯誤！');
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
</body></html>
