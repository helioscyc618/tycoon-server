<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 - 2026/12/14 ~ 2027/06/02 業務成長雙軌競賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf8f5;
            color: #2b2b2b;
        }
        .ming-font {
            font-family: 'Noto Serif TC', serif;
        }
        .bg-royal-gradient {
            background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: #D4AF37;
        }
        .gold-bg {
            background-color: #D4AF37;
        }
        .gold-hover:hover {
            background-color: #C5A028;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }
        /* Marquee animation */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
        /* 3D Dice styling */
        .dice-scene {
            width: 100px;
            height: 100px;
            perspective: 600px;
        }
        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dice-face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #b91c1c;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }
        .dice-face-1 { transform: rotateY(0deg) translateZ(50px); }
        .dice-face-2 { transform: rotateY(90deg) translateZ(50px); }
        .dice-face-3 { transform: rotateY(180deg) translateZ(50px); }
        .dice-face-4 { transform: rotateY(-90deg) translateZ(50px); }
        .dice-face-5 { transform: rotateX(90deg) translateZ(50px); }
        .dice-face-6 { transform: rotateX(-90deg) translateZ(50px); }
    </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-red-200 selection:text-red-900" x-data="competitionApp()">

    <!-- Network status & time top bar -->
    <header class="bg-royal-gradient text-white text-xs py-1.5 px-4 flex flex-wrap justify-between items-center shadow-md z-50 border-b border-amber-500/30">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 font-medium">
                <span class="w-2.5 h-2.5 rounded-full inline-block" :class="isOnline ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500 animate-ping'"></span>
                <span x-text="isOnline ? '連線正常 (Online)' : '網路斷線警告 (Offline Mode)'"></span>
            </span>
            <span class="text-amber-300 hidden sm:inline">|</span>
            <span class="hidden sm:inline text-amber-200">競賽期間：2026/12/14 ~ 2027/06/02</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="font-mono bg-black/30 px-2 py-0.5 rounded text-amber-300 border border-amber-500/20" x-text="'網路時間: ' + networkTime"></span>
            <template x-if="currentUser">
                <button @click="logout()" class="text-xs bg-red-800 hover:bg-red-700 text-amber-200 px-2.5 py-0.5 rounded border border-amber-500/40 transition">登出</button>
            </template>
        </div>
    </header>

    <!-- Marquee Banner (戰報) -->
    <div class="bg-amber-50 text-red-900 border-b border-amber-200 py-2 px-4 overflow-hidden shadow-inner flex items-center relative z-40">
        <div class="flex items-center space-x-2 bg-red-700 text-amber-200 text-xs font-bold px-3 py-1 rounded shadow shrink-0 z-10 ming-font">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
            <span>戰報廣播</span>
        </div>
        <div class="overflow-hidden whitespace-nowrap ml-4 flex-1">
            <div class="animate-marquee text-sm font-medium text-red-900" x-text="marqueeText"></div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto">

        <!-- VIEW 1: Auth / Guest Landing (Login, Register, Forgot Password) -->
        <template x-if="!currentUser">
            <div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
                <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-amber-200/60 p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-700 border-2 gold-border shadow-md mb-1">
                            <!-- Dice Icon -->
                            <svg class="w-8 h-8 text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                        </div>
                        <h1 class="text-3xl font-black ming-font gold-gradient-text tracking-wider">競賽大亨</h1>
                        <p class="text-xs text-stone-500 font-medium">Competition Tycoon · 保險業務團隊雙軌爭霸</p>
                    </div>

                    <!-- Auth Mode Tabs -->
                    <div class="flex rounded-xl bg-stone-100 p-1 border border-stone-200 text-sm font-medium">
                        <button @click="authMode = 'login'" :class="authMode === 'login' ? 'bg-red-700 text-amber-200 shadow' : 'text-stone-600 hover:text-stone-900'" class="flex-1 py-2 rounded-lg transition">登入</button>
                        <button @click="authMode = 'register'" :class="authMode === 'register' ? 'bg-red-700 text-amber-200 shadow' : 'text-stone-600 hover:text-stone-900'" class="flex-1 py-2 rounded-lg transition">註冊新帳號</button>
                        <button @click="authMode = 'forgot'" :class="authMode === 'forgot' ? 'bg-red-700 text-amber-200 shadow' : 'text-stone-600 hover:text-stone-900'" class="flex-1 py-2 rounded-lg transition">忘記密碼</button>
                    </div>

                    <!-- LOGIN FORM -->
                    <template x-if="authMode === 'login'">
                        <form @submit.prevent="handleLogin" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">帳號 (姓名 或 管理員)</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-red-600 focus:border-red-600 text-sm outline-none transition" placeholder="請輸入姓名或 admin">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 focus:ring-2 focus:ring-red-600 focus:border-red-600 text-sm outline-none transition" placeholder="請輸入密碼">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="w-full py-3 bg-royal-gradient text-amber-200 font-bold rounded-xl shadow-lg gold-hover transition flex items-center justify-center space-x-2">
                                    <span>進入競賽戰情室 / 指揮中心</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                </button>
                            </div>
                            <p class="text-xs text-center text-stone-400 mt-2">提示：管理員預設帳號為 admin / 密碼 admin</p>
                        </form>
                    </template>

                    <!-- REGISTER FORM -->
                    <template x-if="authMode === 'register'">
                        <form @submit.prevent="handleRegister" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="請輸入您的真實姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="name@example.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">設定密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="設定登入密碼">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">職級</label>
                                <select x-model="regForm.rank" class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600 bg-white">
                                    <option value="業務專員">業務專員</option>
                                    <option value="業務主任">業務主任</option>
                                    <option value="業務襄理">業務襄理</option>
                                    <option value="業務經理">業務經理</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">隸屬組別</label>
                                <input type="text" x-model="regForm.group" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="例如：金牌第一組 / 威龍團隊">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="w-full py-3 bg-royal-gradient text-amber-200 font-bold rounded-xl shadow-lg gold-hover transition">
                                    立即註冊並進入戰情室 (起始數為0)
                                </button>
                            </div>
                        </form>
                    </template>

                    <!-- FORGOT PASSWORD FORM -->
                    <template x-if="authMode === 'forgot'">
                        <form @submit.prevent="handleForgot" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">註冊姓名</label>
                                <input type="text" x-model="forgotForm.name" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="輸入註冊時的姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-700 uppercase tracking-wide mb-1">註冊電子信箱</label>
                                <input type="email" x-model="forgotForm.email" required class="w-full px-3 py-2 rounded-lg border border-stone-300 text-sm outline-none focus:ring-2 focus:ring-red-600" placeholder="輸入註冊時的電子信箱">
                            </div>
                            <div>
                                <button type="submit" class="w-full py-2.5 bg-red-700 text-white font-bold rounded-lg shadow hover:bg-red-800 transition text-sm">
                                    查詢密碼
                                </button>
                            </div>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-amber-50 border border-amber-300 rounded-lg text-center text-sm">
                                    <p class="text-stone-600 text-xs">查詢結果：</p>
                                    <p class="font-bold text-red-700 text-base mt-1" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </form>
                    </template>
                </div>
            </div>
        </template>

        <!-- VIEW 2: Admin Command Center (指揮中心) -->
        <template x-if="currentUser && currentUser.isAdmin">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <!-- Admin Header Card -->
                <div class="bg-royal-gradient text-white rounded-2xl shadow-xl p-6 flex flex-col md:flex-row justify-between items-center border border-amber-400/40 gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 bg-amber-400/20 rounded-xl border border-amber-400">
                            <svg class="w-8 h-8 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <div>
                            <h2 class="text-2xl font-black ming-font gold-gradient-text">指揮中心管理後台</h2>
                            <p class="text-xs text-amber-200/80">歡迎回來，管理員 <span x-text="currentUser.name"></span> | 掌握全團隊雙軌競賽脈動</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button @click="currentUser = null" class="px-4 py-2 bg-red-800 hover:bg-red-700 text-amber-200 rounded-xl text-xs font-bold border border-amber-500/40 transition shadow">
                            切換至夥伴戰情室預覽
                        </button>
                    </div>
                </div>

                <!-- Admin Navigation Tabs -->
                <div class="flex flex-wrap gap-2 border-b border-stone-200 pb-2">
                    <button @click="adminTab = 'audit'" :class="adminTab === 'audit' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        點數審核 (<span x-text="pendingAudits.length"></span>)
                    </button>
                    <button @click="adminTab = 'partners'" :class="adminTab === 'partners' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        夥伴管理 (<span x-text="partners.length"></span>)
                    </button>
                    <button @click="adminTab = 'gameSettings'" :class="adminTab === 'gameSettings' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        遊戲與Tag設定
                    </button>
                    <button @click="adminTab = 'rewards'" :class="adminTab === 'rewards' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        使用者獎勵統整
                    </button>
                    <button @click="adminTab = 'security'" :class="adminTab === 'security' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        密碼更改
                    </button>
                    <button @click="adminTab = 'update'" :class="adminTab === 'update' ? 'bg-red-700 text-amber-200 shadow' : 'bg-white text-stone-700 hover:bg-stone-100'" class="px-4 py-2 rounded-xl text-sm font-bold border border-stone-200 transition">
                        版本熱更新與Sandbox
                    </button>
                </div>

                <!-- TAB 1: 點數審核 -->
                <template x-if="adminTab === 'audit'">
                    <div class="bg-white rounded-2xl shadow-md border border-stone-200 p-6 space-y-4">
                        <h3 class="text-lg font-bold ming-font text-red-900 border-b pb-2">待審核申報案件列表</h3>
                        <template x-if="pendingAudits.length === 0">
                            <p class="text-stone-400 text-sm py-8 text-center">目前沒有等待審核的申報案件。</p>
                        </template>
                        <div class="space-y-3">
                            <template x-for="(audit, idx) in pendingAudits" :key="audit.id">
                                <div class="bg-stone-50 border border-stone-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="px-2.5 py-0.5 bg-red-100 text-red-800 rounded text-xs font-bold" x-text="audit.tag"></span>
                                            <span class="font-bold text-stone-800" x-text="audit.userName"></span>
                                            <span class="text-xs text-stone-400" x-text="'(' + audit.groupName + ')'"></span>
                                        </div>
                                        <p class="text-sm text-stone-600 font-medium" x-text="audit.detail"></p>
                                        <p class="text-xs text-stone-400" x-text="'申報時間: ' + audit.time"></p>
                                    </div>
                                    <div class="flex items-center space-x-3 shrink-0">
                                        <div class="text-right">
                                            <span class="text-xs text-stone-500">預計獲得：</span>
                                            <span class="font-bold text-red-700 text-base" x-text="'+' + audit.earnedPoints + ' 點 / +' + audit.earnedDice + ' 骰'"></span>
                                        </div>
                                        <button @click="approveAudit(audit.id)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow flex items-center space-x-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                            <span>通過並發放</span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- TAB 2: 夥伴管理 -->
                <template x-if="adminTab === 'partners'">
                    <div class="bg-white rounded-2xl shadow-md border border-stone-200 p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="text-lg font-bold ming-font text-red-900">團隊夥伴總覽與管理</h3>
                            <span class="text-xs text-stone-500">提示：系統已自動依相同組別名稱整併業績。</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-stone-100 text-stone-700 uppercase text-xs">
                                    <tr>
                                        <th class="p-3 rounded-l-lg">姓名/職級</th>
                                        <th class="p-3">組別</th>
                                        <th class="p-3">本身FYC</th>
                                        <th class="p-3">總FYC(含Buff)</th>
                                        <th class="p-3">可用點數 / 骰子</th>
                                        <th class="p-3">業績Buff (下線)</th>
                                        <th class="p-3 text-center rounded-r-lg">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-stone-100">
                                    <template x-for="p in partners" :key="p.id">
                                        <tr class="hover:bg-stone-50">
                                            <td class="p-3">
                                                <div class="font-bold text-stone-800" x-text="p.name"></div>
                                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium" x-text="p.rank"></span>
                                            </td>
                                            <td class="p-3 font-medium text-stone-600" x-text="p.group"></td>
                                            <td class="p-3 font-mono" x-text="p.fyc.toLocaleString()"></td>
                                            <td class="p-3 font-mono font-bold text-red-700" x-text="calculateTotalFYC(p).toLocaleString()"></td>
                                            <td class="p-3 font-mono">
                                                <span class="text-emerald-700 font-bold" x-text="p.points + ' 點'"></span> /
                                                <span class="text-amber-700 font-bold" x-text="p.dice + ' 骰'"></span>
                                            </td>
                                            <td class="p-3">
                                                <span class="text-xs bg-stone-100 text-stone-700 px-2 py-1 rounded" x-text="p.buffs && p.buffs.length > 0 ? p.buffs.join(', ') : '無下線Buff'"></span>
                                            </td>
                                            <td class="p-3 text-center space-x-2">
                                                <button @click="openEditPartner(p)" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold transition shadow">編輯</button>
                                                <button @click="deletePartner(p.id)" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition shadow">刪除</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- TAB 3: 遊戲與Tag設定 -->
                <template x-if="adminTab === 'gameSettings'">
                    <div class="space-y-6">
                        <!-- Tag Settings -->

    <!-- Alpine.js Application Logic -->
    <script>
        function competitionApp() {
            return {
                isOnline: navigator.onLine,
                networkTime: '',
                currentUser: null,
                authMode: 'login',
                adminTab: 'audit',
                showAnnouncementModal: true,
                activeTileModal: null,
                earnedRewardModal: null,
                editingPartner: null,
                toastMessage: '',
                isRolling: false,
                diceTransform: 'rotateX(0deg) rotateY(0deg)',

                // Forms
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: '金牌第一組' },
                forgotForm: { name: '', email: '' },
                forgotResult: '',
                submitForm: { tagIndex: 0, amount: '', detail: '' },
                shoutForm: { title: '', content: '', isAnonymous: false },
                pwdForm: { old: '', new: '' },
                sandboxCode: '// 這裡可輸入版本熱更新測試代碼',
                sandboxPreviewHtml: '等待預覽...',

                // Persistent App State
                adminPassword: 'admin',
                marqueeText: '🔥 歡迎參加競賽大亨半年期雙軌競賽！ 🏆 累積FYC突破百萬即刻解鎖神祕大獎！ 📢 記得每日上線擲骰子踩格子！',
                announcement: {
                    title: '競賽大亨 2026/12/14 ~ 2027/06/02 正式啟動',
                    content: '各位優秀的夥伴大家好！本次半年期競賽結合保險業務開發與下線增員雙軌制。透過日常申報業績、邀約、面談與考試獲取點數，並運用點數擲骰子在大富翁棋盤中贏取大獎！請全力以赴，共創顛峰！'
                },
                availableTags: [
                    { name: 'FYC 業績申報', isFYC: true, points: 0 },
                    { name: '活動邀約', isFYC: false, points: 5 },
                    { name: '增員面談', isFYC: false, points: 10 },
                    { name: '新夥伴公司考', isFYC: false, points: 15 },
                    { name: '新夥伴外部考', isFYC: false, points: 15 },
                    { name: '新夥伴報聘', isFYC: false, points: 30 }
                ],
                boardTiles: Array.from({ length: 30 }, (_, i) => ({
                    name: i === 0 ? '起點：榮耀起航' : (i === 14 ? '幸運轉折點' : (i === 29 ? '終極大亨站' : '業務衝刺格 ' + (i + 1))),
                    icon: i === 0 ? '🏁' : (i === 14 ? '⭐' : (i === 29 ? '👑' : '💼')),
                    reward: i === 0 ? '獲得 20 點 + 2 骰子' : (i === 14 ? '額外獲得 50 點獎勵' : (i === 29 ? '解鎖特級榮譽獎盃與實體大獎' : '獲得 ' + ((i % 5) + 5) * 2 + ' 點數與動能 Buff'))
                })),
                partners: [
                    { id: '1', name: '王大亨', email: 'king@example.com', password: '123', rank: '業務經理', group: '王者金牌組', fyc: 150000, points: 120, dice: 15, boardPosition: 5, buffs: ['陳小美', '林業務'] },
                    { id: '2', name: '陳小美', email: 'mei@example.com', password: '123', rank: '業務襄理', group: '王者金牌組', fyc: 80000, points: 60, dice: 8, boardPosition: 2, buffs: [] },
                    { id: '3', name: '林業務', email: 'lin@example.com', password: '123', rank: '業務主任', group: '王者金牌組', fyc: 45000, points: 40, dice: 5, boardPosition: 12, buffs: [] },
                    { id: '4', name: '張專員', email: 'zhang@example.com', password: '123', rank: '業務專員', group: '菁英飆速組', fyc: 30000, points: 25, dice: 4, boardPosition: 0, buffs: [] }
                ],
                pendingAudits: [
                    { id: 'a1', userId: '2', userName: '陳小美', groupName: '王者金牌組', tag: '增員面談', detail: '完成與準增員對象面談', earnedPoints: 10, earnedDice: 1, time: '2026-10-20 10:30' }
                ],
                rewardLogs: [
                    { id: 'r1', userId: '1', userName: '王大亨', groupName: '王者金牌組', rewardName: '第 6 格獎勵：獲得 20 點', time: '2026-10-19 14:20', status: '已發放' }
                ],
                shoutMessages: [
                    { id: 's1', author: '王大亨', title: '衝刺百萬FYC！', content: '大家一起加油，半年期大亨非我們莫屬！', isAnonymous: false, time: '11:00', likes: 5 }
                ],

                init() {
                    // Load state from localStorage if available
                    const saved = localStorage.getItem('competition_tycoon_data');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.partners = data.partners || this.partners;
                            this.pendingAudits = data.pendingAudits || this.pendingAudits;
                            this.rewardLogs = data.rewardLogs || this.rewardLogs;
                            this.boardTiles = data.boardTiles || this.boardTiles;
                            this.availableTags = data.availableTags || this.availableTags;
                            this.marqueeText = data.marqueeText || this.marqueeText;
                            this.announcement = data.announcement || this.announcement;
                            this.shoutMessages = data.shoutMessages || this.shoutMessages;
                            this.adminPassword = data.adminPassword || this.adminPassword;
                        } catch (e) { console.error(e); }
                    }

                    // Network listeners & time sync
                    window.addEventListener('online', () => { this.isOnline = true; this.showToast('網路已恢復連線'); });
                    window.addEventListener('offline', () => { this.isOnline = false; this.showToast('⚠️ 警告：網路已斷線！'); });
                    
                    setInterval(() => {
                        const now = new Date();
                        this.networkTime = now.toLocaleString('zh-TW', { hour12: false });
                    }, 1000);
                },

                saveState() {
                    const data = {
                        partners: this.partners,
                        pendingAudits: this.pendingAudits,
                        rewardLogs: this.rewardLogs,
                        boardTiles: this.boardTiles,
                        availableTags: this.availableTags,
                        marqueeText: this.marqueeText,
                        announcement: this.announcement,
                        shoutMessages: this.shoutMessages,
                        adminPassword: this.adminPassword
                    };
                    localStorage.setItem('competition_tycoon_data', JSON.stringify(data));
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    setTimeout(() => { if (this.toastMessage === msg) this.toastMessage = ''; }, 3500);
                },

                handleLogin() {
                    if (this.loginForm.account === 'admin' && this.loginForm.password === this.adminPassword) {
                        this.currentUser = { name: '管理員', isAdmin: true };
                        this.showToast('成功登入指揮中心後台');
                        return;
                    }
                    const found = this.partners.find(p => p.name === this.loginForm.account && p.password === this.loginForm.password);
                    if (found) {
                        this.currentUser = found;
                        this.showToast('歡迎回來，' + found.name + '！');
                    } else {
                        this.showToast('登入失敗：帳號或密碼錯誤');
                    }
                },

                handleRegister() {
                    if (!this.regForm.name || !this.regForm.email || !this.regForm.password) {
                        this.showToast('請完整填寫註冊資料');
                        return;
                    }
                    if (this.partners.some(p => p.name === this.regForm.name)) {
                        this.showToast('註冊失敗：此姓名已存在');
                        return;
                    }
                    const newP = {
                        id: Date.now().toString(),
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group,
                        fyc: 0,
                        points: 0,
                        dice: 0,
                        boardPosition: 0,
                        buffs: []
                    };
                    this.partners.push(newP);
                    this.saveState();
                    this.currentUser = newP;
                    this.showToast('註冊成功！起始數均為0，已自動登入');
                },

                handleForgot() {
                    const found = this.partners.find(p => p.name === this.forgotForm.name && p.email === this.forgotForm.email);
                    if (found) {
                        this.forgotResult = '您的密碼為：' + found.password;
                    } else {
                        this.forgotResult = '找不到符合該姓名與信箱之註冊資料';
                    }
                },

                logout() {
                    this.currentUser = null;
                    this.showToast('已安全登出');
                },

                get isCurrentTagFYC() {
                    return this.availableTags[this.submitForm.tagIndex] && this.availableTags[this.submitForm.tagIndex].isFYC;
                },

                onTagChange() {
                    this.submitForm.amount = '';
                    this.submitForm.detail = '';
                },

                submitScore() {
                    const tag = this.availableTags[this.submitForm.tagIndex];
                    let earnedPoints = 0;
                    let earnedDice = 1;
                    let detailText = '';

                    if (tag.isFYC) {
                        const amt = Number(this.submitForm.amount) || 0;
                        earnedPoints = Math.floor(amt / 1000);
                        detailText = `FYC 金額: $${amt.toLocaleString()} (換算 ${earnedPoints} 點)`;
                    } else {
                        earnedPoints = tag.points;
                        detailText = this.submitForm.detail || tag.name;
                    }

                    const auditItem = {
                        id: 'au_' + Date.now(),
                        userId: this.currentUser.id,
                        userName: this.currentUser.name,
                        groupName: this.currentUser.group,
                        tag: tag.name,
                        detail: detailText,
                        earnedPoints: earnedPoints,
                        earnedDice: earnedDice,
                        time: new Date().toLocaleString('zh-TW', { hour12: false })
                    };

                    this.pendingAudits.push(auditItem);
                    this.saveState();
                    this.showToast('申報已送出，等待指揮中心審核！');
                    this.submitForm.amount = '';
                    this.submitForm.detail = '';
                },

                approveAudit(auditId) {
                    const idx = this.pendingAudits.findIndex(a => a.id === auditId);
                    if (idx === -1) return;
                    const audit = this.pendingAudits[idx];
                    
                    const p = this.partners.find(x => x.id === audit.userId);
                    if (p) {
                        p.points += audit.earnedPoints;
                        p.dice += audit.earnedDice;
                        if (audit.tag.includes('FYC') && audit.detail.includes('FYC 金額:')) {
                            // Extract amount from detail string if needed or keep separate
                        }
                    }

                    this.pendingAudits.splice(idx, 1);
                    this.saveState();

                    // Trigger Confetti effect
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    this.showToast('審核通過！已發放點數與骰子給 ' + audit.userName);
                },

                calculateTotalFYC(p) {
                    let total = p.fyc || 0;
                    if (p.buffs && p.buffs.length > 0) {
                        p.buffs.forEach(buffName => {
                            const sub = this.partners.find(x => x.name === buffName);
                            if (sub) {
                                total += (sub.fyc || 0);
                            }
                        });
                    }
                    return total;
                },

                getGroupTeammates(groupName) {
                    return this.partners.filter(p => p.group === groupName);
                },

                openEditPartner(p) {
                    this.editingPartner = JSON.parse(JSON.stringify(p));
                    if (!this.editingPartner.buffs) this.editingPartner.buffs = [];
                },

                savePartnerEdit() {
                    const idx = this.partners.findIndex(x => x.id === this.editingPartner.id);
                    if (idx !== -1) {
                        this.partners[idx] = this.editingPartner;
                        this.saveState();
                        this.showToast('夥伴資料更新成功');
                        this.editingPartner = null;
                    }
                },

                deletePartner(id) {
                    if (confirm('確定要刪除此位夥伴嗎？刪除後無法復原。')) {
                        this.partners = this.partners.filter(x => x.id !== id);
                        this.saveState();
                        this.showToast('夥伴已刪除');
                    }
                },

                addNewTag() {
                    this.availableTags.push({ name: '新任務 Tag', isFYC: false, points: 10 });
                    this.saveState();
                },

                removeTag(index) {
                    this.availableTags.splice(index, 1);
                    this.saveState();
                },

                saveGameSettings() {
                    this.saveState();
                    this.showToast('遊戲與公告設定已儲存');
                },

                saveBoardTiles() {
                    this.saveState();
                    this.showToast('30格地圖已成功更新');
                },

                toggleRewardStatus(rid) {
                    const r = this.rewardLogs.find(x => x.id === rid);
                    if (r) {
                        r.status = r.status === '已發放' ? '待發放' : '已發放';
                        this.saveState();
                    }
                },

                exportRewardData() {
                    let csv = '姓名,組別,獎勵項目,時間,狀態\n';
                    this.rewardLogs.forEach(r => {
                        csv += `"${r.userName}","${r.groupName}","${r.rewardName}","${r.time}","${r.status || '待發放'}"\n`;
                    });
                    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'competition_tycoon_rewards.csv';
                    a.click();
                    this.showToast('獎勵清單已匯出 CSV');
                },

                updateAdminPassword() {
                    if (this.pwdForm.old !== this.adminPassword) {
                        this.showToast('目前管理員密碼錯誤');
                        return;
                    }
                    this.adminPassword = this.pwdForm.new;
                    this.saveState();
                    this.pwdForm.old = '';
                    this.pwdForm.new = '';
                    this.showToast('管理員密碼變更成功');
                },

                previewSandbox() {
                    this.sandboxPreviewHtml = `<div class="p-3 text-emerald-700 font-bold bg-emerald-50 rounded border border-emerald-200">Sandbox 預覽正常：<br><span class="text-xs text-stone-600 font-normal">${this.sandboxCode}</span></div>`;
                    this.showToast('Sandbox 預覽已更新');
                },

                publishUpdate() {
                    this.saveState();
                    this.showToast('🚀 軟體版本熱更新已同步至所有使用者端！');
                },

                postShout() {
                    const msg = {
                        id: 'sh_' + Date.now(),
                        author: this.currentUser.name,
                        title: this.shoutForm.title,
                        content: this.shoutForm.content,
                        isAnonymous: this.shoutForm.isAnonymous,
                        time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                        likes: 0
                    };
                    this.shoutMessages.unshift(msg);
                    this.saveState();
                    this.shoutForm.title = '';
                    this.shoutForm.content = '';
                    this.showToast('📢 嗆蝦留言已發布，全體夥伴已收到通知！');
                },

                likeShout(mid) {
                    const m = this.shoutMessages.find(x => x.id === mid);
                    if (m) {
                        m.likes++;
                        this.saveState();
                    }
                },

                openTileModal(tile, idx) {
                    this.activeTileModal = { ...tile, index: idx };
                },

                rollDice() {
                    if (this.currentUser.points < 10 || this.isRolling) return;
                    this.currentUser.points -= 10;
                    this.isRolling = true;

                    // Vibration feedback if supported
                    if (navigator.vibrate) {
                        navigator.vibrate([100, 50, 100]);
                    }

                    // Random 3D dice roll animation angles
                    const randomRoll = Math.floor(Math.random() * 6) + 1;
                    const rotations = {
                        1: 'rotateX(0deg) rotateY(0deg)',
                        2: 'rotateX(0deg) rotateY(-90deg)',
                        3: 'rotateX(0deg) rotateY(-180deg)',
                        4: 'rotateX(0deg) rotateY(90deg)',
                        5: 'rotateX(-90deg) rotateY(0deg)',
                        6: 'rotateX(90deg) rotateY(0deg)'
                    };
                    this.diceTransform = rotations[randomRoll];

                    setTimeout(() => {
                        this.isRolling = false;
                        const currentPos = this.currentUser.boardPosition || 0;
                        const newPos = (currentPos + randomRoll) % 30;
                        this.currentUser.boardPosition = newPos;

                        // Update in partners list
                        const pIdx = this.partners.findIndex(x => x.id === this.currentUser.id);
                        if (pIdx !== -1) {
                            this.partners[pIdx].points = this.currentUser.points;
                            this.partners[pIdx].boardPosition = newPos;
                        }

                        const landedTile = this.boardTiles[newPos];
                        this.earnedRewardModal = {
                            text: `您擲出了 ${randomRoll} 點！前進至第 ${newPos + 1} 格「${landedTile.name}」。獎勵：${landedTile.reward}`
                        };

                        // Push to reward logs
                        this.rewardLogs.unshift({
                            id: 'rw_' + Date.now(),
                            userId: this.currentUser.id,
                            userName: this.currentUser.name,
                            groupName: this.currentUser.group,
                            rewardName: `第 ${newPos + 1} 格(${landedTile.name})：${landedTile.reward}`,
                            time: new Date().toLocaleString('zh-TW', { hour12: false }),
                            status: '待發放'
                        });

                        this.saveState();
                    }, 1000);
                },

                closeEarnedRewardModal() {
                    this.earnedRewardModal = null;
                }
            }
        }
    </script>
</body>
