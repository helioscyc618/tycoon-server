<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Noto Serif TC (明體) & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: {
                            50: '#fdf2f2',
                            100: '#fde8e8',
                            600: '#b91c1c',
                            700: '#990000',
                            800: '#7f1d1d',
                            900: '#650000'
                        },
                        gold: {
                            100: '#fef9c3',
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                            rich: '#D4AF37'
                        },
                        cream: '#FFF8F0'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', serif;
            background-color: #FFF8F0;
        }
        .ming-title {
            font-family: 'Noto Serif TC', serif;
            letter-spacing: 0.05em;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b91c1c;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 28s linear infinite;
        }
        .dice-container {
            perspective: 600px;
        }
        .dice-cube {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease-out;
        }
    </style>
</head>
<body class="h-full flex flex-col text-gray-800 bg-cream" x-data="app()" x-init="init()">

    <!-- TOP BAR: Network Status & NTP Clock & Quick Switch -->
    <header class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 text-gold-300 px-4 py-2 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2 border-gold-rich">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-green-900/60 text-green-200 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '連線正常 (Online)' : '離線警告 (Offline)'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-gold-100">
                <i class="fas fa-clock mr-1 text-gold-400"></i> NTP 時間: <span class="font-mono ml-1 font-bold text-white" x-text="ntpTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-gold-300 font-semibold hidden sm:inline"><i class="fas fa-dice text-gold-400 mr-1"></i> 競賽期間: 2026/12/14 ~ 2027/06/02</span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-black/30 px-3 py-1 rounded-full border border-gold-rich/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 bg-gold-600 text-white rounded font-bold" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-red-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="bg-gold-rich hover:bg-gold-600 text-ruby-900 font-bold px-3 py-1 rounded shadow text-xs transition flex items-center space-x-1">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心後台</span>
            </button>
        </div>
    </header>

    <!-- OFFLINE WARNING BANNER -->
    <div x-show="!isOnline" x-transition class="bg-red-600 text-white px-4 py-2 text-center text-xs font-bold flex items-center justify-center space-x-2 shadow-inner">
        <i class="fas fa-exclamation-triangle text-gold-300 text-base animate-bounce"></i>
        <span>【警告】目前偵測無網路連線！部分資料同步可能延遲，請確認您的網路狀態。</span>
    </div>

    <!-- RUNNING TICKER (戰報跑馬燈) -->
    <div class="bg-ruby-800 text-gold-300 py-2 px-3 overflow-hidden whitespace-nowrap border-b border-gold-rich/30 relative flex items-center shadow-inner">
        <div class="bg-gold-rich text-ruby-900 font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow">
            <i class="fas fa-bullhorn mr-1"></i> 戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide">
                <span x-text="settings.tickerText"></span>
                <span class="mx-6 text-gold-400">♦</span>
                <span>🔥 賀！團隊夥伴熱血衝刺中，半年期雙軌業績與增員成長競賽火熱進行中！</span>
                <span class="mx-6 text-gold-400">♦</span>
                <span>💡 提示：所有成績申報皆須完整填寫「任務說明/備註」方可送審。</span>
            </div>
        </div>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">

        <!-- VIEW 1: AUTHENTICATION / LOGIN / REGISTER / FORGOT -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border-2 border-gold-rich/50 my-6">
                <!-- Header -->
                <div class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 p-6 text-center text-white relative">
                    <div class="w-16 h-16 bg-gold-rich text-ruby-900 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg border-2 border-white text-2xl">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider text-gold-300">競賽大亨</h1>
                    <p class="text-xs text-gold-100 mt-1 tracking-widest font-serif">Competition Tycoon 2026-2027</p>
                </div>

                <!-- Tabs -->
                <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500 hover:text-gray-700'">忘記密碼</button>
                </div>

                <!-- Form Content -->
                <div class="p-6 space-y-4">
                    <!-- LOGIN -->
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ruby-600 focus:outline-none text-sm" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ruby-600 focus:outline-none text-sm" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-ruby-700 to-ruby-800 text-gold-300 font-bold py-3 rounded-lg shadow hover:from-ruby-800 hover:to-ruby-900 transition flex items-center justify-center space-x-2">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>進入戰情室</span>
                            </button>
                        </form>
                    </template>

                    <!-- REGISTER -->
                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-ruby-600" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱 (作為帳號與查詢密碼用)</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-ruby-600" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-ruby-600" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2 py-2 border rounded-lg text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" required class="w-full px-2 py-2 border rounded-lg text-sm" placeholder="預設：OO組">
                                </div>
                            </div>
                            <!-- Avatar Selection (10 choices) -->
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">選擇個人頭貼 Icon (10選1)</label>
                                <div class="grid grid-cols-5 gap-2 mt-1">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" 
                                            class="p-2 text-2xl rounded-lg border text-center transition flex items-center justify-center"
                                            :class="regForm.avatar === av ? 'border-ruby-700 bg-ruby-50 ring-2 ring-ruby-600 scale-105' : 'border-gray-200 hover:bg-gray-100'"
                                            x-text="av">
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-500 text-ruby-900 font-bold py-3 rounded-lg shadow hover:opacity-95 transition flex items-center justify-center space-x-2 mt-2">
                                <i class="fas fa-user-plus"></i>
                                <span>立即註冊 (起始點數 0)</span>
                            </button>
                        </form>
                    </template>

                    <!-- FORGOT PASSWORD -->
                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">註冊姓名 / 帳號</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full bg-ruby-800 text-white font-bold py-2.5 rounded-lg shadow hover:bg-ruby-900 transition text-sm">
                                查詢密碼
                            </button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-gold-100 border border-gold-400 rounded-lg text-center">
                                    <p class="text-xs text-gray-600">查詢結果：</p>
                                    <p class="text-base font-bold text-ruby-900 mt-1" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- VIEW 2: WAR ROOM (戰情室 - 夥伴端主介面) -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- User Welcome & Stats Overview Card -->
                <div class="bg-gradient-to-br from-white via-cream to-gold-100 rounded-2xl p-5 shadow-lg border border-gold-rich/40 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-ruby-800 text-gold-300 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2 border-gold-rich" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-ruby-900" x-text="currentUser.name"></h2>
                                <span class="px-2 py-0.5 bg-ruby-700 text-white text-xs rounded-full font-semibold" x-text="currentUser.rank"></span>
                                <span class="px-2 py-0.5 bg-gold-600 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-gray-600 mt-1">歡迎來到競賽大亨戰情室！衝刺 2026/12/14 ~ 2027/06/02 雙軌競賽高峰。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">FYC 總額</span>
                            <span class="text-lg font-bold text-ruby-800" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">可用點數</span>
                            <span class="text-lg font-bold text-gold-600" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">累積點數</span>
                            <span class="text-lg font-bold text-gray-800" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">骰子次數</span>
                            <span class="text-lg font-bold text-ruby-700" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- MAIN INTERACTION GRID -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                    <!-- LEFT COLUMN: Tag Declaration, Group Team & Message Board (5 cols) -->
                    <div class="lg:col-span-5 space-y-6">
                        
                        <!-- 1. Tag 點數申報與成績申報 (Mandatory Task Description) -->
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar text-gold-600 mr-2"></i> 成績申報與 Tag 任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-ruby-600">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (自動比例換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">輸入 FYC 金額 (預設 1,000 FYC = 1 P)</label>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" step="100" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="例如：10000">
                                        <p class="text-xs text-gold-700 mt-1 font-semibold" x-text="'預計可獲得點數：' + Math.floor((declForm.fycAmount || 0) / 1000) + ' 點'"></p>
                                    </div>
                                </template>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">
                                        任務說明 / 備註 <span class="text-red-600">* (必填)</span>
                                    </label>
                                    <input type="text" x-model="declForm.desc" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-ruby-600" placeholder="請詳細填寫拜訪對象、案號或專案說明...">
                                </div>
                                <template x-if="!isFYCTag">
                                    <p class="text-xs text-gold-700 font-semibold" x-text="'本項固定獲得點數：' + getSelectedTagPoints() + ' 點'"></p>
                                </template>
                                <button type="submit" class="w-full bg-gradient-to-r from-ruby-700 to-ruby-800 text-white font-bold py-2.5 rounded-lg shadow hover:bg-ruby-900 transition text-sm">
                                    送出審核申報
                                </button>
                            </form>
                        </div>

                        <!-- 2. 組內夥伴狀況 & 業績 Buff 顯示 -->
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-users text-gold-600 mr-2"></i> 同組夥伴狀況 (僅檢視)</span>
                                <span class="text-xs bg-gold-100 text-ruby-900 px-2 py-0.5 rounded font-bold" x-text="currentUser.group"></span>
                            </h3>
                            <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                                <template x-for="p in getGroupPartners()" :key="p.email">
                                    <div class="flex items-center justify-between p-2 rounded-lg bg-gray-50 border text-xs">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-lg" x-text="p.avatar"></span>
                                            <div>
                                                <p class="font-bold text-gray-800" x-text="p.name"></p>
                                                <p class="text-[10px] text-gray-500" x-text="p.rank"></p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="font-bold text-ruby-800" x-text="formatCurrency(getTotalFYC(p)) + ' FYC'"></p>
                                            <p class="text-[10px] text-gold-600 font-semibold" x-text="p.points + ' 點'"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <template x-if="currentUser.buffs && currentUser.buffs.length > 0">
                                <div class="mt-3 p-2.5 bg-ruby-50 border border-ruby-200 rounded-lg text-xs">
                                    <p class="font-bold text-ruby-900 mb-1"><i class="fas fa-link text-gold-600 mr-1"></i> 已連結之業績 Buff (被增員夥伴)：</p>
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="bName in currentUser.buffs" :key="bName">
                                            <span class="px-2 py-0.5 bg-white border border-ruby-300 rounded text-ruby-800 font-medium" x-text="bName"></span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- 3. 嗆蝦留言板 -->
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-comments text-gold-600 mr-2"></i> 嗆蝦士氣留言板</span>
                                <span class="text-xs text-gray-500 font-normal">全體即時互動</span>
                            </h3>
                            <form @submit.prevent="postMessage()" class="space-y-2 mb-4 pb-4 border-b">
                                <input type="text" x-model="msgForm.title" required class="w-full px-3 py-1.5 border rounded text-xs" placeholder="留言標題 (例如：衝刺 100 萬 FYC！)">
                                <textarea x-model="msgForm.content" required rows="2" class="w-full px-3 py-1.5 border rounded text-xs resize-none" placeholder="輸入激勵士氣的內容..."></textarea>
                                <div class="flex justify-between items-center text-xs">
                                    <label class="flex items-center space-x-1 cursor-pointer">
                                        <input type="checkbox" x-model="msgForm.isAnonymous" class="rounded text-ruby-600">
                                        <span class="text-gray-600">匿名發言</span>
                                    </label>
                                    <button type="submit" class="bg-ruby-800 hover:bg-ruby-900 text-white px-4 py-1.5 rounded font-bold transition shadow text-xs">
                                        發布留言
                                    </button>
                                </div>
                            </form>

    <script>
        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'dice') {
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch(e) {}
        }

                submitDeclaration() {
                    // Mandatory validation for task description
                    if (!this.declForm.desc || this.declForm.desc.trim() === '') {
                        this.showAlert('欄位未填寫', '請務必填寫「任務說明/備註」後才能送出審核申請！');
                        return;
                    }

                    let pts = 0;
                    let dCount = 0;
                    if (this.isFYCTag) {
                        pts = Math.floor((this.declForm.fycAmount || 0) / 1000);
                        dCount = Math.floor(pts / 10) || 1;
                    } else {
                        pts = this.getSelectedTagPoints();
                        dCount = 1;
                    }

                    const req = {
                        userName: this.currentUser.name,
                        userEmail: this.currentUser.email,
                        tag: this.declForm.tag,
                        details: this.declForm.desc + (this.isFYCTag ? ` (FYC 金額: $${this.declForm.fycAmount})` : ''),
                        points: pts,
                        dice: dCount,
                        time: new Date().toLocaleString()
                    };

                    this.declarations.push(req);
                    this.saveToLocalStorage();
                    playBeep('success');
                    this.showAlert('申報已送出', '您的案件已提交至指揮中心審核，審核通過後將自動發放點數與骰子！');
                    this.declForm.fycAmount = 10000;
                    this.declForm.desc = '';
                },

                approveDecl(index) {
                    const req = this.declarations[index];
                    const pIdx = this.partners.findIndex(p => p.email === req.userEmail);
                    if (pIdx !== -1) {
                        this.partners[pIdx].points = (this.partners[pIdx].points || 0) + req.points;
                        this.partners[pIdx].totalPoints = (this.partners[pIdx].totalPoints || 0) + req.points;
                        this.partners[pIdx].diceCount = (this.partners[pIdx].diceCount || 0) + req.dice;
                        if (req.tag === 'FYC') {
                            const match = req.details.match(/\$(\d+)/);
                            if (match) {
                                this.partners[pIdx].fyc = (this.partners[pIdx].fyc || 0) + parseInt(match[1]);
                            }
                        }
                        if (this.currentUser && this.currentUser.email === req.userEmail) {
                            this.currentUser = this.partners[pIdx];
                        }
                    }

                    this.declarations.splice(index, 1);
                    this.saveToLocalStorage();

                    try {
                        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    } catch(e) {}
                    playBeep('success');

                    this.showAlert('審核通過', `已成功撥發 ${req.points} 點與 ${req.dice} 顆骰子給 ${req.userName}！夥伴介面已即時同步更新。`);
                },

                rejectDecl(index) {
                    this.declarations.splice(index, 1);
                    this.saveToLocalStorage();
                    this.showAlert('已拒絕', '該筆申報案件已退回。');
                },

                rollDice() {
                    if (this.currentUser.points < 10) {
                        this.showAlert('點數不足', '每次擲骰需要 10 點點數，請先進行任務申報賺取點數！');
                        return;
                    }
                    this.currentUser.points -= 10;
                    this.isRolling = true;
                    this.showDiceModal = true;
                    playBeep('dice');

                    try {
                        if (navigator.vibrate) navigator.vibrate(200);
                    } catch(e) {}

                    let rolls = 0;
                    const rollInterval = setInterval(() => {
                        this.rollingDiceNumber = Math.floor(Math.random() * 6) + 1;
                        rolls++;
                        if (rolls > 10) {
                            clearInterval(rollInterval);
                            const finalStep = this.rollingDiceNumber;
                            this.isRolling = false;
                            this.showDiceModal = false;

                            this.currentUser.position = (this.currentUser.position + finalStep) % 30;
                            this.currentLandedCell = this.settings.boardCells[this.currentUser.position];
                            this.showLandingModal = true;

                            this.saveToLocalStorage();
                            playBeep('success');
                        }
                    }, 100);
                },

                closeLandingModal() {
                    this.showLandingModal = false;
                    const newReward = {
                        userName: this.currentUser.name,
                        reward: `[第 ${this.currentUser.position + 1} 格] ${this.currentLandedCell.title}：${this.currentLandedCell.reward}`,
                        time: new Date().toLocaleString(),
                        status: '未發放'
                    };
                    this.rewardsList.push(newReward);
                    this.saveToLocalStorage();
                },

                openCellModal(cell, index) {
                    this.selectedCell = cell;
                    this.selectedCellIndex = index;
                    this.showCellDetailModal = true;
                },

                hasPlayerHere(cellIndex) {
                    return this.partners.some(p => p.position === cellIndex);
                },

                getPlayersOnCell(cellIndex) {
                    return this.partners.filter(p => p.position === cellIndex);
                },

                getGroupPartners() {
                    if (!this.currentUser) return [];
                    return this.partners.filter(p => p.group === this.currentUser.group);
                },

                getTotalFYC(partner) {
                    let total = partner.fyc || 0;
                    if (partner.buffs && partner.buffs.length > 0) {
                        partner.buffs.forEach(bName => {
                            const downline = this.partners.find(p => p.name === bName);
                            if (downline) {
                                total += (downline.fyc || 0);
                            }
                        });
                    }
                    return total;
                },

                formatCurrency(num) {
                    return '$' + (num || 0).toLocaleString();
                },

                postMessage() {
                    const authorName = this.msgForm.isAnonymous ? '神秘夥伴' : this.currentUser.name;
                    this.messages.unshift({
                        title: this.msgForm.title,
                        content: this.msgForm.content,
                        isAnonymous: this.msgForm.isAnonymous,
                        author: authorName,
                        time: new Date().toLocaleString(),
                        likes: 0
                    });
                    this.saveToLocalStorage();
                    this.msgForm.title = '';
                    this.msgForm.content = '';
                    this.showAlert('發布成功', '嗆蝦留言已送出，全體夥伴已同步收到士氣激勵通知！');
                },

                likeMessage(index) {
                    this.messages[index].likes = (this.messages[index].likes || 0) + 1;
                    this.saveToLocalStorage();
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) {
                        this.adminAuth = true;
                        playBeep('success');
                    } else {
                        this.showAlert('密碼錯誤', '管理者密碼不正確！');
                    }
                },

                editPartner(p) {
                    const idx = this.partners.findIndex(x => x.email === p.email);
                    this.editingPartnerIndex = idx;
                    this.editingPartner = JSON.parse(JSON.stringify(p));
                    if (!this.editingPartner.buffs) this.editingPartner.buffs = [];
                    this.showEditPartnerModal = true;
                },

                savePartnerEdit() {
                    if (this.editingPartnerIndex !== -1) {
                        this.partners[this.editingPartnerIndex] = JSON.parse(JSON.stringify(this.editingPartner));
                        if (this.currentUser && this.currentUser.email === this.editingPartner.email) {
                            this.currentUser = this.partners[this.editingPartnerIndex];
                        }
                        this.saveToLocalStorage();
                        this.showEditPartnerModal = false;
                        this.showAlert('更新成功', '夥伴資料與業績 Buff 已成功寫入並同步至全系統！');
                    }
                },

                promptDeletePartner(index) {
                    this.deletingPartnerIndex = index;
                    this.deletingPartnerTarget = this.partners[index];
                    this.showDeleteConfirmModal = true;
                },

                executeDeletePartner() {
                    if (this.deletingPartnerIndex !== -1) {
                        const targetEmail = this.deletingPartnerTarget.email;
                        const targetName = this.deletingPartnerTarget.name;

                        this.partners.splice(this.deletingPartnerIndex, 1);
                        this.partners.forEach(p => {
                            if (p.buffs && p.buffs.includes(targetName)) {
                                p.buffs = p.buffs.filter(n => n !== targetName);
                            }
                        });

                        this.saveToLocalStorage();
                        this.showDeleteConfirmModal = false;
                        this.deletingPartnerIndex = -1;
                        this.deletingPartnerTarget = null;

                        if (this.currentUser && this.currentUser.email === targetEmail) {
                            this.logout();
                        }

                        this.showAlert('刪除成功', '該名夥伴已安全自系統中移除，組織結構已自動重新計算。');
                    }
                },

                addTag() {
                    if (!this.newTagForm.name) return;
                    this.settings.tags.push({
                        name: this.newTagForm.name,
                        isFYC: this.newTagForm.isFYC,
                        points: this.newTagForm.points || 10
                    });
                    this.saveToLocalStorage();
                    this.newTagForm.name = '';
                    this.showAlert('已新增', '新的獲點方式 Tag 已成功加入！');
                },

                removeTag(index) {
                    this.settings.tags.splice(index, 1);
                    this.saveToLocalStorage();
                },

                saveSettings() {
                    this.saveToLocalStorage();
                    this.showAlert('儲存成功', '最新公告、跑馬燈與 30 格跳跳格獎勵設定已即時更新！');
                },

                toggleRewardStatus(index) {
                    this.rewardsList[index].status = this.rewardsList[index].status === '已發放' ? '未發放' : '已發放';
                    this.saveToLocalStorage();
                },

                exportRewards() {
                    let csv = '夥伴姓名,獲得獎勵內容,獲得時間,發放狀態\n';
                    this.rewardsList.forEach(r => {
                        csv += `"${r.userName}","${r.reward}","${r.time}","${r.status}"\n`;
                    });
                    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = '競賽大亨_獎勵統整清單.csv';
                    a.click();
                },

                updateAdminPassword() {
                    if (!this.newAdminPassword) return;
                    this.adminPassword = this.newAdminPassword;
                    this.newAdminPassword = '';
                    this.showAlert('修改成功', '指揮中心管理者密碼已更新！');
                },

                testSandbox() {
                    this.sandboxResult = "Sandbox 預覽測試成功：程式碼結構與版本相容，無語法錯誤。";
                },

                deployUpdate() {
                    this.showAlert('熱更新成功', '新版本程式碼已成功廣播更新至所有上線使用者！');
                },

                showAlert(title, text) {
                    this.notificationTitle = title;
                    this.notificationText = text;
                    this.showNotificationModal = true;
                    playBeep('info');
                }
            }
        }
    </script>
</body>
</html>
