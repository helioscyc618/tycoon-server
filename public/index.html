<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-slate-800 text-green-400 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '雲端同步連線中' : '離線狀態'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-slate-300 font-mono text-xs" x-text="taipeiTime"></span>
        </div>
        <div class="flex items-center space-x-3">
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved mr-1"></i> 指揮中心
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 flex items-center text-xs" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2 py-0.5 rounded text-xs mr-3 z-10" :style="'background-color: ' + (settings.primaryColor || '#f97316')">最新戰報</div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block font-medium text-slate-200" x-text="settings.ticker1 + ' ♦ ' + settings.ticker2 + ' ♦ ' + settings.ticker3"></div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <h1 class="text-3xl font-bold ming-title" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1">Competition Tycoon</p>
                </div>
                <div class="p-6 space-y-4">
                    <form @submit.prevent="login()" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">帳號 / 姓名</label>
                            <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="請輸入姓名或 Email">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="請輸入密碼">
                        </div>
                        <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">進入戰情室</button>
                    </form>
                </div>
            </div>
        </template>

        <template x-if="currentUser">
            <div class="space-y-6">
                <div class="bg-white rounded-2xl p-5 shadow-sm border flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                            <p class="text-xs text-slate-500 mt-1">可用點數：<span class="font-bold text-base" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.points"></span> 點</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="text-xs bg-slate-50 p-2 rounded-xl border flex space-x-3">
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" x-model="currentUser.iosPush" @change="syncToServer()"><span>iOS通知</span></label>
                            <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" x-model="currentUser.androidPush" @change="syncToServer()"><span>Android通知</span></label>
                        </div>
                        <button @click="rollDice()" :disabled="currentUser.points < 10" class="text-white font-bold px-6 py-3 rounded-xl shadow transition disabled:opacity-50 text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                            立即擲骰 (10點)
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- COMMAND CENTER -->
    <div x-show="openAdminModal" class="fixed inset-0 z-30 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-2 sm:p-4" x-transition>
        <div class="bg-white rounded-2xl max-w-6xl w-full h-[90vh] overflow-hidden shadow-2xl border flex flex-col">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center border-b-2" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                <h2 class="text-xl font-bold ming-title" :style="'color: ' + (settings.primaryColor || '#f97316')">指揮中心</h2>
                <button @click="openAdminModal = false" class="text-slate-300 hover:text-white text-lg"><i class="fas fa-times"></i></button>
            </div>

            <template x-if="!adminAuth">
                <div class="p-8 max-w-md mx-auto text-center space-y-4 my-auto">
                    <h3 class="text-xl font-bold text-slate-900">請輸入管理者密碼 (admin)</h3>
                    <input type="password" x-model="adminPassInput" @keyup.enter="verifyAdmin()" class="w-full px-3 py-2.5 border rounded-xl text-center text-sm" placeholder="請輸入密碼">
                    <button @click="verifyAdmin()" class="w-full text-white font-bold py-2.5 rounded-xl text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">解鎖</button>
                </div>
            </template>

            <template x-if="adminAuth">
                <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
                    <div class="w-full md:w-64 bg-slate-50 border-r p-3 space-y-1 text-xs font-semibold overflow-y-auto">
                        <button class="w-full px-3 py-2.5 rounded-xl text-left bg-slate-900 text-orange-400 flex items-center space-x-2"><i class="fas fa-code w-5"></i><span>HTML 與 JS 分離編碼器</span></button>
                    </div>

                    <div class="flex-1 p-6 overflow-y-auto bg-white space-y-6 text-xs">
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-base font-bold text-slate-900 ming-title">前端編碼線上檢視與雙欄分離更新</h3>
                                <button @click="loadCurrentCode()" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs">載入目前頁面編碼</button>
                            </div>
                            
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">1. HTML 系統介面原始碼</label>
                                <textarea x-model="systemHtmlCode" rows="8" class="w-full p-2 border rounded-xl font-mono bg-slate-900 text-green-400 text-xs" placeholder="在此貼上或修改 HTML 結構..."></textarea>
                            </div>

                            <div>
                                <label class="block font-bold text-slate-700 mb-1">2. JS 系統邏輯原始碼</label>
                                <textarea x-model="systemJsCode" rows="8" class="w-full p-2 border rounded-xl font-mono bg-slate-950 text-amber-400 text-xs" placeholder="在此貼上或修改 JavaScript 邏輯..."></textarea>
                            </div>

                            <div class="bg-orange-50 p-4 rounded-xl border border-orange-200 space-y-2">
                                <h4 class="font-bold text-orange-800 text-sm">💡 確保編碼同步更新 Git 與 Render 的匯出步驟：</h4>
                                <ol class="list-decimal list-inside text-slate-700 space-y-1">
                                    <li>點擊下方 **「匯出合併編碼檔案」** 按鈕下載最新的 `index.html`。</li>
                                    <li>將下載的檔案覆蓋到電腦專案資料夾根目錄與 `public/` 中。</li>
                                    <li>在終端機執行：<code class="bg-white px-1.5 py-0.5 rounded border">git add . && git commit -m "update code" && git push origin main</code></li>
                                    <li>至 Render 點擊 **Deploy latest commit** 即可全面上線！</li>
                                </ol>
                                <button @click="exportAndSyncCode()" class="w-full mt-2 text-white font-bold py-3 rounded-xl shadow text-sm flex items-center justify-center space-x-2" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                    <i class="fas fa-file-arrow-down"></i>
                                    <span>匯出合併編碼檔案 (.html)</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- NOTIFICATION MODAL -->
    <div x-show="showNotificationModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4" x-transition>
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border-2 text-center space-y-3" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
            <h3 class="text-lg font-bold text-slate-900 ming-title" x-text="notificationTitle"></h3>
            <p class="text-sm text-slate-600 whitespace-pre-line" x-text="notificationText"></p>
            <button @click="showNotificationModal = false" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">確定</button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const API_BASE = 'https://competition-tycoon.onrender.com/api';

        function app() {
            return {
                isOnline: navigator.onLine,
                taipeiTime: '',
                currentUser: null,
                loginForm: { account: '', password: '' },
                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                adminPassword: 'admin',
                systemHtmlCode: '',
                systemJsCode: '',
                settings: { primaryColor: '#f97316', headerColor: '#0f172a', bgColor: '#FAFAFA', ticker1: '🏆 競賽大亨熱血啟動！', ticker2: '🔥 隨時同步雲端戰況！', ticker3: '⭐ 挑戰大富翁大獎！' },
                partners: [],
                showNotificationModal: false,
                notificationTitle: '',
                notificationText: '',
                lastKnownPoints: 0,
                lastKnownNotifCount: 0,

                async init() {
                    setInterval(() => {
                        this.taipeiTime = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
                    }, 1000);
                    await this.fetchCloudData();
                    setInterval(async () => { await this.fetchCloudData(); }, 4000);
                    const savedUser = localStorage.getItem('tycoon_current_user');
                    if (savedUser) { 
                        this.currentUser = JSON.parse(savedUser); 
                        this.lastKnownPoints = this.currentUser.points || 0; 
                    }
                },

                async fetchCloudData() {
                    try {
                        const res = await fetch(`${API_BASE}/state`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.partners) this.partners = data.partners;
                            if (data.settings) this.settings = data.settings;
                            
                            if (this.currentUser) {
                                const matched = this.partners.find(p => p.email === this.currentUser.email);
                                if (matched) {
                                    // 偵測點數增加（收case/審核通過道喜彈窗）
                                    if (matched.points > this.lastKnownPoints) {
                                        const diff = matched.points - this.lastKnownPoints;
                                        if (matched.iosPush !== false || matched.androidPush !== false) {
                                            this.showAlert('🎉 戰情室捷報與系統通知', `恭喜獲得審核通過！點數增加 +${diff} 點！`);
                                            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                                        }
                                    }
                                    this.lastKnownPoints = matched.points;
                                    this.currentUser = matched;
                                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                                }
                            }
                        }
                    } catch(e) {}
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        this.lastKnownPoints = this.currentUser.points || 0;
                        if (this.currentUser.iosPush === undefined) this.currentUser.iosPush = true;
                        if (this.currentUser.androidPush === undefined) this.currentUser.androidPush = true;
                        localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                        this.showAlert('登入成功', `歡迎回來，${this.currentUser.name}！已連線至最新戰況。`);
                    } else { this.showAlert('失敗', '帳號或密碼錯誤'); }
                },

                logout() { this.currentUser = null; localStorage.removeItem('tycoon_current_user'); },

                async rollDice() {
                    if (this.currentUser.points < 10) return;
                    // 確實精確扣除 10 點
                    this.currentUser.points -= 10;
                    this.lastKnownPoints = this.currentUser.points;
                    
                    const p = this.partners.find(x => x.email === this.currentUser.email);
                    if (p) {
                        p.points = this.currentUser.points;
                    }
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                    this.showAlert('🎲 擲骰完成', '已成功扣除 10 點並推進棋盤！');
                },

                async syncToServer() {
                    await fetch(`${API_BASE}/state`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ partners: this.partners, settings: this.settings })
                    });
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) { this.adminAuth = true; }
                    else { this.showAlert('錯誤', '管理者密碼不正確'); }
                },

                loadCurrentCode() {
                    const fullHtml = document.documentElement.outerHTML;
                    // 簡單示範將當前網頁拆分為 HTML 與 JS 放入兩欄
                    const scriptSplit = fullHtml.split('<script>');
                    this.systemHtmlCode = scriptSplit[0] || '';
                    this.systemJsCode = scriptSplit[1] ? '<script>' + scriptSplit.slice(1).join('<script>') : '';
                    this.showAlert('載入成功', '目前頁面已成功載入至 HTML 與 JS 獨立欄位！');
                },

                exportAndSyncCode() {
                    const combinedCode = this.systemHtmlCode + '\n' + this.systemJsCode;
                    const blob = new Blob([combinedCode], { type: 'text/html;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'index.html';
                    a.click();
                    this.showAlert('匯出成功', 'index.html 檔案已下載！請覆蓋至專案資料夾並執行 git push 與 Render 部署。');
                },

                showAlert(title, text) {
                    this.notificationTitle = title;
                    this.notificationText = text;
                    this.showNotificationModal = true;
                }
            }
        }
    </script>
</body>
</html>
