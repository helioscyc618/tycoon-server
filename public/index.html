<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        cream: '#FAFAFA'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; color: #1e293b; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 35s linear infinite; }
        .dice-container { perspective: 600px; }
        .dice-cube { width: 60px; height: 60px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
    </style>
</head>
<body class="h-full flex flex-col transition-colors duration-300" :style="'background-color: ' + (settings.bgColor || '#FAFAFA')" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="text-white px-4 py-2.5 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2" :style="'background-color: ' + (settings.headerColor || '#0f172a') + '; border-color: ' + (settings.primaryColor || '#f97316')">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-slate-800 text-green-400 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '雲端同步連線中 (Online)' : '離線警告 (Offline)'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-slate-300">
                <i class="fas fa-clock mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="taipeiTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-slate-300 font-semibold hidden sm:inline">
                <i class="fas fa-dice mr-1" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 競賽期間: <span x-text="settings.startDate || '2026/12/14'"></span> ~ <span x-text="settings.endDate || '2027/06/02'"></span> 
                <span class="ml-2 bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded border border-orange-500/40 text-xs font-bold" x-text="'⏳ 倒數 ' + getCountdownDays() + ' 天'"></span>
            </span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1 rounded-full border border-orange-500/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 text-white rounded font-bold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-slate-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="text-white font-bold px-3.5 py-1.5 rounded-lg shadow text-xs transition flex items-center space-x-1.5" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心</span>
            </button>
        </div>
    </header>

    <!-- OFFLINE WARNING -->
    <div x-show="!isOnline" x-transition class="bg-red-600 text-white px-4 py-2 text-center text-xs font-bold flex items-center justify-center space-x-2 shadow-inner">
        <i class="fas fa-exclamation-triangle text-white text-base animate-bounce"></i>
        <span>【警告】目前偵測無網路連線！請檢查您的網路狀態。</span>
    </div>

    <!-- RUNNING TICKER -->
    <div class="bg-slate-800 py-2.5 px-3 overflow-hidden whitespace-nowrap border-b border-orange-500/30 relative flex items-center shadow-inner" :style="'color: ' + (settings.primaryColor || '#f97316')">
        <div class="text-white font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
            <i class="fas fa-bullhorn mr-1"></i> 最新戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide text-slate-200">
                <span x-text="settings.ticker1"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker2"></span>
                <span class="mx-6" :style="'color: ' + (settings.primaryColor || '#f97316')">♦</span>
                <span x-text="settings.ticker3"></span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">

        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 my-6">
                <div class="bg-slate-900 p-6 text-center text-white relative border-b-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                    <div class="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl rotate-3" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider" :style="'color: ' + (settings.primaryColor || '#f97316')">競賽大亨</h1>
                    <p class="text-xs text-slate-300 mt-1 tracking-widest font-serif">Competition Tycoon</p>
                </div>

                <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'login' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'register' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white font-bold border-b-2' : 'text-slate-500 hover:text-slate-700'" :style="authTab === 'forgot' ? 'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316') : ''">忘記密碼</button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full text-white font-bold py-3 rounded-xl shadow transition" :style="'background-color: ' + (settings.primaryColor || '#f97316')">進入戰情室</button>
                        </form>
                    </template>
                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2.5 py-2 border rounded-xl text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" required class="w-full px-2.5 py-2 border rounded-xl text-sm" placeholder="OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">選擇個人頭貼 Icon</label>
                                <div class="grid grid-cols-5 gap-2 mt-1">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" 
                                            class="p-2 text-2xl rounded-xl border text-center transition flex items-center justify-center bg-slate-50"
                                            :class="regForm.avatar === av ? 'bg-orange-50 ring-2 scale-105' : 'border-slate-200'"
                                            x-text="av"></button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow mt-2">立即註冊</button>
                        </form>
                    </template>
                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">註冊姓名</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="請輸入 Email">
                            </div>
                            <button @click="findPassword()" class="w-full text-white font-bold py-2.5 rounded-xl shadow text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">查詢密碼</button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-orange-50 border rounded-xl text-center text-xs" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="forgotResult"></div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <!-- Banner -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2" :style="'color: ' + (settings.primaryColor || '#f97316') + '; border-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-slate-900" x-text="currentUser.name"></h2>
                                <span class="px-2.5 py-0.5 text-white text-xs rounded-full font-semibold" :style="'background-color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span>
                                <span class="px-2.5 py-0.5 bg-slate-800 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">多裝置資料已自動雲端同步。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <span class="block text-[11px] text-slate-500">FYC 總額</span>
                            <span class="text-base font-bold text-slate-900" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <span class="block text-[11px] text-slate-500">可用點數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <span class="block text-[11px] text-slate-500">累積點數</span>
                            <span class="text-base font-bold text-slate-900" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <span class="block text-[11px] text-slate-500">骰子次數</span>
                            <span class="text-base font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <!-- Content Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Left -->
                    <div class="lg:col-span-5 space-y-6">
                        <!-- Profile & Push Settings -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border space-y-4">
                            <h3 class="text-base font-bold text-slate-900 ming-title flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-id-card mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 個人資訊與推播設定</span>
                                <button @click="showProfileEdit = !showProfileEdit" class="text-xs font-semibold hover:underline" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="showProfileEdit ? '取消' : '編輯'"></button>
                            </h3>
                            <template x-if="!showProfileEdit">
                                <div class="space-y-2 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-xl border">
                                    <div class="flex justify-between"><span class="text-slate-400">姓名:</span><span class="font-bold text-slate-900" x-text="currentUser.name"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">職級:</span><span class="font-bold" :style="'color: ' + (settings.primaryColor || '#f97316')" x-text="currentUser.rank"></span></div>
                                    <div class="flex justify-between"><span class="text-slate-400">Email:</span><span class="font-mono text-slate-800" x-text="currentUser.email"></span></div>
                                    <div class="flex justify-between items-center pt-2 border-t">
                                        <span class="font-bold text-slate-800"><i class="fas fa-bell mr-1"></i> 推播通知：</span>
                                        <div class="flex space-x-3">
                                            <label class="flex items-center space-x-1 cursor-pointer">
                                                <input type="checkbox" x-model="currentUser.iosPush" @change="savePushSettings()" class="rounded text-orange-500">
                                                <span>iOS</span>
                                            </label>
                                            <label class="flex items-center space-x-1 cursor-pointer">
                                                <input type="checkbox" x-model="currentUser.androidPush" @change="savePushSettings()" class="rounded text-orange-500">
                                                <span>Android</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="showProfileEdit">
                                <form @submit.prevent="saveProfileChanges()" class="space-y-3 text-xs">
                                    <input type="text" x-model="profileForm.name" class="w-full px-3 py-2 border rounded-xl bg-white" required placeholder="姓名">
                                    <select x-model="profileForm.rank" class="w-full px-2.5 py-2 border rounded-xl bg-white">
                                        <option value="業務專員">業務專員</option><option value="業務主任">業務主任</option><option value="業務襄理">業務襄理</option><option value="業務經理">業務經理</option>
                                    </select>
                                    <input type="email" x-model="profileForm.email" class="w-full px-3 py-2 border rounded-xl bg-white" required placeholder="Email">
                                    <input type="password" x-model="profileForm.newPassword" class="w-full px-3 py-2 border rounded-xl bg-white" placeholder="新密碼 (不修改請留空)">
                                    <button type="submit" class="w-full text-white font-bold py-2 rounded-xl" :style="'background-color: ' + (settings.primaryColor || '#f97316')">儲存</button>
                                </form>
                            </template>
                        </div>

                        <!-- Declaration -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border">
                            <h3 class="text-base font-bold text-slate-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 成績申報與 Tag 任務
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2.5 border rounded-xl text-sm bg-white">
                                    <template x-for="t in settings.tags" :key="t.name">
                                        <option :value="t.name" x-text="t.name + (t.isFYC ? ' (FYC千位換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                    </template>
                                </select>
                                <template x-if="isFYCTag">
                                    <div>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="輸入原始 FYC 金額">
                                    </div>
                                </template>
                                <input type="text" x-model="declForm.desc" required class="w-full px-3 py-2.5 border rounded-xl text-sm" placeholder="任務說明/備註 (必填)">
                                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm">送出審核申報</button>
                            </form>
                        </div>
                    </div>

                    <!-- Right -->
                    <div class="lg:col-span-7 space-y-6">
                        <!-- Dice Roll -->
                        <div class="bg-slate-900 p-5 rounded-2xl shadow-md border text-white flex flex-col sm:flex-row items-center justify-between gap-4" :style="'border-color: ' + (settings.primaryColor || '#f97316')">
                            <div>
                                <h3 class="text-lg font-bold ming-title" :style="'color: ' + (settings.primaryColor || '#f97316')"><i class="fas fa-dice mr-2"></i> 大富翁擲骰推進區</h3>
                                <p class="text-xs text-slate-300 mt-0.5">每次擲骰消耗 <span class="font-bold text-white">10 點</span>。</p>
                            </div>
                            <button @click="rollDice()" :disabled="currentUser.points < 10 || isRolling" 
                                class="text-white font-bold px-6 py-3 rounded-xl shadow transition disabled:opacity-50 text-sm" :style="'background-color: ' + (settings.primaryColor || '#f97316')">
                                <span x-text="isRolling ? '滾動中...' : '立即擲骰 (10點)'"></span>
                            </button>
                        </div>

                        <!-- Board -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border">
                            <h3 class="text-base font-bold text-slate-900 ming-title mb-4"><i class="fas fa-map mr-2" :style="'color: ' + (settings.primaryColor || '#f97316')"></i> 機會命運大富翁棋盤</h3>
                            <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                                <template x-for="(cell, index) in settings.boardCells" :key="index">
                                    <div @click="openCellModal(cell, index)" 
                                        class="relative p-2 rounded-xl border flex flex-col items-center justify-center cursor-pointer transition h-20 text-center"
                                        :class="hasPlayerHere(index) ? 'bg-orange-50 ring-2' : 'border-slate-200 bg-slate-50'"
                                        :style="hasPlayerHere(index) ? 'border-color: ' + (settings.primaryColor || '#f97316') : ''">
                                        <span class="absolute top-1 left-1 text-[9px] font-bold text-slate-400 font-mono" x-text="index + 1"></span>
                                        <span class="text-lg mb-1" x-text="cell.icon"></span>
                                        <span class="text-[10px] font-bold text-slate-800 line-clamp-1" x-text="cell.title"></span>
                                    </div>
                                </template>
                            </div>

    <!-- SCRIPT -->
    <script>
        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        const API_BASE = 'https://competition-tycoon.onrender.com/api';

        function app() {
            return {
                isOnline: navigator.onLine,
                taipeiTime: '',
                authTab: 'login',
                currentUser: null,
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: 'OO組', avatar: '👨‍💼' },
                forgotForm: { name: '', email: '' },
                forgotResult: '',
                avatarList: ['👨‍💼', '👩‍💼', '🧑‍💼', '👨‍💻', '👩‍💻'],
                showProfileEdit: false,
                profileForm: { name: '', rank: '', email: '', newPassword: '' },
                selectedCell: {},
                selectedCellIndex: 0,
                showCellDetailModal: false,
                showLandingModal: false,
                currentLandedCell: {},
                showDiceModal: false,
                isRolling: false,
                rollingDiceNumber: 1,
                declForm: { tag: 'FYC', fycAmount: 10250, desc: '' },
                isFYCTag: true,
                declarations: [],
                openAdminModal: false,
                adminAuth: false,
                adminPassInput: '',
                adminPassword: 'admin',
                adminTab: 'approvals',
                systemRawCode: '',
                jsonCommandInput: '',
                settings: {
                    newsTitle: '🏆 競賽大亨正式開跑！',
                    newsContent: '歡迎各位頂尖業務菁英！',
                    startDate: '2026/12/14',
                    endDate: '2027/06/02',
                    ticker1: '🎉 賀！競賽大亨雙軌競賽熱血啟動！',
                    ticker2: '🔥 團隊夥伴衝刺中，即時同步雲端！',
                    ticker3: '⭐ 挑戰機會命運大富翁棋盤豐富大獎！',
                    primaryColor: '#f97316',
                    headerColor: '#0f172a',
                    bgColor: '#FAFAFA',
                    tags: [
                        { name: 'FYC', isFYC: true, points: 0 },
                        { name: '活動邀約', isFYC: false, points: 10 },
                        { name: '增員面談', isFYC: false, points: 20 },
                        { name: '新夥伴報聘', isFYC: false, points: 50 }
                    ],
                    boardCells: []
                },
                rewardsList: [],
                partners: [],
                showNotificationModal: false,
                notificationTitle: '',
                notificationText: '',
                lastKnownPoints: 0,
                lastCodeVersion: '',

                async init() {
                    setInterval(() => {
                        this.taipeiTime = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
                    }, 1000);
                    await this.fetchCloudData();
                    setInterval(async () => { await this.fetchCloudData(); }, 4000);

                    const savedUser = localStorage.getItem('tycoon_current_user');
                    if (savedUser) {
                        this.currentUser = JSON.parse(savedUser);
                        this.lastKnownPoints = this.currentUser.points || 0;
                        if (this.currentUser.iosPush === undefined) this.currentUser.iosPush = true;
                        if (this.currentUser.androidPush === undefined) this.currentUser.androidPush = true;
                        this.initProfileForm();
                    }
                },

                initProfileForm() {
                    if (this.currentUser) {
                        this.profileForm.name = this.currentUser.name;
                        this.profileForm.rank = this.currentUser.rank;
                        this.profileForm.email = this.currentUser.email;
                    }
                },

                getCountdownDays() { return 60; },

                async fetchCloudData() {
                    try {
                        const res = await fetch(`${API_BASE}/state`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.partners) this.partners = data.partners;
                            if (data.declarations) this.declarations = data.declarations;
                            if (data.rewardsList) this.rewardsList = data.rewardsList;
                            if (data.settings) this.settings = data.settings;

                            if (this.currentUser) {
                                const matched = this.partners.find(p => p.email === this.currentUser.email);
                                if (matched) {
                                    if (matched.points > this.lastKnownPoints) {
                                        const diff = matched.points - this.lastKnownPoints;
                                        this.showAlert('🎉 戰情室捷報', `指揮中心已通過您的申報，成功獲得 +${diff} 點與對應骰子！`);
                                    }
                                    this.lastKnownPoints = matched.points;
                                    this.currentUser = matched;
                                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                                }
                            }
                            if (!this.settings.boardCells || this.settings.boardCells.length !== 30) {
                                this.initDefaultBoardCells();
                            }
                        }
                    } catch(e) {}
                },

                initDefaultBoardCells() {
                    this.settings.boardCells = [];
                    for (let i = 0; i < 30; i++) {
                        this.settings.boardCells.push({ title: '活力衝刺格 #' + (i+1), icon: '⭐', type: '獎勵', reward: '獲得 20 點積分！' });
                    }
                },

                async syncToServer() {
                    await fetch(`${API_BASE}/state`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ partners: this.partners, declarations: this.declarations, rewardsList: this.rewardsList, settings: this.settings })
                    });
                },

                login() {
                    const found = this.partners.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        this.lastKnownPoints = this.currentUser.points || 0;
                        localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                        this.initProfileForm();
                        this.showAlert('登入成功', `歡迎回來，${this.currentUser.name}！`);
                    } else { this.showAlert('失敗', '帳號或密碼錯誤'); }
                },

                async register() {
                    const newP = { name: this.regForm.name, email: this.regForm.email, password: this.regForm.password, rank: this.regForm.rank, group: this.regForm.group, avatar: this.regForm.avatar, iosPush: true, androidPush: true, fyc: 0, points: 0, totalPoints: 0, diceCount: 0, position: 0, buffs: [] };
                    this.partners.push(newP);
                    this.currentUser = newP;
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                    this.showAlert('註冊成功', '已加入競賽大亨！');
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('tycoon_current_user');
                },

                async saveProfileChanges() {
                    this.currentUser.name = this.profileForm.name;
                    this.currentUser.rank = this.profileForm.rank;
                    this.currentUser.email = this.profileForm.email;
                    if (this.profileForm.newPassword) this.currentUser.password = this.profileForm.newPassword;
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    await this.syncToServer();
                    this.showProfileEdit = false;
                    this.showAlert('成功', '個人資料已更新');
                },

                savePushSettings() { this.syncToServer(); },

                onTagChange() {
                    const sel = this.settings.tags.find(t => t.name === this.declForm.tag);
                    this.isFYCTag = sel ? sel.isFYC : false;
                },

                getSelectedTagPoints() {
                    const sel = this.settings.tags.find(t => t.name === this.declForm.tag);
                    return sel ? sel.points : 10;
                },

                async submitDeclaration() {
                    let pts = this.isFYCTag ? Math.ceil((this.declForm.fycAmount || 0) / 1000) : this.getSelectedTagPoints();
                    let d = Math.floor(pts / 10) || 1;
                    this.declarations.push({ userName: this.currentUser.name, userEmail: this.currentUser.email, tag: this.declForm.tag, details: this.declForm.desc, rawFYC: this.declForm.fycAmount || 0, points: pts, dice: d, time: new Date().toLocaleString() });
                    await this.syncToServer();
                    this.showAlert('已送出', '申報已提交至指揮中心審核');
                    this.declForm.desc = '';
                },

                async approveDecl(idx) {
                    const req = this.declarations[idx];
                    const p = this.partners.find(x => x.email === req.userEmail);
                    if (p) {
                        p.points += req.points; p.totalPoints += req.points; p.diceCount += req.dice;
                        if (req.tag === 'FYC') p.fyc += (req.rawFYC || 0);
                    }
                    this.declarations.splice(idx, 1);
                    await this.syncToServer();
                    this.showAlert('已通過', '點數與骰子已撥發');
                },

                async rejectDecl(idx) { this.declarations.splice(idx, 1); await this.syncToServer(); },

                async rollDice() {
                    if (this.currentUser.points < 10) return;
                    this.currentUser.points -= 10;
                    this.lastKnownPoints = this.currentUser.points;
                    const p = this.partners.find(x => x.email === this.currentUser.email);
                    if (p) p.points = this.currentUser.points;
                    localStorage.setItem('tycoon_current_user', JSON.stringify(this.currentUser));
                    
                    this.currentUser.position = (this.currentUser.position + 3) % 30;
                    await this.syncToServer();
                    this.showAlert('🎲 擲骰完成', `往前推進，目前在第 ${this.currentUser.position + 1} 格！`);
                },

                getTotalFYC(p) { return p.fyc || 0; },
                formatCurrency(n) { return '$' + (n || 0).toLocaleString(); },
                hasPlayerHere(idx) { return this.partners.some(p => p.position === idx); },
                getGroupPartners() { return this.partners.filter(p => p.group === this.currentUser.group); },
                openCellModal(c, i) {},

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) { this.adminAuth = true; playBeep('success'); }
                    else { this.showAlert('錯誤', '密碼不正確'); }
                },

                editPartner(p) {},
                async saveSettings() { await this.syncToServer(); this.showAlert('成功', '設定已儲存'); },
                loadCurrentCode() { this.systemRawCode = document.documentElement.outerHTML; },
                async pushCodeToAllDevices() {
                    await fetch(`${API_BASE}/update-code`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ htmlCode: this.systemRawCode }) });
                    this.showAlert('成功', '編碼已推送');
                },
                async executeJsonCommand() {
                    await fetch(`${API_BASE}/restore-json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonData: this.jsonCommandInput }) });
                    this.showAlert('成功', 'JSON 指令已執行');
                    await this.fetchCloudData();
                },
                downloadBackup() {
                    const blob = new Blob([JSON.stringify({ partners: this.partners, settings: this.settings }, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click();
                },
                showAlert(title, text) { this.notificationTitle = title; this.notificationText = text; this.showNotificationModal = true; playBeep('success'); }
            }
        }
    </script>
</body>
</html>
