<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 - Competition Tycoon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        luxury: {
                            950: '#09090b',
                            900: '#121216',
                            800: '#1c1c24',
                            700: '#272732',
                            600: '#3f3f50',
                        },
                        gold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            glow: '#fef08a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 35s linear infinite;
        }
        .glass-card {
            background: rgba(28, 28, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.2);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-full bg-luxury-950 text-stone-200 font-sans antialiased selection:bg-gold-500 selection:text-black flex flex-col">

    <!-- Network Status Banner -->
    <div id="network-banner" class="hidden bg-red-900/90 text-red-200 text-xs py-1.5 px-4 text-center font-bold border-b border-red-700 z-50">
        ⚠️ 目前處於離線模式，系統將於恢復連線時自動同步數據。
    </div>

    <!-- Main Container -->
    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Header -->
        <header class="bg-luxury-900/90 backdrop-blur-md shadow-xl px-6 py-4 flex items-center justify-between z-40 border-b border-gold-500/20">
            <div class="flex items-center space-x-3">
                <span class="text-3xl bg-gradient-to-br from-gold-400 to-gold-600 p-2.5 rounded-2xl shadow-lg shadow-gold-500/10 inline-flex items-center justify-center text-black font-bold">🎲</span>
                <div>
                    <h1 class="text-2xl font-serif font-black tracking-widest gold-gradient-text">競賽大亨</h1>
                    <p class="text-xs text-stone-400 font-mono">COMPETITION TYCOON | 2026.12.14 - 2027.06.02</p>
                </div>
            </div>
            
            <div id="header-user-info" class="hidden flex items-center space-x-4">
                <div class="text-right">
                    <div id="nav-username" class="font-bold text-sm text-gold-300">--</div>
                    <div id="nav-role-group" class="text-xs text-stone-400 font-mono">--</div>
                </div>
                <button onclick="logout()" class="bg-luxury-800 hover:bg-luxury-700 text-stone-300 text-xs px-3.5 py-2 rounded-xl border border-stone-700 transition shadow">登出</button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 overflow-y-auto relative flex flex-col">
            <div id="view-container" class="flex-1 flex flex-col"></div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Notice Modal -->
    <div id="modal-notice" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-gold-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 id="notice-title" class="text-xl font-serif font-bold text-gold-300 flex items-center gap-2">📢 最新消息公告</h3>
                <button onclick="closeModal('modal-notice')" class="text-stone-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            <div id="notice-content" class="text-stone-300 text-sm leading-relaxed mb-6 bg-luxury-900 p-5 rounded-2xl border border-stone-800">
                載入中...
            </div>
            <div class="text-right">
                <button onclick="closeModal('modal-notice')" class="bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 hover:to-gold-500 text-black px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-gold-500/20 transition">我知道了</button>
            </div>
        </div>
    </div>

    <!-- Tile Detail Modal -->
    <div id="modal-tile-detail" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gold-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 id="tile-modal-title" class="text-lg font-serif font-bold text-gold-300">格子詳情</h3>
                <button onclick="closeModal('modal-tile-detail')" class="text-stone-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            <div id="tile-modal-body" class="text-stone-300 text-sm space-y-3 mb-6 bg-luxury-900 p-4 rounded-2xl border border-stone-800"></div>
            <div class="text-right">
                <button onclick="closeModal('modal-tile-detail')" class="bg-stone-800 hover:bg-stone-700 text-white px-5 py-2 rounded-xl text-sm font-medium">關閉</button>
            </div>
        </div>
    </div>

    <!-- Reward Modal -->
    <div id="modal-reward-alert" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl max-w-sm w-full p-8 shadow-2xl text-center border border-gold-500/40">
            <div class="text-6xl mb-3 animate-bounce">🏆</div>
            <h3 class="text-2xl font-serif font-bold gold-gradient-text mb-2">踩格子戰報</h3>
            <p id="reward-alert-text" class="text-stone-300 text-sm mb-6">恭喜獲得豐富大獎！</p>
            <button onclick="closeModal('modal-reward-alert')" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-3 rounded-xl font-bold transition shadow-lg shadow-gold-500/20">太棒了</button>
        </div>
    </div>

    <!-- Approval Notification Modal -->
    <div id="modal-approval-notify" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl max-w-sm w-full p-8 shadow-2xl text-center border border-gold-500/40">
            <div class="text-6xl mb-3 animate-pulse">✨</div>
            <h3 class="text-2xl font-serif font-bold gold-gradient-text mb-2">審核通過通知</h3>
            <p id="approval-notify-text" class="text-stone-300 text-sm mb-6">您的成績申報已通過審核！</p>
            <button onclick="closeModal('modal-approval-notify')" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-3 rounded-xl font-bold transition">確認收到</button>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="modal-forgot" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gold-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-serif font-bold text-gold-300">🔑 忘記密碼查詢</h3>
                <button onclick="closeModal('modal-forgot')" class="text-stone-400 hover:text-white font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-stone-400 mb-1">註冊帳號</label>
                    <input type="text" id="forgot-username" class="w-full px-4 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="輸入註冊帳號">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-400 mb-1">電子信箱</label>
                    <input type="email" id="forgot-email" class="w-full px-4 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="your@email.com">
                </div>
                <div id="forgot-result-box" class="hidden p-3 bg-luxury-900 rounded-xl text-sm text-gold-300 font-mono text-center border border-gold-500/30">
                    您的密碼為：<span id="forgot-password-display" class="font-bold text-white"></span>
                </div>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal('modal-forgot')" class="px-4 py-2 bg-stone-800 text-stone-300 rounded-xl text-sm font-medium">取消</button>
                <button onclick="handleForgotPassword()" class="px-4 py-2 bg-gold-500 hover:bg-gold-400 text-black rounded-xl text-sm font-bold">查詢密碼</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if (type === 'dice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'reward' || type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        function triggerVibration() {
            if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
        }

        const DEFAULT_TILES = Array.from({ length: 30 }, (_, i) => ({
            id: i + 1,
            name: i === 0 ? '起點 尊榮豐收站' : `第 ${i + 1} 格：菁英站`,
            type: i % 5 === 0 ? 'bonus' : (i % 3 === 0 ? 'challenge' : 'normal'),
            icon: i % 5 === 0 ? '👑' : (i % 3 === 0 ? '⚡' : '💼'),
            rewardDesc: `獲得隨機 5~15 點業務積分與尊榮抽獎券！`,
            desc: `這是充滿機遇與高額獎勵的第 ${i + 1} 格，停駐可獲得豐厚加成。`
        }));

        const DEFAULT_TAGS = {
            'FYC': { name: 'FYC 業績', rate: 1000, points: 1, desc: '1,000 FYC = 1 P' },
            '活動邀約': { name: '活動邀約', points: 2, desc: '每次申報固定點數' },
            '增員面談': { name: '增員面談', points: 3, desc: '每次申報固定點數' },
            '新夥伴公司考': { name: '新夥伴公司考', points: 5, desc: '每次申報固定點數' },
            '新夥伴外部考': { name: '新夥伴外部考', points: 4, desc: '每次申報固定點數' },
            '新夥伴報聘': { name: '新夥伴報聘', points: 10, desc: '每次申報固定點數' }
        };

        function getDB() {
            try {
                let dbStr = localStorage.getItem('competition_tycoon_db');
                if (!dbStr) {
                    const db = {
                        users: [
                            { username: 'admin', password: 'admin', name: '總指揮官', role: '業務經理', group: '指揮中心', email: 'admin@tycoon.com', fyc: 0, points: 100, diceCount: 10, position: 1, upline: '', buffs: [], isAdmin: true }
                        ],
                        pendingSubmissions: [],
                        rewardsLog: [],
                        marqueenMessages: [
                            '👑 歡迎登入競賽大亨黑金戰情室 (2026/12/14 ~ 2027/06/02)',
                            '💡 提示：提交 FYC 業績自動以 1,000 FYC = 1 P 換算點數！每次擲骰消耗 10 點！',
                            '🎯 挑戰大富翁棋盤與增員 Buff 裂變，爭奪年度巔峰大亨寶座！'
                        ],
                        notice: {
                            title: '👑 競賽大亨尊榮啟動公告',
                            content: '歡迎各位菁英夥伴迎向半年期衝刺！請確實透過下方表單申報業績、邀約與增員面談，每消耗 10 點可兌換一次幸運骰子前進棋盤！',
                            active: true
                        },
                        tiles: DEFAULT_TILES,
                        tags: DEFAULT_TAGS,
                        adminPassword: 'admin'
                    };
                    localStorage.setItem('competition_tycoon_db', JSON.stringify(db));
                    return db;
                }
                return JSON.parse(dbStr);
            } catch (e) {
                return {
                    users: [{ username: 'admin', password: 'admin', name: '總指揮官', isAdmin: true }],
                    pendingSubmissions: [], rewardsLog: [], marqueenMessages: [], notice: {}, tiles: DEFAULT_TILES, tags: DEFAULT_TAGS, adminPassword: 'admin'
                };
            }
        }

        function saveDB(db) {
            localStorage.setItem('competition_tycoon_db', JSON.stringify(db));
        }

        let currentUser = null;
        try {
            currentUser = JSON.parse(sessionStorage.getItem('tycoon_current_user')) || null;
        } catch (e) {
            currentUser = null;
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        function updateOnlineStatus() {
            const banner = document.getElementById('network-banner');
            if (!banner) return;
            if (!navigator.onLine) banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }
        updateOnlineStatus();

        function showModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

        function initApp() {
            const container = document.getElementById('view-container');
            const headerUser = document.getElementById('header-user-info');
            if (!container) return;

            if (!currentUser) {
                if (headerUser) headerUser.classList.add('hidden');
                renderAuthView(container);
            } else {
                if (headerUser) headerUser.classList.remove('hidden');
                const navUser = document.getElementById('nav-username');
                const navRole = document.getElementById('nav-role-group');
                if (navUser) navUser.innerText = currentUser.name || '';
                if (navRole) navRole.innerText = `${currentUser.role || '業務專員'} | ${currentUser.group || ''}`;
                
                if (currentUser.isAdmin || currentUser.username === 'admin') {
                    renderAdminView(container);
                } else {
                    renderPartnerView(container);
                }
            }
        }

        function renderAuthView(container) {
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-luxury-950 via-luxury-900 to-black">
                    <div class="glass-card rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gold-500/35">
                        <div class="text-center mb-6">
                            <span class="text-5xl bg-luxury-800 p-3.5 rounded-2xl inline-block mb-3 shadow-lg border border-gold-500/20">👑</span>
                            <h2 class="text-3xl font-serif font-black gold-gradient-text tracking-wider">競賽大亨</h2>
                            <p class="text-xs text-stone-400 mt-1 font-mono">Competition Tycoon 奢華商戰雙軌競賽</p>
                        </div>

                        <div class="flex rounded-xl bg-luxury-900 p-1 mb-6 text-sm font-medium border border-stone-800">
                            <button onclick="switchAuthTab('login')" id="tab-login-btn" class="flex-1 py-2 rounded-lg bg-gold-500 text-black font-bold transition">登入系統</button>
                            <button onclick="switchAuthTab('register')" id="tab-reg-btn" class="flex-1 py-2 rounded-lg text-stone-400 transition">立即註冊</button>
                        </div>

                        <!-- Login Form -->
                        <div id="form-login" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">帳號 / 姓名</label>
                                <input type="text" id="login-user" class="w-full px-4 py-3 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="請輸入帳號">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">密碼</label>
                                <input type="password" id="login-pass" class="w-full px-4 py-3 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="請輸入密碼">
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <label class="flex items-center text-stone-400"><input type="checkbox" class="mr-1.5 rounded bg-luxury-900 border-stone-700">記住我</label>
                                <button onclick="showModal('modal-forgot')" type="button" class="text-gold-400 hover:underline">忘記密碼？</button>
                            </div>
                            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-3.5 rounded-xl font-bold shadow-lg shadow-gold-500/20 transition">進入戰情室</button>
                        </div>

                        <!-- Register Form -->
                        <div id="form-register" class="space-y-3.5 hidden">
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">真實姓名</label>
                                <input type="text" id="reg-name" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none focus:ring-2 focus:ring-gold-500" placeholder="例如：王大明">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">職級</label>
                                    <select id="reg-role" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">隸屬組別</label>
                                    <input type="text" id="reg-group" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none" placeholder="例如：A組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">註冊帳號</label>
                                <input type="text" id="reg-username" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none" placeholder="設定登入帳號">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">電子信箱 (用於尋回密碼)</label>
                                <input type="email" id="reg-email" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none" placeholder="your@email.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">密碼</label>
                                <input type="password" id="reg-pass" class="w-full px-3 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white outline-none" placeholder="設定登入密碼">
                            </div>
                            <button onclick="handleRegister()" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-3.5 rounded-xl font-bold shadow-lg shadow-gold-500/20 transition mt-2">完成註冊並登入</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-reg-btn');
            if (!loginForm || !regForm) return;
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                if(loginBtn) loginBtn.className = 'flex-1 py-2 rounded-lg bg-gold-500 text-black font-bold transition';
                if(regBtn) regBtn.className = 'flex-1 py-2 rounded-lg text-stone-400 transition';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                if(regBtn) regBtn.className = 'flex-1 py-2 rounded-lg bg-gold-500 text-black font-bold transition';
                if(loginBtn) loginBtn.className = 'flex-1 py-2 rounded-lg text-stone-400 transition';
            }
        }

        function handleLogin() {
            const u = document.getElementById('login-user')?.value.trim();
            const p = document.getElementById('login-pass')?.value.trim();
            const db = getDB();

            if (u === 'admin' && p === db.adminPassword) {
                currentUser = db.users.find(x => x.username === 'admin') || { username: 'admin', name: '總指揮官', isAdmin: true };
                sessionStorage.setItem('tycoon_current_user', JSON.stringify(currentUser));
                initApp();
                return;
            }

            const found = db.users.find(x => x.username === u && x.password === p);
            if (found) {
                currentUser = found;
                sessionStorage.setItem('tycoon_current_user', JSON.stringify(currentUser));
                initApp();
                if (db.notice && db.notice.active) showModal('modal-notice');
            } else {
                alert('帳號或密碼錯誤！');
            }
        }

        function handleRegister() {
            const name = document.getElementById('reg-name')?.value.trim();
            const role = document.getElementById('reg-role')?.value;
            const group = document.getElementById('reg-group')?.value.trim();
            const username = document.getElementById('reg-username')?.value.trim();
            const email = document.getElementById('reg-email')?.value.trim();

        function rollDice() {
            if ((currentUser.points || 0) < 10) {
                alert('可用點數不足 10 點，無法擲骰子！');
                return;
            }

            const db = getDB();
            const userIdx = db.users.findIndex(x => x.username === currentUser.username);
            db.users[userIdx].points -= 10;
            currentUser = db.users[userIdx];
            saveDB(db);
            initApp();

            playSound('dice');
            triggerVibration();

            const diceBox = document.getElementById('dice-container');
            const visual = document.getElementById('dice-visual');
            if (diceBox) diceBox.classList.remove('hidden');

            let count = 0;
            const rollInterval = setInterval(() => {
                const tempNum = Math.floor(Math.random() * 6) + 1;
                if (visual) {
                    visual.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][tempNum - 1];
                    visual.style.transform = `rotate(${Math.random() * 360}deg)`;
                }
                count++;
                if (count > 10) {
                    clearInterval(rollInterval);
                    const finalRoll = Math.floor(Math.random() * 6) + 1;
                    if (visual) {
                        visual.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][finalRoll - 1];
                        visual.style.transform = 'rotate(0deg)';
                    }

                    let newPos = (currentUser.position || 1) + finalRoll;
                    if (newPos > 30) newPos = newPos - 30;

                    currentUser.position = newPos;
                    db.users[userIdx].position = newPos;

                    const rewardPoints = finalRoll * 5;
                    currentUser.points += rewardPoints;
                    db.users[userIdx].points = currentUser.points;

                    const rewardText = `踩中第 ${newPos} 格，獲得 ${rewardPoints} 點與尊榮抽獎券！`;
                    db.rewardsLog.push({
                        username: currentUser.username,
                        name: currentUser.name,
                        reward: rewardText,
                        time: new Date().toLocaleString()
                    });

                    saveDB(db);
                    playSound('reward');

                    if (diceBox) diceBox.classList.add('hidden');
                    const alertText = document.getElementById('reward-alert-text');
                    if (alertText) alertText.innerText = `擲出 ${finalRoll} 點！前進至第 ${newPos} 格，${rewardText}`;
                    showModal('modal-reward-alert');
                    initApp();
                }
            }, 100);
        }

        function approveSubmission(subId) {
            const db = getDB();
            const subIdx = db.pendingSubmissions.findIndex(x => x.id === subId);
            if (subIdx === -1) return;
            const sub = db.pendingSubmissions[subIdx];

            const userIdx = db.users.findIndex(x => x.username === sub.username);
            if (userIdx !== -1) {
                let addPoints = 0;
                let addDice = 1;
                if (sub.tag === 'FYC') {
                    addPoints = Math.floor(sub.fycVal / 1000);
                    db.users[userIdx].fyc = (db.users[userIdx].fyc || 0) + sub.fycVal;
                } else {
                    addPoints = db.tags[sub.tag]?.points || 2;
                }
                db.users[userIdx].points = (db.users[userIdx].points || 0) + addPoints;
                db.users[userIdx].diceCount = (db.users[userIdx].diceCount || 0) + addDice;
            }

            sub.status = 'approved';
            if (!db.marqueenMessages) db.marqueenMessages = [];
            db.marqueenMessages.unshift(`👑 恭喜 ${sub.name} 通過 ${sub.tag} 審核獲得尊榮點數！`);
            saveDB(db);

            try {
                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

            playSound('success');
            
            const notifyText = document.getElementById('approval-notify-text');
            if (notifyText) notifyText.innerText = `您的 ${sub.tag} 申報已通過！獲得點數與骰子機會！`;
            showModal('modal-approval-notify');
            initApp();
        }

                            </thead>
                            <tbody class="divide-y divide-stone-800">
                                ${db.users.map(u => {
                                    let buffTotal = 0;
                                    if (u.buffs) {
                                        u.buffs.forEach(bName => {
                                            const tUser = db.users.find(x => x.name === bName || x.username === bName);
                                            if (tUser) buffTotal += (tUser.fyc || 0);
                                        });
                                    }
                                    const totalDisplayFYC = (u.fyc || 0) + buffTotal;
                                    return `
                                        <tr>
                                            <td class="p-4 font-bold text-white">${u.name} <span class="text-xs text-stone-400 font-normal">(${u.username})</span></td>
                                            <td class="p-4 text-stone-300">${u.role || '業務專員'} <span class="text-xs bg-luxury-800 text-gold-300 px-2 py-0.5 rounded ml-1 border border-gold-500/20">${u.group}</span></td>
                                            <td class="p-4 font-serif text-gold-400 font-bold">${totalDisplayFYC} <span class="text-[10px] text-stone-400 font-normal">(個人:${u.fyc\vert{}\vert{}0}+Buff:${buffTotal})</span></td>
                                            <td class="p-4 text-stone-300">${u.points \vert{}\vert{} 0} P / ${u.diceCount || 0} 骰</td>
                                            <td class="p-4 text-right space-x-2">
                                                <button onclick="editUser('${u.username}')" class="bg-luxury-800 hover:bg-luxury-700 text-stone-200 px-3 py-1 rounded-lg text-xs font-medium border border-stone-700">編輯/Buff</button>
                                                ${u.username !== 'admin' ? `<button onclick="deleteUser('${u.username}')" class="bg-red-950 hover:bg-red-900 text-red-300 px-3 py-1 rounded-lg text-xs font-medium border border-red-800">刪除</button>` : ''}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function editUser(username) {
            const db = getDB();
            const u = db.users.find(x => x.username === username);
            if (!u) return;

            const allUsers = db.users.filter(x => x.username !== username);
            const currentBuffs = u.buffs || [];

            let modalHtml = `
                <div id="modal-edit-user" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-card rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-gold-500/40 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-serif font-bold text-gold-300">⚙️ 編輯夥伴資料與業績 Buff</h3>
                            <button onclick="document.getElementById('modal-edit-user').remove()" class="text-stone-400 hover:text-white font-bold text-xl">&times;</button>
                        </div>
                        <div class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">真實姓名</label>
                                <input type="text" id="edit-name" value="${u.name}" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">職級</label>
                                    <select id="edit-role" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                                        <option value="業務專員" ${u.role==='業務專員'?'selected':''}>業務專員</option>
                                        <option value="業務主任" ${u.role==='業務主任'?'selected':''}>業務主任</option>
                                        <option value="業務襄理" ${u.role==='業務襄理'?'selected':''}>業務襄理</option>
                                        <option value="業務經理" ${u.role==='業務經理'?'selected':''}>業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">組別</label>
                                    <input type="text" id="edit-group" value="${u.group}" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">FYC 總額</label>
                                    <input type="number" id="edit-fyc" value="${u.fyc || 0}" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">可用點數</label>
                                    <input type="number" id="edit-points" value="${u.points || 0}" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-400 mb-1">骰子數</label>
                                    <input type="number" id="edit-dice" value="${u.diceCount || 0}" class="w-full px-3 py-2 bg-luxury-900 border border-stone-700 rounded-xl text-white">
                                </div>
                            </div>
                            
                            <div class="border-t border-stone-800 pt-3">
                                <label class="block text-xs font-bold text-gold-300 mb-2">⚡ 業績 Buff (勾選被增員夥伴，其業績將同步加入此人)</label>
                                <div class="space-y-1.5 max-h-40 overflow-y-auto bg-luxury-900 p-3 rounded-xl border border-stone-800">
                                    ${allUsers.length === 0 ? '<p class="text-xs text-stone-500">目前沒有其他夥伴可供勾選</p>' : allUsers.map(au => `
                                        <label class="flex items-center space-x-2 text-xs text-stone-300 cursor-pointer hover:text-white">
                                            <input type="checkbox" name="buff-user" value="${au.name}" ${currentBuffs.includes(au.name)?'checked':''} class="rounded bg-luxury-800 border-stone-700 text-gold-500 focus:ring-gold-500">
                                            <span>${au.name} (${au.group} / FYC:${au.fyc || 0})</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>

                        </div>
                        <div class="flex justify-end space-x-2 mt-6">
                            <button onclick="document.getElementById('modal-edit-user').remove()" class="px-4 py-2 bg-stone-800 text-stone-300 rounded-xl text-sm">取消</button>
                            <button onclick="saveEditedUser('${username}')" class="px-5 py-2 bg-gold-500 hover:bg-gold-400 text-black rounded-xl text-sm font-bold shadow">儲存變更</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function saveEditedUser(username) {
            const db = getDB();
            const u = db.users.find(x => x.username === username);
            if (!u) return;

            u.name = document.getElementById('edit-name').value.trim();
            u.role = document.getElementById('edit-role').value;
            u.group = document.getElementById('edit-group').value.trim();
            u.fyc = parseInt(document.getElementById('edit-fyc').value) || 0;
            u.points = parseInt(document.getElementById('edit-points').value) || 0;
            u.diceCount = parseInt(document.getElementById('edit-dice').value) || 0;

            const checkboxes = document.querySelectorAll('input[name="buff-user"]:checked');
            u.buffs = Array.from(checkboxes).map(cb => cb.value);

            saveDB(db);
            const modal = document.getElementById('modal-edit-user');
            if (modal) modal.remove();
            alert('夥伴資料與業績 Buff 更新成功！');
            initApp();
        }

        function deleteUser(username) {
            const db = getDB();
            const target = db.users.find(x => x.username === username);
            const targetName = target ? target.name : username;

            if (confirm(`確定要刪除夥伴「${targetName}」嗎？刪除後無法復原。`)) {
                db.users = db.users.filter(x => x.username !== username);
                saveDB(db);
                alert('夥伴名單已成功刪除！');
                initApp();
            }
        }

        function renderAdminSettings(db) {
            return `
                <div class="space-y-6 max-w-4xl">
                    <div class="glass-card p-6 rounded-2xl border border-gold-500/25 shadow-xl space-y-4">
                        <h3 class="font-serif font-bold text-lg text-gold-300">🎮 遊戲核心點數設定</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">FYC 換算比例 (多少 FYC = 1 P)</label>
                                <input type="number" id="setting-fyc-rate" value="${db.tags['FYC'].rate}" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">
                            </div>
                        </div>
                        <button onclick="saveAdminSettings()" class="bg-gold-500 hover:bg-gold-400 text-black px-5 py-2.5 rounded-xl text-sm font-bold shadow">儲存核心設定</button>
                    </div>

                    <div class="glass-card p-6 rounded-2xl border border-gold-500/25 shadow-xl space-y-4">
                        <h3 class="font-serif font-bold text-lg text-gold-300">➕ 新增獲點方式 / 任務 Tag</h3>
                        <p class="text-xs text-stone-400">在此新增自定義任務或項目，設定其固定點數，夥伴端申報選單將同步更新。</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">任務名稱 (Tag)</label>
                                <input type="text" id="new-tag-name" placeholder="例如：直播分享" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-400 mb-1">換算點數 / 固定點數</label>
                                <input type="number" id="new-tag-points" placeholder="例如：5" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">
                            </div>
                            <div class="flex items-end">
                                <button onclick="addNewTag()" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-2.5 rounded-xl text-sm font-bold shadow">新增任務 Tag</button>
                            </div>
                        </div>

                        <div class="mt-4 border-t border-stone-800 pt-4">
                            <h4 class="text-xs font-bold text-stone-300 mb-2">現有任務清單</h4>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                ${Object.keys(db.tags).map(tagName => {
                                    const t = db.tags[tagName];
                                    return `
                                        <div class="flex justify-between items-center p-2.5 bg-luxury-900 rounded-xl text-xs border border-stone-800">
                                            <div>
                                                <span class="font-bold text-gold-400">${tagName}</span>
                                                <span class="text-stone-400 ml-2">${tagName === 'FYC' ? '比例: 1000 FYC = 1 P' : '固定點數: ' + t.points + ' 點'}</span>
                                            </div>
                                            ${tagName !== 'FYC' ? `<button onclick="deleteTag('${tagName}')" class="text-red-400 hover:text-red-300 text-xs">刪除</button>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveAdminSettings() {
            const db = getDB();
            const rateInput = document.getElementById('setting-fyc-rate');
            if (rateInput) {
                db.tags['FYC'].rate = parseInt(rateInput.value) || 1000;
                saveDB(db);
                alert('核心遊戲設定儲存成功！');
            }
        }

        function addNewTag() {
            const nameInput = document.getElementById('new-tag-name');
            const pointsInput = document.getElementById('new-tag-points');
            if (!nameInput || !pointsInput) return;
            const name = nameInput.value.trim();
            const points = parseInt(pointsInput.value) || 0;

            if (!name) {
                alert('請輸入任務名稱！');
                return;
            }

            const db = getDB();
            db.tags[name] = { name: name, points: points, desc: '每次申報固定點數' };
            saveDB(db);
            alert(`成功新增任務 Tag：「${name}」（固定 ${points} 點）！`);
            setAdminTab('settings');
        }

        function deleteTag(tagName) {
            const db = getDB();
            delete db.tags[tagName];
            saveDB(db);
            alert('任務 Tag 已刪除！');
            setAdminTab('settings');
        }

        function renderAdminRewards(db) {
            return `
                <div class="space-y-4">
                    <h3 class="font-serif font-bold text-lg text-gold-300">使用者獎勵與踩格紀錄統整</h3>
                    <div class="glass-card rounded-2xl shadow-xl border border-gold-500/20 overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-luxury-900 border-b border-stone-800 text-stone-400 text-xs">
                                <tr>
                                    <th class="p-4">夥伴姓名</th>
                                    <th class="p-4">獲得獎勵與實體贈品</th>
                                    <th class="p-4">時間</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-800">
                                ${(db.rewardsLog || []).map(r => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">${r.name}</td>
                                        <td class="p-4 text-gold-400 font-medium">${r.reward}</td>
                                        <td class="p-4 text-xs text-stone-500">${r.time}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderAdminUpdate(db) {
            return `
                <div class="space-y-6 max-w-3xl">
                    <div class="glass-card p-6 rounded-2xl border border-gold-500/20 shadow-xl space-y-4">
                        <h3 class="font-serif font-bold text-lg text-gold-300">📢 公告與戰報跑馬燈編輯</h3>
                        <div>
                            <label class="block text-xs font-semibold text-stone-400 mb-1">最新消息公告標題</label>
                            <input type="text" id="admin-notice-title" value="${db.notice ? db.notice.title : ''}" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-stone-400 mb-1">公告詳細內容</label>
                            <textarea id="admin-notice-content" rows="4" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">${db.notice ? db.notice.content : ''}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-stone-400 mb-1">跑馬燈戰報訊息 (每行一條)</label>
                            <textarea id="admin-marquee-content" rows="3" class="w-full px-3.5 py-2.5 bg-luxury-900 border border-stone-700 rounded-xl text-sm text-white">${(db.marqueenMessages || []).join('\n')}</textarea>
                        </div>
                        <button onclick="saveNoticeAndMarquee()" class="bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black px-5 py-3 rounded-xl text-sm font-bold shadow-lg shadow-gold-500/20">發布更新並同步所有使用者</button>
                    </div>
                </div>
            `;
        }

        function saveNoticeAndMarquee() {
            const db = getDB();
            const titleEl = document.getElementById('admin-notice-title');
            const contentEl = document.getElementById('admin-notice-content');
            const marqueeEl = document.getElementById('admin-marquee-content');
            if (titleEl && contentEl && marqueeEl) {
                if (!db.notice) db.notice = {};
                db.notice.title = titleEl.value;
                db.notice.content = contentEl.value;
                db.notice.active = true;
                db.marqueenMessages = marqueeEl.value.split('\n').filter(x => x.trim() !== '');
                saveDB(db);
                alert('軟體版本熱更新已送出，所有使用者畫面已同步！');
            }
        }

        function renderAdminSandbox(db) {
            return `
                <div class="space-y-4">
                    <h3 class="font-serif font-bold text-lg text-gold-300">Sandbox 程式碼預覽與測試</h3>
                    <div class="bg-black text-gold-400 p-5 rounded-2xl font-mono text-xs overflow-x-auto border border-gold-500/30 shadow-inner">
                        <p>// 當前版本運行狀態：完整功能整合版穩定運行中</p>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            initApp();
            const db = getDB();
            if (currentUser && db.notice && db.notice.active && !currentUser.isAdmin) {
                showModal('modal-notice');
            }
        };
    </script>
</body>
</html>
