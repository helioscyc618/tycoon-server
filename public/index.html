<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 | Competition Tycoon (雲端同步版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Noto Serif TC (明體) & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Google 雲端即時同步資料庫) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: { 50: '#fdf2f2', 100: '#fde8e8', 600: '#b91c1c', 700: '#990000', 800: '#7f1d1d', 900: '#650000' },
                        gold: { 100: '#fef9c3', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', rich: '#D4AF37' },
                        cream: '#FFF8F0'
                    },
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; background-color: #FFF8F0; }
        .ming-title { font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b91c1c; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 28s linear infinite; }
    </style>
</head>
<body class="h-full flex flex-col text-gray-800 bg-cream" x-data="app()" x-init="init()">

    <!-- TOP BAR -->
    <header class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 text-gold-300 px-4 py-2 shadow-md flex flex-wrap justify-between items-center text-xs sm:text-sm border-b-2 border-gold-rich">
        <div class="flex items-center space-x-3">
            <span class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium" :class="isOnline ? 'bg-green-900/60 text-green-200 border border-green-500' : 'bg-red-900/80 text-red-200 border border-red-500 animate-pulse'">
                <i class="fas" :class="isOnline ? 'fa-cloud-arrow-up' : 'fa-triangle-exclamation'"></i>
                <span x-text="isOnline ? '雲端同步正常 (Cloud Live)' : '離線警告 (Offline)'"></span>
            </span>
            <span class="hidden md:inline-flex items-center text-gold-100">
                <i class="fas fa-clock mr-1 text-gold-400"></i> 台北時間: <span class="font-mono ml-1 font-bold text-white" x-text="ntpTime"></span>
            </span>
        </div>
        <div class="flex items-center space-x-3 mt-1 sm:mt-0">
            <span class="font-serif tracking-wider text-gold-300 font-semibold hidden sm:inline"><i class="fas fa-dice text-gold-400 mr-1"></i> 競賽期間: 2026/12/14 ~ 2027/06/02</span>
            <template x-if="currentUser">
                <div class="flex items-center space-x-2 bg-black/30 px-3 py-1 rounded-full border border-gold-rich/40">
                    <span x-text="currentUser.avatar" class="text-base"></span>
                    <span class="text-white font-medium" x-text="currentUser.name"></span>
                    <span class="text-xs px-1.5 py-0.5 bg-gold-600 text-white rounded font-bold" x-text="currentUser.rank"></span>
                    <button @click="logout()" class="text-red-300 hover:text-white ml-2 text-xs"><i class="fas fa-sign-out-alt"></i> 登出</button>
                </div>
            </template>
            <button @click="openAdminModal = true" class="bg-gold-rich hover:bg-gold-600 text-ruby-900 font-bold px-3 py-1 rounded shadow text-xs transition flex items-center space-x-1">
                <i class="fas fa-shield-halved"></i>
                <span>指揮中心後台</span>
            </button>
        </div>
    </header>

    <!-- RUNNING TICKER -->
    <div class="bg-ruby-800 text-gold-300 py-2 px-3 overflow-hidden whitespace-nowrap border-b border-gold-rich/30 relative flex items-center shadow-inner">
        <div class="bg-gold-rich text-ruby-900 font-bold px-2.5 py-0.5 rounded text-xs mr-3 z-10 flex items-center shadow">
            <i class="fas fa-bullhorn mr-1"></i> 戰報
        </div>
        <div class="overflow-hidden w-full relative">
            <div class="animate-marquee inline-block text-xs sm:text-sm font-medium tracking-wide">
                <span x-text="settings.tickerText"></span>
                <span class="mx-6 text-gold-400">♦</span>
                <span>🔥 賀！雲端雙軌競賽即時連線中，全團隊業績與增員成長秒速同步！</span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full">
        <!-- AUTH VIEW -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border-2 border-gold-rich/50 my-6">
                <div class="bg-gradient-to-r from-ruby-900 via-ruby-700 to-ruby-900 p-6 text-center text-white relative">
                    <div class="w-16 h-16 bg-gold-rich text-ruby-900 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg border-2 border-white text-2xl">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h1 class="text-3xl font-bold ming-title tracking-wider text-gold-300">競賽大亨</h1>
                    <p class="text-xs text-gold-100 mt-1 tracking-widest font-serif">Cloud Edition 2026-2027</p>
                </div>
                <div class="flex border-b border-gray-200 bg-gray-50 text-sm font-semibold">
                    <button @click="authTab = 'login'" class="flex-1 py-3 text-center transition" :class="authTab === 'login' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500'">登入系統</button>
                    <button @click="authTab = 'register'" class="flex-1 py-3 text-center transition" :class="authTab === 'register' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500'">新夥伴註冊</button>
                    <button @click="authTab = 'forgot'" class="flex-1 py-3 text-center transition" :class="authTab === 'forgot' ? 'bg-white text-ruby-800 border-b-2 border-ruby-700' : 'text-gray-500'">忘記密碼</button>
                </div>
                <div class="p-6 space-y-4">
                    <template x-if="authTab === 'login'">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱或姓名</label>
                                <input type="text" x-model="loginForm.account" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名或 Email">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-ruby-700 to-ruby-800 text-gold-300 font-bold py-3 rounded-lg shadow transition">進入戰情室</button>
                        </form>
                    </template>

                    <template x-if="authTab === 'register'">
                        <form @submit.prevent="register()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">真實姓名</label>
                                <input type="text" x-model="regForm.name" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱</label>
                                <input type="email" x-model="regForm.email" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="example@mail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">密碼</label>
                                <input type="password" x-model="regForm.password" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="設定登入密碼">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">職級</label>
                                    <select x-model="regForm.rank" class="w-full px-2 py-2 border rounded-lg text-sm bg-white">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">隸屬組別</label>
                                    <input type="text" x-model="regForm.group" required class="w-full px-2 py-2 border rounded-lg text-sm" placeholder="預設：OO組">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">選擇個人頭貼 Icon (10選1)</label>
                                <div class="grid grid-cols-5 gap-2 mt-1">
                                    <template x-for="av in avatarList" :key="av">
                                        <button type="button" @click="regForm.avatar = av" class="p-2 text-2xl rounded-lg border text-center transition flex items-center justify-center" :class="regForm.avatar === av ? 'border-ruby-700 bg-ruby-50 ring-2 ring-ruby-600 scale-105' : 'border-gray-200'" x-text="av"></button>
                                    </template>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-gold-600 to-gold-500 text-ruby-900 font-bold py-3 rounded-lg shadow transition mt-2">立即註冊 (雲端同步)</button>
                        </form>
                    </template>

                    <template x-if="authTab === 'forgot'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">註冊姓名</label>
                                <input type="text" x-model="forgotForm.name" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入姓名">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">電子信箱</label>
                                <input type="email" x-model="forgotForm.email" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請輸入註冊 Email">
                            </div>
                            <button @click="findPassword()" class="w-full bg-ruby-800 text-white font-bold py-2.5 rounded-lg shadow text-sm">查詢密碼</button>
                            <template x-if="forgotResult">
                                <div class="p-3 bg-gold-100 border border-gold-400 rounded-lg text-center">
                                    <p class="text-xs text-gray-600">查詢結果：</p>
                                    <p class="text-base font-bold text-ruby-900 mt-1" x-text="forgotResult"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- WAR ROOM VIEW -->
        <template x-if="currentUser">
            <div class="space-y-6">
                <div class="bg-gradient-to-br from-white via-cream to-gold-100 rounded-2xl p-5 shadow-lg border border-gold-rich/40 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-ruby-800 text-gold-300 rounded-2xl flex items-center justify-center text-3xl shadow-md border-2 border-gold-rich" x-text="currentUser.avatar"></div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h2 class="text-xl font-bold ming-title text-ruby-900" x-text="currentUser.name"></h2>
                                <span class="px-2 py-0.5 bg-ruby-700 text-white text-xs rounded-full font-semibold" x-text="currentUser.rank"></span>
                                <span class="px-2 py-0.5 bg-gold-600 text-white text-xs rounded-full font-semibold" x-text="currentUser.group"></span>
                            </div>
                            <p class="text-xs text-gray-600 mt-1">歡迎來到競賽大亨雲端戰情室！所有數據即時連線同步中。</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-3 text-center w-full md:w-auto">
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">FYC 總額</span>
                            <span class="text-lg font-bold text-ruby-800" x-text="formatCurrency(getTotalFYC(currentUser))"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">可用點數</span>
                            <span class="text-lg font-bold text-gold-600" x-text="currentUser.points"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">累積點數</span>
                            <span class="text-lg font-bold text-gray-800" x-text="currentUser.totalPoints"></span>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border border-gold-300">
                            <span class="block text-xs text-gray-500 font-medium">骰子次數</span>
                            <span class="text-lg font-bold text-ruby-700" x-text="currentUser.diceCount"></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-5 space-y-6">
                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center">
                                <i class="fas fa-file-invoice-dollar text-gold-600 mr-2"></i> 成績申報與 Tag 任務提交
                            </h3>
                            <form @submit.prevent="submitDeclaration()" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">選擇任務 / Tag 類型</label>
                                    <select x-model="declForm.tag" @change="onTagChange()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                                        <template x-for="t in settings.tags" :key="t.name">
                                            <option :value="t.name" x-text="t.name + (t.isFYC ? ' (自動比例換算)' : ' (固定點數: ' + t.points + '點)')"></option>
                                        </template>
                                    </select>
                                </div>
                                <template x-if="isFYCTag">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">輸入 FYC 金額</label>
                                        <input type="number" x-model.number="declForm.fycAmount" min="0" step="100" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="例如：10000">
                                    </div>
                                </template>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">任務說明 / 備註 <span class="text-red-600">* (必填)</span></label>
                                    <input type="text" x-model="declForm.desc" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="請詳細填寫拜訪對象或案號...">
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-ruby-700 to-ruby-800 text-white font-bold py-2.5 rounded-lg shadow text-sm">送出審核申報</button>
                            </form>
                        </div>

                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-users text-gold-600 mr-2"></i> 同組夥伴狀況 (雲端即時)</span>
                                <span class="text-xs bg-gold-100 text-ruby-900 px-2 py-0.5 rounded font-bold" x-text="currentUser.group"></span>
                            </h3>
                            <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                                <template x-for="p in getGroupPartners()" :key="p.email">
                                    <div class="flex items-center justify-between p-2 rounded-lg bg-gray-50 border text-xs">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-lg" x-text="p.avatar"></span>
                                            <div>
                                                <p class="font-bold text-gray-800" x-text="p.name"></p>
                                                <p class="text-[10px] text-gray-500" x-text="p.rank"></p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="font-bold text-ruby-800" x-text="formatCurrency(getTotalFYC(p)) + ' FYC'"></p>
                                            <p class="text-[10px] text-gold-600 font-semibold" x-text="p.points + ' 點'"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <h3 class="text-base font-bold text-ruby-900 ming-title mb-3 flex items-center justify-between">
                                <span class="flex items-center"><i class="fas fa-comments text-gold-600 mr-2"></i> 嗆蝦士氣留言板</span>
                            </h3>
                            <form @submit.prevent="postMessage()" class="space-y-2 mb-4 pb-4 border-b">
                                <input type="text" x-model="msgForm.title" required class="w-full px-3 py-1.5 border rounded text-xs" placeholder="留言標題...">
                                <textarea x-model="msgForm.content" required rows="2" class="w-full px-3 py-1.5 border rounded text-xs resize-none" placeholder="激勵內容..."></textarea>
                                <div class="flex justify-between items-center text-xs">
                                    <label class="flex items-center space-x-1 cursor-pointer">
                                        <input type="checkbox" x-model="msgForm.isAnonymous" class="rounded text-ruby-600">
                                        <span class="text-gray-600">匿名發言</span>
                                    </label>
                                    <button type="submit" class="bg-ruby-800 text-white px-4 py-1.5 rounded font-bold text-xs">發布留言</button>
                                </div>
                            </form>
                            <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                                <template x-for="(msg, mKey) in messages" :key="mKey">
                                    <div class="p-3 bg-cream rounded-xl border border-gold-300 text-xs space-y-1.5">
                                        <div class="flex justify-between items-start">
                                            <span class="font-bold text-ruby-900 text-sm" x-text="msg.title"></span>
                                            <span class="text-[10px] text-gray-500" x-text="msg.time"></span>
                                        </div>
                                        <p class="text-gray-700" x-text="msg.content"></p>
                                        <div class="flex justify-between items-center pt-1 text-[11px] text-gray-500">
                                            <span class="font-medium text-gold-700" x-text="'發言人: ' + (msg.isAnonymous ? '神秘夥伴' : msg.author)"></span>
                                            <button @click="likeMessage(mKey)" class="hover:text-ruby-700 flex items-center space-x-1">
                                                <i class="fas fa-thumbs-up text-gold-600"></i>
                                                <span x-text="msg.likes || 0"></span>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-7 space-y-6">
                        <div class="bg-gradient-to-r from-ruby-900 via-ruby-800 to-ruby-900 p-5 rounded-2xl shadow-lg border-2 border-gold-rich text-white flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                <h3 class="text-lg font-bold ming-title text-gold-300"><i class="fas fa-dice text-gold-400 mr-2"></i> 大富翁擲骰推進區</h3>
                                <p class="text-xs text-gold-100 mt-0.5">每次擲骰消耗 <span class="font-bold text-white">10 點</span>。</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <div class="text-center bg-black/40 px-3 py-1.5 rounded-xl border border-gold-rich/40">
                                    <span class="block text-[10px] text-gold-300">目前位置</span>
                                    <span class="text-base font-bold text-white font-mono" x-text="'第 ' + (currentUser.position + 1) + ' 格'"></span>
                                </div>
                                <button @click="rollDice()" :disabled="currentUser.points < 10 || isRolling" class="bg-gradient-to-r from-gold-400 to-gold-600 text-ruby-900 font-bold px-6 py-3 rounded-xl shadow-lg transition text-sm">
                                    <span x-text="isRolling ? '滾動中...' : '立即擲骰 (10點)'"></span>
                                </button>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl p-5 shadow-md border border-gold-rich/30">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-base font-bold text-ruby-900 ming-title"><i class="fas fa-map text-gold-600 mr-2"></i> 30格活潑大富翁棋盤</h3>
                            </div>
                            <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">
                                <template x-for="(cell, index) in settings.boardCells" :key="index">
                                    <div @click="openCellModal(cell, index)" class="relative p-2 rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition hover:scale-105 h-20 text-center shadow-sm" :class="hasPlayerHere(index) ? 'border-ruby-700 bg-ruby-50 ring-2 ring-gold-rich' : 'border-gold-300 bg-cream'">
                                        <span class="absolute top-1 left-1 text-[9px] font-bold text-gray-400 font-mono" x-text="index + 1"></span>
                                        <span class="text-lg mb-1" x-text="cell.icon"></span>
                                        <span class="text-[10px] font-bold text-gray-800 line-clamp-1" x-text="cell.title"></span>
                                        <div class="flex flex-wrap justify-center gap-0.5 mt-1">
                                            <template x-for="p in getPlayersOnCell(index)" :key="p.email">
                                                <span class="text-xs" :title="p.name" x-text="p.avatar"></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- SCRIPT LOGIC (Firebase Realtime Database Integration) -->
    <script>
        // 設定免費的 Firebase 雲端資料庫連線
        const firebaseConfig = {
            databaseURL: "https://competition-tycoon-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function playBeep(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(type === 'success' ? 587.33 : 440, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function app() {
            return {
                isOnline: navigator.onLine,
                ntpTime: '',
                authTab: 'login',
                currentUser: null,
                loginForm: { account: '', password: '' },
                regForm: { name: '', email: '', password: '', rank: '業務專員', group: 'OO組', avatar: '👨‍💼' },
                forgotForm: { name: '', email: '' },
                forgotResult: '',
                avatarList: ['👨‍💼', '👩‍💼', '🧑‍💼', '👨‍💻', '👩‍💻', '🧑‍🎨', '👨‍🎓', '👩‍🎓', '🦸‍♂️', '🦸‍♀️'],
                selectedCell: {}, selectedCellIndex: 0, showCellDetailModal: false, showLandingModal: false, currentLandedCell: {},
                showDiceModal: false, isRolling: false, rollingDiceNumber: 1,
                declForm: { tag: 'FYC', fycAmount: 10000, desc: '' }, isFYCTag: true,
                declarations: {}, messages: {}, openAdminModal: false, adminAuth: false, adminPassInput: '', adminPassword: 'admin', adminTab: 'approvals',
                newTagForm: { name: '', isFYC: false, points: 50 },
                showEditPartnerModal: false, editingPartner: { name: '', rank: '', group: '', fyc: 0, points: 0, diceCount: 0, buffs: [] }, editingKey: null,
                showDeleteConfirmModal: false, deletingKey: null, deletingTarget: null,
                settings: { newsTitle: '🏆 競賽大亨雲端版正式開跑！', newsContent: '所有資料秒速同步，隨時隨地輕鬆衝刺！', tickerText: '🎉 賀！雲端雙軌競賽熱血啟動！', tags: [{name:'FYC', isFYC:true, points:0}, {name:'活動邀約', isFYC:false, points:10}, {name:'增員面談', isFYC:false, points:20}], boardCells: [] },
                rewardsList: {}, showNewsModal: false, showNotificationModal: false, notificationTitle: '', notificationText: '', partners: {},

                init() {
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });

                    const updateTaiwanTime = () => {
                        const now = new Date();
                        const formatter = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                        this.ntpTime = formatter.format(now).replace(/\//g, '-');
                    };
                    updateTaiwanTime();
                    setInterval(updateTaiwanTime, 1000);

                    // 雲端資料即時監聽 (Firebase Realtime Database Sync)
                    db.ref('partners').on('value', snap => { this.partners = snap.val() || {}; this.syncCurrentUser(); });
                    db.ref('declarations').on('value', snap => { this.declarations = snap.val() || {}; });
                    db.ref('messages').on('value', snap => { this.messages = snap.val() || {}; });
                    db.ref('settings').on('value', snap => { if (snap.val()) this.settings = snap.val(); });
                    db.ref('rewards').on('value', snap => { this.rewardsList = snap.val() || {}; });

                    if (!this.settings.boardCells || this.settings.boardCells.length !== 30) {
                        this.initDefaultBoardCells();
                    }

                    const savedUserEmail = localStorage.getItem('tycoon_user_email');
                    if (savedUserEmail) {
                        setTimeout(() => {
                            const found = Object.values(this.partners).find(p => p.email === savedUserEmail);
                            if (found) this.currentUser = found;
                        }, 800);
                    }

                    setTimeout(() => { this.showNewsModal = true; }, 600);
                },

                syncCurrentUser() {
                    if (this.currentUser) {
                        const found = Object.values(this.partners).find(p => p.email === this.currentUser.email);
                        if (found) this.currentUser = found;
                    }
                },

                initDefaultBoardCells() {
                    const templates = [{ title: '起點', icon: '🚩', type: '獎勵', reward: '獲得 20 點！' }, { title: '幸運星', icon: '⭐', type: '獎勵', reward: '獲得 10 點！' }];
                    this.settings.boardCells = [];
                    for (let i = 0; i < 30; i++) {
                        const t = templates[i % templates.length];
                        this.settings.boardCells.push({ title: t.title + ' #' + (i+1), icon: t.icon, type: t.type, reward: t.reward });
                    }
                },

                login() {
                    const list = Object.values(this.partners);
                    const found = list.find(p => p.email === this.loginForm.account || p.name === this.loginForm.account);
                    if (found && found.password === this.loginForm.password) {
                        this.currentUser = found;
                        localStorage.setItem('tycoon_user_email', found.email);
                        playBeep('success');
                        this.showAlert('登入成功', `歡迎回來，${this.currentUser.name}！`);
                    } else {
                        this.showAlert('登入失敗', '帳號或密碼錯誤。');
                    }
                },

                register() {
                    const list = Object.values(this.partners);
                    if (list.some(p => p.email === this.regForm.email)) {
                        this.showAlert('註冊失敗', '此信箱已註冊過！');
                        return;
                    }
                    const newRef = db.ref('partners').push();
                    const newP = {
                        id: newRef.key,
                        name: this.regForm.name,
                        email: this.regForm.email,
                        password: this.regForm.password,
                        rank: this.regForm.rank,
                        group: this.regForm.group || 'OO組',
                        avatar: this.regForm.avatar,
                        fyc: 0, points: 0, totalPoints: 0, diceCount: 0, position: 0, buffs: []
                    };
                    newRef.set(newP);
                    this.currentUser = newP;
                    localStorage.setItem('tycoon_user_email', newP.email);
                    playBeep('success');
                    this.showAlert('註冊成功', '已寫入雲端，起始數為 0！');
                },

                findPassword() {
                    const list = Object.values(this.partners);
                    const found = list.find(p => p.name === this.forgotForm.name && p.email === this.forgotForm.email);
                    this.forgotResult = found ? `您的密碼為：${found.password}` : '找不到符合的紀錄。';
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('tycoon_user_email');
                },

                onTagChange() {
                    const selected = this.settings.tags.find(t => t.name === this.declForm.tag);
                    this.isFYCTag = selected ? selected.isFYC : false;
                },

                submitDeclaration() {
                    if (!this.declForm.desc) { this.showAlert('未填寫', '請填寫任務說明！'); return; }
                    let pts = this.isFYCTag ? Math.floor((this.declForm.fycAmount || 0) / 1000) : 10;
                    const req = {
                        userName: this.currentUser.name, userEmail: this.currentUser.email,
                        tag: this.declForm.tag, details: this.declForm.desc + (this.isFYCTag ? ` ($${this.declForm.fycAmount})` : ''),
                        points: pts, dice: 1, time: new Date().toLocaleString()
                    };
                    db.ref('declarations').push(req);
                    playBeep('success');
                    this.showAlert('已送出', '已同步至指揮中心審核！');
                    this.declForm.desc = '';
                },

                approveDecl(key) {
                    const req = this.declarations[key];
                    const entry = Object.entries(this.partners).find(([k, p]) => p.email === req.userEmail);
                    if (entry) {
                        const [pKey, pVal] = entry;
                        db.ref('partners/' + pKey).update({
                            points: (pVal.points || 0) + req.points,
                            totalPoints: (pVal.totalPoints || 0) + req.points,
                            diceCount: (pVal.diceCount || 0) + req.dice,
                            fyc: req.tag === 'FYC' ? (pVal.fyc || 0) + parseInt(req.details.match(/\$(\d+)/)?.[1] || 0) : pVal.fyc
                        });
                    }
                    db.ref('declarations/' + key).remove();
                    try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch(e){}
                    this.showAlert('已通過', '點數已雲端撥發！');
                },

                rejectDecl(key) {
                    db.ref('declarations/' + key).remove();
                    this.showAlert('已拒絕', '已退回申報。');
                },

                rollDice() {
                    if (this.currentUser.points < 10) { this.showAlert('點數不足', '每次需要 10 點！'); return; }
                    const entry = Object.entries(this.partners).find(([k, p]) => p.email === this.currentUser.email);
                    if (!entry) return;
                    const [pKey, pVal] = entry;

                    db.ref('partners/' + pKey).update({ points: pVal.points - 10 });
                    this.isRolling = true; this.showDiceModal = true; playBeep('dice');

                    let rolls = 0;
                    const interval = setInterval(() => {
                        this.rollingDiceNumber = Math.floor(Math.random() * 6) + 1;
                        rolls++;
                        if (rolls > 10) {
                            clearInterval(interval);
                            this.isRolling = false; this.showDiceModal = false;
                            const newPos = (pVal.position + this.rollingDiceNumber) % 30;
                            db.ref('partners/' + pKey).update({ position: newPos });
                            this.currentLandedCell = this.settings.boardCells[newPos];
                            this.showLandingModal = true;
                            playBeep('success');
                        }
                    }, 100);
                },

                closeLandingModal() {
                    this.showLandingModal = false;
                    db.ref('rewards').push({ userName: this.currentUser.name, reward: '踩中格子獎勵', time: new Date().toLocaleString(), status: '未發放' });
                },

                openCellModal(cell, index) { this.selectedCell = cell; this.selectedCellIndex = index; this.showCellDetailModal = true; },
                hasPlayerHere(idx) { return Object.values(this.partners).some(p => p.position === idx); },
                getPlayersOnCell(idx) { return Object.values(this.partners).filter(p => p.position === idx); },
                getGroupPartners() { return Object.values(this.partners).filter(p => p.group === this.currentUser?.group); },

                getTotalFYC(partner) {
                    let total = partner.fyc || 0;
                    if (partner.buffs) {
                        partner.buffs.forEach(bName => {
                            const downline = Object.values(this.partners).find(p => p.name === bName);
                            if (downline) total += (downline.fyc || 0);
                        });
                    }
                    return total;
                },

                formatCurrency(num) { return '$' + (num || 0).toLocaleString(); },

                postMessage() {
                    db.ref('messages').push({ title: this.msgForm.title, content: this.msgForm.content, isAnonymous: this.msgForm.isAnonymous, author: this.msgForm.isAnonymous ? '神秘夥伴' : this.currentUser.name, time: new Date().toLocaleString(), likes: 0 });
                    this.msgForm.title = ''; this.msgForm.content = '';
                    this.showAlert('成功', '留言已廣播至雲端！');
                },

                likeMessage(key) {
                    const msg = this.messages[key];
                    db.ref(`messages/${key}`).update({ likes: (msg.likes || 0) + 1 });
                },

                verifyAdmin() {
                    if (this.adminPassInput === this.adminPassword) { this.adminAuth = true; playBeep('success'); }
                    else { this.showAlert('錯誤', '密碼不正確！'); }
                },

                editPartner(key) {
                    this.editingKey = key;
                    this.editingPartner = JSON.parse(JSON.stringify(this.partners[key]));
                    if (!this.editingPartner.buffs) this.editingPartner.buffs = [];
                    this.showEditPartnerModal = true;
                },

                savePartnerEdit() {
                    if (this.editingKey) {
                        db.ref('partners/' + this.editingKey).set(this.editingPartner);
                        this.showEditPartnerModal = false;
                        this.showAlert('成功', '夥伴資料已雲端更新！');
                    }
                },

                promptDeletePartner(key) {
                    if (confirm('確定要刪除此夥伴嗎？')) {
                        db.ref('partners/' + key).remove();
                        this.showAlert('已刪除', '雲端名單已更新。');
                    }
                },

                saveSettings() {
                    db.ref('settings').set(this.settings);
                    this.showAlert('成功', '設定已同步至雲端！');
                },

                showAlert(title, text) {
                    this.notificationTitle = title; this.notificationText = text; this.showNotificationModal = true; playBeep('info');
                }
            }
        }
    </script>
</body>
</html>
