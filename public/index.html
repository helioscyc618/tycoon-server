<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 - Competition Tycoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #09090b;
            color: #e7e5e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: rgba(18, 18, 22, 0.95);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo-title {
            font-family: 'Noto Serif TC', serif;
            font-weight: 900;
            font-size: 24px;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1c1c24 0%, #09090b 100%);
            overflow-y: auto;
        }
        .card {
            background: rgba(28, 28, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-gold {
            width: 100%;
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn-gold:hover { opacity: 0.9; }
        .input-box {
            width: 100%;
            padding: 12px 16px;
            background: #121216;
            border: 1px solid #272732;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }
        .input-box:focus { border-color: #eab308; }
        label { font-size: 12px; color: #a8a29e; font-weight: 600; display: block; }
        .tabs { display: flex; background: #121216; padding: 4px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #272732; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #a8a29e; font-weight: 600; cursor: pointer; border-radius: 8px; font-size: 14px; }
        .tab-btn.active { background: #eab308; color: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 28px; background: #eab308; padding: 8px 12px; border-radius: 16px; color: #000;">🎲</span>
            <div>
                <h1 class="logo-title">競賽大亨</h1>
                <p style="font-size: 11px; color: #78716c; font-family: monospace;">COMPETITION TYCOON | 2026.12.14 - 2027.06.02</p>
            </div>
        </div>
        <div id="header-user-info" class="hidden" style="display: flex; align-items: center; gap: 12px;">
            <div style="text-align: right;">
                <div id="nav-username" style="font-weight: bold; font-size: 14px; color: #fde047;">--</div>
                <div id="nav-role-group" style="font-size: 11px; color: #a8a29e;">--</div>
            </div>
            <button onclick="logout()" style="background: #1c1c24; color: #e7e5e4; border: 1px solid #272732; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;">登出</button>
        </div>
    </header>

    <!-- Main Container -->
    <div id="app-container" class="container">
        <!-- 動態渲染區 -->
    </div>

    <!-- Script -->
    <script>
        function getDB() {
            let dbStr = localStorage.getItem('competition_tycoon_db');
            if (!dbStr) {
                const db = {
                    users: [
                        { username: 'admin', password: 'admin', name: '總指揮官', role: '業務經理', group: '指揮中心', email: 'admin@tycoon.com', fyc: 0, points: 100, diceCount: 10, position: 1, buffs: [], isAdmin: true }
                    ],
                    pendingSubmissions: [],
                    rewardsLog: [],
                    marqueenMessages: ['👑 歡迎登入競賽大亨黑金戰情室', '💡 提示：提交 FYC 業績自動換算點數，每次擲骰消耗 10 點！'],
                    notice: { title: '👑 競賽大亨尊榮啟動', content: '歡迎各位菁英夥伴迎向半年期衝刺！', active: true },
                    tags: {
                        'FYC': { name: 'FYC 業績', rate: 1000, points: 1 },
                        '活動邀約': { name: '活動邀約', points: 2 },
                        '增員面談': { name: '增員面談', points: 3 }
                    },
                    adminPassword: 'admin'
                };
                localStorage.setItem('competition_tycoon_db', JSON.stringify(db));
                return db;
            }
            return JSON.parse(dbStr);
        }

        function saveDB(db) { localStorage.setItem('competition_tycoon_db', JSON.stringify(db)); }

        let currentUser = JSON.parse(sessionStorage.getItem('tycoon_current_user')) || null;

        function initApp() {
            const container = document.getElementById('app-container');
            const headerUser = document.getElementById('header-user-info');
            if (!container) return;

            if (!currentUser) {
                headerUser.style.display = 'none';
                container.innerHTML = `
                    <div class="card">
                        <div style="text-align: center; margin-bottom: 24px;">
                            <span style="font-size: 48px;">👑</span>
                            <h2 style="font-family: 'Noto Serif TC', serif; font-size: 26px; color: #fde047; margin-top: 8px;">競賽大亨</h2>
                            <p style="font-size: 11px; color: #78716c;">Competition Tycoon 奢華商戰雙軌競賽</p>
                        </div>

                        <div class="tabs">
                            <button onclick="switchTab('login')" id="btn-tab-login" class="tab-btn active">登入系統</button>
                            <button onclick="switchTab('register')" id="btn-tab-reg" class="tab-btn">立即註冊</button>
                        </div>

                        <!-- Login Form -->
                        <div id="form-login">
                            <div>
                                <label>帳號 / 姓名</label>
                                <input type="text" id="login-user" class="input-box" placeholder="請輸入帳號">
                            </div>
                            <div>
                                <label>密碼</label>
                                <input type="password" id="login-pass" class="input-box" placeholder="請輸入密碼">
                            </div>
                            <button onclick="handleLogin()" class="btn-gold">進入戰情室</button>
                        </div>

                        <!-- Register Form -->
                        <div id="form-register" class="hidden">
                            <div>
                                <label>真實姓名</label>
                                <input type="text" id="reg-name" class="input-box" placeholder="例如：王大明">
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div>
                                    <label>職級</label>
                                    <select id="reg-role" class="input-box">
                                        <option value="業務專員">業務專員</option>
                                        <option value="業務主任">業務主任</option>
                                        <option value="業務襄理">業務襄理</option>
                                        <option value="業務經理">業務經理</option>
                                    </select>
                                </div>
                                <div>
                                    <label>隸屬組別</label>
                                    <input type="text" id="reg-group" class="input-box" placeholder="例如：A組">
                                </div>
                            </div>
                            <div>
                                <label>註冊帳號</label>
                                <input type="text" id="reg-username" class="input-box" placeholder="設定登入帳號">
                            </div>
                            <div>
                                <label>電子信箱</label>
                                <input type="email" id="reg-email" class="input-box" placeholder="your@email.com">
                            </div>
                            <div>
                                <label>密碼</label>
                                <input type="password" id="reg-pass" class="input-box" placeholder="設定登入密碼">
                            </div>
                            <button onclick="handleRegister()" class="btn-gold">完成註冊並登入</button>
                        </div>
                    </div>
                `;
            } else {
                headerUser.style.display = 'flex';
                document.getElementById('nav-username').innerText = currentUser.name;
                document.getElementById('nav-role-group').innerText = `${currentUser.role || '業務專員'} | ${currentUser.group}`;
                
                if (currentUser.isAdmin || currentUser.username === 'admin') {
                    container.innerHTML = `
                        <div class="card" style="max-width: 600px; text-align: center;">
                            <h2 style="color: #fde047; font-size: 22px; margin-bottom: 12px;">🛡️ 指揮中心後台</h2>
                            <p style="font-size: 14px; color: #a8a29e; margin-bottom: 24px;">總指揮官已成功登入，系統運行正常！</p>
                            <button onclick="logout()" class="btn-gold">登出系統</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="card" style="max-width: 600px; text-align: center;">
                            <h2 style="color: #fde047; font-size: 22px; margin-bottom: 12px;">👑 歡迎回來，${currentUser.name}！</h2>
                            <p style="font-size: 14px; color: #a8a29e; margin-bottom: 8px;">職級：${currentUser.role} | 組別：${currentUser.group}</p>
                            <p style="font-size: 16px; color: #facc15; font-weight: bold; margin-bottom: 24px;">可用點數：${currentUser.points || 0} P</p>
                            <button onclick="logout()" class="btn-gold">登出系統</button>
                        </div>
                    `;
                }
            }
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnReg = document.getElementById('btn-tab-reg');
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                btnLogin.classList.add('active');
                btnReg.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                btnReg.classList.add('active');
                btnLogin.classList.remove('active');
            }
        }

        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const db = getDB();

            if (u === 'admin' && p === db.adminPassword) {
                currentUser = db.users.find(x => x.username === 'admin') || { username: 'admin', name: '總指揮官', isAdmin: true };
                sessionStorage.setItem('tycoon_current_user', JSON.stringify(currentUser));
                initApp();
                return;
            }

            const found = db.users.find(x => x.username === u && x.password === p);
            if (found) {
                currentUser = found;
                sessionStorage.setItem('tycoon_current_user', JSON.stringify(currentUser));
                initApp();
            } else {
                alert('帳號或密碼錯誤！');
            }
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const role = document.getElementById('reg-role').value;
            const group = document.getElementById('reg-group').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value.trim();

            if (!name || !username || !password || !email || !group) {
                alert('請完整填寫註冊欄位！');
                return;
            }

            const db = getDB();
            if (db.users.some(x => x.username === username)) {
                alert('此帳號已被註冊！');
                return;
            }

            const newUser = {
                username, password, name, role, group, email,
                fyc: 0, points: 0, diceCount: 0, position: 1, buffs: [], isAdmin: false
            };

            db.users.push(newUser);
            saveDB(db);

            currentUser = newUser;
            sessionStorage.setItem('tycoon_current_user', JSON.stringify(currentUser));
            initApp();
        }

        function logout() {
            currentUser = null;
            sessionStorage.removeItem('tycoon_current_user');
            initApp();
        }

        window.onload = function() { initApp(); };
    </script>
</body>
</html>
