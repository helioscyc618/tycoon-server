<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競賽大亨 - Competition Tycoon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        luxury: { 950: '#09090b', 900: '#121216', 800: '#1c1c24' },
                        gold: { 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(28, 28, 36, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.25);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-full bg-luxury-950 text-stone-200 font-sans antialiased flex flex-col">

    <!-- Header -->
    <header class="bg-luxury-900/90 backdrop-blur-md shadow-xl px-6 py-4 flex items-center justify-between border-b border-gold-500/20">
        <div class="flex items-center space-x-3">
            <span class="text-3xl bg-gradient-to-br from-gold-400 to-gold-600 p-2.5 rounded-2xl shadow-lg text-black font-bold">🎲</span>
            <div>
                <h1 class="text-2xl font-serif font-black tracking-widest gold-gradient-text">競賽大亨</h1>
                <p class="text-xs text-stone-400 font-mono">COMPETITION TYCOON | 2026.12.14 - 2027.06.02</p>
            </div>
        </div>
    </header>

    <!-- Main Content: 直接直出登入框，絕不白屏 -->
    <main class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-luxury-950 via-luxury-900 to-black">
        <div class="glass-card rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gold-500/35">
            <div class="text-center mb-6">
                <span class="text-5xl bg-luxury-800 p-3.5 rounded-2xl inline-block mb-3 shadow-lg border border-gold-500/20">👑</span>
                <h2 class="text-3xl font-serif font-black gold-gradient-text tracking-wider">競賽大亨</h2>
                <p class="text-xs text-stone-400 mt-1 font-mono">Competition Tycoon 奢華商戰雙軌競賽</p>
            </div>

            <!-- Login Form -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">帳號 / 姓名</label>
                    <input type="text" id="login-user" class="w-full px-4 py-3 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="請輸入帳號 (例如: admin)">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-400 mb-1">密碼</label>
                    <input type="password" id="login-pass" class="w-full px-4 py-3 bg-luxury-900 border border-stone-700 rounded-xl text-sm focus:ring-2 focus:ring-gold-500 text-white outline-none" placeholder="請輸入密碼 (例如: admin)">
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 text-black py-3.5 rounded-xl font-bold shadow-lg shadow-gold-500/20 transition">進入戰情室</button>
            </div>
        </div>
    </main>

    <script>
        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if (u === 'admin' && p === 'admin') {
                alert('歡迎登入總指揮官後台！');
                location.reload();
            } else {
                alert('登入成功！');
            }
        }
    </script>
</body>
</html>
